name: C3X 0.18 Case11 TT Older Root-Call Singletons
on:
  push:
    paths:
      - 'harness/c3x_018_case11_old_reader_late_root_call_singletons_native.py'
      - '.github/workflows/c3x-018-case11-old-singletons.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  old-reader-singletons:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin chess source validator
        run: |
          python -m pip install -q chess==1.11.2
          python -m py_compile harness/c3x_018_case11_old_reader_late_root_call_singletons_native.py
      - name: Engine-free December original full game source
        uses: actions/download-artifact@v4
        with:
          name: c3x-018-december2025-blind12-source
          path: source/
          repository: WhoSia/C3X
          run-id: '37987794988'
          github-token: ${{ github.token }}
      - name: Previous exact age-gated native group witness
        uses: actions/download-artifact@v4
        with:
          name: c3x-018-case11-actual-writer-age-conditional-gate
          path: earlier/
          repository: WhoSia/C3X
          run-id: '37988654788'
          github-token: ${{ github.token }}
      - name: Verify unchanged previous observations
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(sha256sum source/C3X018_DECEMBER12_INDEPENDENT_GAMES.json | cut -d' ' -f1)" = 51366a480fe2631005dbded7992e870443ef6dd2dfd785fd10952d6eeff5e7cd
          test "$(sha256sum earlier/CASE11_ACTUAL_OLDER_TT_READER_COUNTERFACTUAL.json | cut -d' ' -f1)" = b035c8d184d4c3c474d8592793af442f00fb135276426db1e78d447999609952
      - name: Same frozen Stockfish16 physical writer and exact conditional reader gates
        run: |
          set -euo pipefail
          root=/tmp/C3X018_CASE11_OLDER_SINGLETON
          git clone -q --single-branch --branch sf_16 https://github.com/official-stockfish/Stockfish.git "$root"
          test "$(git -C "$root" rev-parse HEAD)" = 68e1e9b3811e16cad014b590d7443b9063b3eb52
          python tools/c3x_016_P4_independent_12root_source_order_patch.py --source "$root" --out-manifest evidence/P4.json
          python tools/c3x_017_early_depth1_root_window_trace_patch.py --source "$root" --out-manifest evidence/ROOT.json
          python tools/c3x_018_trial_call_identity_patch.py --source "$root" --out-manifest evidence/TRIAL.json
          python tools/c3x_018_physical_epoch_lineage_patch.py --source "$root" --out-manifest evidence/EPOCH.json
          python tools/c3x_018_tt_eval_consumption_overlay.py --source "$root" --out-manifest evidence/V.json
          python tools/c3x_018_physical_value_witness_overlay.py --source "$root" --out-manifest evidence/WRITER_VALUE.json
          python tools/c3x_018_root_TT_genealogy_overlay.py --source "$root" --out-manifest evidence/ROOT_OWNER.json
          python tools/c3x_018_TT_reader_writer_age_bound_root_feature_overlay.py --source "$root" --out-manifest evidence/READER_FEATURES.json
          python tools/c3x_018_adaptive_writer_age_root_call_V_gate.py --source "$root" --out-manifest evidence/ROOT_CALL_FILTER.json
          git -C "$root" diff -- src/ > evidence/NATIVE_SOURCE_DIFF.patch
          make -s -C "$root/src" -j2 build ARCH=x86-64
          sha256sum "$root/src/stockfish" > evidence/NATIVE_BINARY_SHA256.txt
      - name: Test age64 targeted reader calls 9-13 plus negative call8
        run: |
          set -euo pipefail
          python -u harness/c3x_018_case11_old_reader_late_root_call_singletons_native.py \
            --source source/C3X018_DECEMBER12_INDEPENDENT_GAMES.json \
            --prior-exact earlier/CASE11_ACTUAL_OLDER_TT_READER_COUNTERFACTUAL.json \
            --engine /tmp/C3X018_CASE11_OLDER_SINGLETON/src/stockfish \
            --out evidence/CASE11_OLDER_FIVE_SOURCE_SINGLETONS.json | tee evidence/NATIVE_STDOUT.txt
      - name: Source evidence SHA
        if: always()
        run: |
          mkdir -p evidence
          find evidence -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > evidence/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-018-case11-five-old-reader-root-call-singletons
          path: evidence/
          retention-days: 90
          if-no-files-found: error
