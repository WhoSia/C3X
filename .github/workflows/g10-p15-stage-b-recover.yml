name: c3x-g10-p15-stage-b-recover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/g10-p15-stage-b-recover.yml'
      - 'tools/g10_p15_preference_support.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FAILED_STAGE_B_RUN: "37119099754"
  P15_STAGE_A_RUN: "37118943324"
  P14_PAIR_RUN: "37115769095"

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check python-chess==1.999
      - uses: actions/download-artifact@v4
        with:
          name: g10-p15-stage-a-sealed
          path: stagea
          repository: WhoSia/C3X
          run-id: ${{ env.P15_STAGE_A_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: g10-p14-pair-freeze-sealed
          path: pair
          repository: WhoSia/C3X
          run-id: ${{ env.P14_PAIR_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: g10-p15-stage-b-worlds-*
          path: worlds
          repository: WhoSia/C3X
          run-id: ${{ env.FAILED_STAGE_B_RUN }}
          github-token: ${{ github.token }}
      - name: Recover Stage-B aggregate only
        run: |
          python3 tools/g10_p15_preference_support.py aggregate             --stage-a stagea/g10-p15-stage-a.json             --pair-freeze pair/g10-p14-pair-freeze.json             --worlds worlds             --out g10-p15-stage-b.json
          python3 - <<'PY'
          import json
          r=json.load(open("g10-p15-stage-b.json"))
          assert r["selected_grammar"]=="G2_SAME_TYPE_SIDE_COLLATERAL"
          assert r["edited_native_choice_consulted"] is False
          assert r["search_event_outcomes_consulted"] is False
          assert r["defect_outcomes_consulted"] is False
          print("G10_P15_STAGE_B_RECOVER_VERDICT",r["verdict"])
          print("POSITIONS",r["preference_supported_chain_positions"],r["admitted_pair_positions"],r["chain_fraction_of_pairs"])
          print("CELLS",r["context_cells_with_chain_support"],r["supported_cells"])
          print("ENGINES",r["supporting_engines_by_source"])
          print("STAGE_C_ALLOC",len(r["stage_c_allocation"]))
          PY
          sha256sum g10-p15-stage-b.json > g10-p15-stage-b.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: g10-p15-stage-b-sealed
          path: |
            g10-p15-stage-b.json
            g10-p15-stage-b.sha256
          retention-days: 90
