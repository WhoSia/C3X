name: C3X 0.25 M5 B June32 Human Git Presealed Physical Q TT SCORE
on:
  push:
    paths:
      - 'harness/c3x_025_M5_B_physical_original_qscore_court.mjs'
      - '.github/workflows/c3x-025-M5-B-June2026-32-original-physical-score.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prospective-original-physical:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: c3x-025-M5-S-june2026-new32-source-only
          path: source/
          repository: WhoSia/C3X
          run-id: '38193633037'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: c3x-025-M5-A-June32-original-native-untreated-preFIRST
          path: stageA/
          repository: WhoSia/C3X
          run-id: '38193949242'
          github-token: ${{ github.token }}
      - name: Confirm exact source game identities and full literal human Git seal exist BEFORE physical run
        run: |
          set -euo pipefail
          test "$(sha256sum source/C3X025_M5_S_JUNE2026_32_SOURCE_ONLY.json | awk '{print $1}')" = 71ab8e4c4ddb52d8f63e6e51ea6b4cf991e135246773460c3d6f4800288521be
          git cat-file -e 9e3c50c4ecf77f87bd8f8108ef59958d3adaaa35^{commit}
          git cat-file -e 5a1c58844dcf390407d361ad061a54fac09d76ee^{commit}
          test -s c3x/forecasts/c3x-025-M5-A-June2026-32game-M0-M5-exact-literal-UCI-before-native-SCORE-human-Git-20261012.json
          python3 -m pip install -q chess==1.11.2
          python3 - <<'PY'
          import chess,json
          src=json.load(open('source/C3X025_M5_S_JUNE2026_32_SOURCE_ONLY.json'))
          forecast=json.load(open('c3x/forecasts/c3x-025-M5-A-June2026-32game-M0-M5-exact-literal-UCI-before-native-SCORE-human-Git-20261012.json'))
          stage=json.load(open('stageA/M5_A_UNTREATED_32_NATIVE_AND_LITERAL_CANDIDATE.json'))
          assert len(src['selected'])==len(forecast['exact_UCI_by_game'])==len(stage['cases'])==32
          assert stage['actual_first_intervention_count']==0 and not stage['treated_outcomes_seen']
          assert forecast['positive_M5_trigger_games']==9
          for boardrow,f,s in zip(src['selected'],forecast['exact_UCI_by_game'],stage['cases']):
              assert boardrow['source_game_sha256']==f['source_game_sha256']==s['source_game_sha256']
              b=chess.Board(boardrow['fen4']+' '+str(boardrow['source_halfmove_clock'])+' '+str(boardrow['source_fullmove_number']))
              assert b.is_valid()
              for field in ('M0_original_untreated_depth7_UCI','M5_frozen_source_rule_UCI'):
                  m=chess.Move.from_uci(f[field]);assert m in b.legal_moves,('FORECAST_ILLEGAL',boardrow['id'],field)
              assert f['M0_original_untreated_depth7_UCI']==s['original_depth7_exact_UCI']
              assert not f['M5_predicted_change'] or f['M5_frozen_source_rule_UCI']==s['original_depth6_exact_UCI']
          print('M5_B_PREACTUATION_ALL_32_HUMAN_GIT_SEALED_LEGAL_UCI_AND_SOURCE_SHA_PASS')
          PY
          node --check harness/c3x_025_M5_B_physical_original_qscore_court.mjs
          mkdir -p derived
      - name: Pinned original Stockfish16 and exact reversible native physical SCORE source
        run: |
          set -euo pipefail
          git clone -q --single-branch --branch sf_16 https://github.com/official-stockfish/Stockfish.git /tmp/c3x-m5b-original
          test "$(git -C /tmp/c3x-m5b-original rev-parse HEAD)" = 68e1e9b3811e16cad014b590d7443b9063b3eb52
          test "$(sha256sum /tmp/c3x-m5b-original/src/search.cpp | cut -d' ' -f1)" = 21b79baa7ce9dabec5b3b9e3854bed9869a1935277247832e550cf395bccd644
          cp -a /tmp/c3x-m5b-original /tmp/c3x-m5b-physical
          make -s -C /tmp/c3x-m5b-original/src -j2 build ARCH=x86-64
          python3 tools/c3x_025_P14_P0_qscore_qhint_factorial_overlay.py --root /tmp/c3x-m5b-physical --out-manifest derived/PHYSICAL_SOURCE_EXACT_REVERSE.json
          python3 tools/c3x_025_P9_R1_native_root_final_source_endpoint_overlay.py --source /tmp/c3x-m5b-physical --out-manifest derived/ROOT_ENDPOINT.json
          make -s -C /tmp/c3x-m5b-physical/src -j2 build ARCH=x86-64
      - name: FIRST physical native TT Q score return intervention AFTER literal human Git seal
        run: |
          set -euo pipefail
          node harness/c3x_025_M5_B_physical_original_qscore_court.mjs \
            source/C3X025_M5_S_JUNE2026_32_SOURCE_ONLY.json \
            stageA/M5_A_UNTREATED_32_NATIVE_AND_LITERAL_CANDIDATE.json \
            c3x/forecasts/c3x-025-M5-A-June2026-32game-M0-M5-exact-literal-UCI-before-native-SCORE-human-Git-20261012.json \
            /tmp/c3x-m5b-original/src/stockfish /tmp/c3x-m5b-physical/src/stockfish \
            derived/M5_B_INDEPENDENT_FIRST_ACTUAL_NATIVE_32_SCORE.json
          python3 tools/c3x_023_rights_preupload_gate.py --tier P2_AGGREGATE_SUMMARY --file derived/M5_B_INDEPENDENT_FIRST_ACTUAL_NATIVE_32_SCORE.json --report derived/RIGHTS.json
          echo 'Original June 2026 Lichess broadcaster CC BY-SA4.0 license. Minimal extracted root/source SHA, exact source-Git-presealed UCI and true original SF16 native intervention results. No full PGNs, human player identities, secret original private keys or modified GPL binaries. Outcomes cannot retroactively change forecasts.' > derived/SCIENTIFIC_SCOPE.txt
          find derived -maxdepth 1 -type f ! -name SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > derived/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-025-M5-B-june32-presealed-first-physical-score-derived
          path: derived/
          retention-days: 90
