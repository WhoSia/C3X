name: C3X 0.18 November Twelve Reader Rank Horizon Test
on:
  push:
    paths:
      - 'harness/c3x_018_nov12_depth8_12_TT_consumer_rank_native.py'
      - '.github/workflows/c3x-018-nov12-reader-rank-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  depth8-depth12-three-reader-ranks:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent rule parser and source syntax
        run: |
          python -m pip install -q chess==1.11.2
          python -m py_compile harness/c3x_018_nov12_depth8_12_TT_consumer_rank_native.py
          python -m py_compile tools/c3x_018_physical_value_witness_overlay.py
      - name: Source-only November Lichess twelve games from pre-outcome freeze
        uses: actions/download-artifact@v4
        with:
          name: c3x-018-november-blind12-chess-source
          path: new_source/
          repository: WhoSia/C3X
          run-id: '37985213908'
          github-token: ${{ github.token }}
      - name: Pin new external cohort exact bytes
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(sha256sum new_source/C3X018_NOVEMBER_12_BLIND_GAMES.json | cut -d' ' -f1)" = 2971fe617f39fbba6d40fb0b09d8a18ce247d5865dc807fcdab9a594e3473402
          cp new_source/C3X018_NOVEMBER_12_BLIND_GAMES.json evidence/SOURCE_NOVEMBER12.json
      - name: Compile fixed SF16 physical TT reader events
        run: |
          set -euo pipefail
          root=/tmp/C3X018_NOV12_NATIVE
          git clone -q --single-branch --branch sf_16 https://github.com/official-stockfish/Stockfish.git "$root"
          test "$(git -C "$root" rev-parse HEAD)" = 68e1e9b3811e16cad014b590d7443b9063b3eb52
          python tools/c3x_016_P4_independent_12root_source_order_patch.py --source "$root" --out-manifest evidence/P4.json
          python tools/c3x_018_physical_epoch_lineage_patch.py --source "$root" --out-manifest evidence/TT_EPOCH.json
          python tools/c3x_018_tt_eval_consumption_overlay.py --source "$root" --out-manifest evidence/V_GATE.json
          python tools/c3x_018_physical_value_witness_overlay.py --source "$root" --out-manifest evidence/READER_POSITION_WITNESS.json
          git -C "$root" diff -- src/ > evidence/SOURCE_DIFF.patch
          make -s -C "$root/src" -j2 build ARCH=x86-64
          sha256sum "$root/src/stockfish" > evidence/BINARY_SHA256.txt
      - name: Run all 12 x 2 depth x 3 prespecified TT reader ranks
        run: |
          set -euo pipefail
          python -u harness/c3x_018_nov12_depth8_12_TT_consumer_rank_native.py \
            --source evidence/SOURCE_NOVEMBER12.json \
            --engine /tmp/C3X018_NOV12_NATIVE/src/stockfish \
            --out evidence/NOVEMBER12_TT_READER_RANK_DEPTH8_12.json | tee evidence/NATIVE_STDOUT.txt
          python - <<'PY'
          import json
          q=json.load(open("evidence/NOVEMBER12_TT_READER_RANK_DEPTH8_12.json"))
          assert q["summary"]["prespecified_depth_cells"]==24
          assert q["summary"]["T6_FULL_DENOMINATOR"]=="PASS"
          print("C3X018_NOV_TT_RANK_COMPLETE_SOURCE_COURT_PASS")
          PY
      - name: Hash evidence
        if: always()
        run: |
          mkdir -p evidence
          find evidence -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > evidence/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-018-nov12-depth8-12-reader-ranks
          path: evidence/
          retention-days: 90
          if-no-files-found: error
