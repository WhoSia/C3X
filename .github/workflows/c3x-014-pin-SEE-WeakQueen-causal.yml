name: C3X 0.14 Native SEE Pin and WeakQueen Role Surgical Causal Court
on:
  push:
    paths:
      - '.github/workflows/c3x-014-pin-SEE-WeakQueen-causal.yml'
      - 'tools/c3x_014_SEE_and_classic_WeakQueen_role_intervention.py'
      - 'harness/c3x_014_PIN_SEE_WeakQueen_role_causal_five_arm_court.py'
      - 'harness/c3x_014_official_pin_NNUE_vs_classic_phenotype_court.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pin-see-and-weakqueen-causal:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install chess-source verifier and SF16 compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git make g++
          python -m pip install --disable-pip-version-check chess==1.11.2
          python -m py_compile tools/c3x_014_SEE_and_classic_WeakQueen_role_intervention.py harness/c3x_014_PIN_SEE_WeakQueen_role_causal_five_arm_court.py
          mkdir -p source-only original-native output
      - uses: actions/download-artifact@v4
        with:
          name: c3x-014-TCEC-source-only-chess-pin-law-subtype-witnesses
          path: source-only/
          repository: WhoSia/C3X
          run-id: '37886383505'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: c3x-014-SF16-real-pin-legal-SEE-mobility-WeakQueen-branch-court
          path: original-native/
          repository: WhoSia/C3X
          run-id: '37888968410'
          github-token: ${{ github.token }}
      - name: Exact 40 source-only root worlds and original real 160-run native baseline
        run: |
          printf '%s  %s\n' 'cfb2c4b0631959cfcdd5bf1eb098f7b41c40468a7b22e434e95ef8936cc43ead' 'source-only/C3X014_OFFICIAL_CHESS_PIN_SUBTYPES_SOURCE_ONLY.json' | sha256sum -c -
          printf '%s  %s\n' '5f3c64e9ef2ac074786d86be96c404635e269483b1692d3ea1a713f0d0f9e77a' 'original-native/C3X014_SF16_NATIVE_PIN_BRANCHES_FROZEN40_REAL.json' | sha256sum -c -
      - name: Compile pinned Stockfish16 with ONLY nonlegal SEE pin and classical WeakQueen role score interventions
        run: |
          git clone -q --single-branch --branch sf_16 https://github.com/official-stockfish/Stockfish.git /tmp/C3X014_PIN_CAUSAL
          test "$(git -C /tmp/C3X014_PIN_CAUSAL rev-parse HEAD)" = "68e1e9b3811e16cad014b590d7443b9063b3eb52"
          python tools/c3x_014_patch_native_pin_operators.py --source /tmp/C3X014_PIN_CAUSAL --out-manifest output/PASSIVE_PIN_BRANCH_PATCH.json
          python tools/c3x_014_SEE_and_classic_WeakQueen_role_intervention.py --source /tmp/C3X014_PIN_CAUSAL --out-manifest output/ACTUAL_SEE_WEAKQUEEN_CAUSAL_PATCH.json
          git -C /tmp/C3X014_PIN_CAUSAL diff -- src/position.cpp src/evaluate.cpp src/search.cpp > output/ALL_NATIVE_SEE_WEAKQUEEN_COURT_CPP_SOURCE_DIFF.patch
          cp /tmp/C3X014_PIN_CAUSAL/src/c3x014_pin_trace.h output/NATIVE_PIN_TRACE_HEADER.h
          cp /tmp/C3X014_PIN_CAUSAL/Copying.txt output/Stockfish_GPLv3.txt
          test -s output/ALL_NATIVE_SEE_WEAKQUEEN_COURT_CPP_SOURCE_DIFF.patch
          make -s -C /tmp/C3X014_PIN_CAUSAL/src -j2 build ARCH=x86-64
          cp /tmp/C3X014_PIN_CAUSAL/src/stockfish /tmp/C3X014_PIN_CAUSAL_bin
          sha256sum /tmp/C3X014_PIN_CAUSAL_bin > output/NATIVE_SF16_5_ARM_BINARY_SHA256.txt
      - name: Execute 400 actual source-native SF16 processes, five causal arms in 40 original legal source roots with two cold starts
        run: |
          python harness/c3x_014_PIN_SEE_WeakQueen_role_causal_five_arm_court.py --source source-only/C3X014_OFFICIAL_CHESS_PIN_SUBTYPES_SOURCE_ONLY.json --parent original-native/C3X014_SF16_NATIVE_PIN_BRANCHES_FROZEN40_REAL.json --engine /tmp/C3X014_PIN_CAUSAL_bin --out output/C3X014_SF16_40_SOURCE_WORLDS_SEE_WEAKQUEEN_FIVE_ARM_CAUSAL.json
          python - <<'PY'
          import json
          a=json.load(open('output/C3X014_SF16_40_SOURCE_WORLDS_SEE_WEAKQUEEN_FIVE_ARM_CAUSAL.json'))
          assert a['formal_research_unit']=='C3X 0.14'
          assert a['actual_SF16_software_treatment_native_processes']==400
          assert a['cold_repeat_all_treatments']=='200/200'
          assert a['untreated_OFF_whole_native_search_output_and_site_counters_exact_vs_previous']=='40/40'
          assert a['zero_branch_fired_means_zero_UCI_mutation_gate']=='PASS'
          assert a['source_PIN_legal_move_generator_unchanged']
          assert not a['claim_isolated_source_root_pin_causal_effect'] and not a['claim_independent_NNUE_learned_hidden_pin_categories']
          assert not a['procedural_P1_sealed_four_games_opened']
          print('C3X014_SF16_CAUSAL_SEE_WEAKQUEEN_FIVE_ARM_SCIENCE_GATE_PASS')
          PY
      - name: Retain original baseline, exact C++, real engine outputs and formal authority scope
        if: always()
        run: |
          cp tools/c3x_014_SEE_and_classic_WeakQueen_role_intervention.py output/EXACT_SF16_CAUSAL_OPERATOR_SOURCE_PATCHER.py
          cp harness/c3x_014_PIN_SEE_WeakQueen_role_causal_five_arm_court.py output/400_NATIVE_SF16_CAUSAL_PROCESSES_RUNNER.py
          cp harness/c3x_014_official_pin_NNUE_vs_classic_phenotype_court.py output/SF16_ORIGINAL_UCI_DRIVER.py
          cp source-only/C3X014_OFFICIAL_CHESS_PIN_SUBTYPES_SOURCE_ONLY.json output/40_CHESS_LAW_FROZEN_ORIGINAL_SOURCE.json
          cp original-native/C3X014_SF16_NATIVE_PIN_BRANCHES_FROZEN40_REAL.json output/EXACT_OLD_SF16_NATIVE_PIN_SOURCE_BASELINE.json
          cp c3x/ontology/c3x-014-bounded-TT-return-census-and-pin-subtypes-precommit.md output/CAUSAL_INTERVENTION_PRECOMMIT_SOURCE.md
          printf '%s\n' 'Chess legality unchanged. Source intervention targets SEE pinned recapture or Classical WeakQueen score during WHOLE search. Root changes are engine software mechanism causality only, not isolated root pin causal attribution or NNUE feature identification.' > output/CAUSAL_EVIDENCE_CEILING.txt
          find output -maxdepth 1 -type f ! -name 'MEMBER_SHA256.txt' -print0 | sort -z | xargs -0 sha256sum > output/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-014-SF16-SEE-pin-WeakQueen-role-five-arm-causal
          path: output/
          if-no-files-found: error
          retention-days: 90
