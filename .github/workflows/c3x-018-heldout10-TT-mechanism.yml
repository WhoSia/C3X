name: C3X 0.18 Heldout Ten TT Mechanism Court
on:
  push:
    paths:
      - 'harness/c3x_018_heldout10_TT_mechanism_native.py'
      - '.github/workflows/c3x-018-heldout10-TT-mechanism.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ten-independent-source-roots:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source runner syntax
        run: |
          python -m py_compile harness/c3x_018_heldout10_TT_mechanism_native.py
          python -m py_compile tools/c3x_018_physical_epoch_lineage_patch.py
      - name: Frozen P4 native baseline
        uses: actions/download-artifact@v4
        with:
          name: c3x-016-P4-12-Lichess-root-order-72-native
          path: baseline/
          repository: WhoSia/C3X
          run-id: '37948775813'
          github-token: ${{ github.token }}
      - name: Compile SF16 original root operator and physical epoch shadow
        run: |
          set -euo pipefail
          mkdir -p evidence
          root=/tmp/C3X018_TEN_SOURCE_WORLDS
          git clone -q --single-branch --branch sf_16 https://github.com/official-stockfish/Stockfish.git "$root"
          test "$(git -C "$root" rev-parse HEAD)" = 68e1e9b3811e16cad014b590d7443b9063b3eb52
          python tools/c3x_016_P4_independent_12root_source_order_patch.py --source "$root" --out-manifest evidence/ROOT_PATCH.json
          python tools/c3x_018_physical_epoch_lineage_patch.py --source "$root" --out-manifest evidence/TT_EPOCH_PATCH.json
          git -C "$root" diff -- src/search.cpp src/tt.cpp src/tt.h > evidence/SOURCE_DIFF.patch
          make -s -C "$root/src" -j2 build ARCH=x86-64
          cp "$root/src/stockfish" /tmp/C3X018_HELDOUT_NATIVE
          sha256sum /tmp/C3X018_HELDOUT_NATIVE > evidence/NATIVE_BINARY_SHA256.txt
      - name: Ten frozen distinct source-game roots TT W1 W2 R with decoy
        run: |
          set -euo pipefail
          python -u harness/c3x_018_heldout10_TT_mechanism_native.py \
            --cohort c3x/cohorts/c3x-016-P4-12-independent-Lichess-legal-root-order-sourceonly-frozen.json \
            --prior baseline/C3X016_P4_12_LICHESS_MULTIMOTIF_ROOT_ORDER_72_NATIVE.json \
            --patched /tmp/C3X018_HELDOUT_NATIVE \
            --out evidence/HELDOUT_TEN_TT_MECHANISM.json | tee evidence/NATIVE_STDOUT.txt
          python - <<'PY'
          import json
          j=json.load(open("evidence/HELDOUT_TEN_TT_MECHANISM.json"))
          assert j["summary"]["total_frozen"]==10
          assert [x["id"] for x in j["cases"]]==[1,2,3,4,5,7,9,10,11,12]
          print("C3X018_TEN_HELDOUT_COMPLETE_DENOMINATOR_PASS")
          PY
      - name: Source and output SHA
        if: always()
        run: |
          mkdir -p evidence
          find evidence -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > evidence/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-018-heldout-ten-TT-frozen-source-court
          path: evidence/
          retention-days: 90
          if-no-files-found: error
