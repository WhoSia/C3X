name: C3X 0.25 I10-P8 Native Ingest

on:
  push:
    paths:
      - "tools/i10_p8_native_trace_adapter.py"
      - "tests/test_i10_p8_native_trace_adapter.py"
      - ".github/workflows/c3x-i10-p8-native-ingest.yml"
  pull_request:
    paths:
      - "tools/i10_p8_native_trace_adapter.py"
      - "tests/test_i10_p8_native_trace_adapter.py"
      - ".github/workflows/c3x-i10-p8-native-ingest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-ingest-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test native trace adapter
        run: |
          python -m unittest discover \
            -s tests \
            -p 'test_i10_p8_native_trace_adapter.py' \
            -v
