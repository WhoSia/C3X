name: c3x-g10-p14-balanced-harvest

on:
  push:
    branches: [main]
    paths:
      - 'c3x/ontology/g10-p14-constitution.json'
      - 'tools/g10_p14_balanced_harvest.py'
      - '.github/workflows/g10-p14-balanced-harvest.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check python-chess==1.999
      - name: Download prior selected-source artifacts for exclusion
        uses: actions/download-artifact@v4
        with:
          pattern: g10-p*-source-corpus-sealed
          path: hist
          repository: WhoSia/C3X
          github-token: ${{ github.token }}
          run-id: "36951016134"
        continue-on-error: true
      - name: Download P7 prior source corpus
        uses: actions/download-artifact@v4
        with:
          name: g10-p7-source-corpus-sealed
          path: hist/p7
          repository: WhoSia/C3X
          github-token: ${{ github.token }}
          run-id: "36975500509"
      - name: Acquire four TWIC issue bytes
        run: |
          set -euxo pipefail
          mkdir -p data
          curl -L --fail --retry 3 -o data/twic1659g.zip https://theweekinchess.com/zips/twic1659g.zip
          curl -L --fail --retry 3 -o data/twic1660g.zip https://theweekinchess.com/zips/twic1660g.zip
          curl -L --fail --retry 3 -o data/twic1663g.zip https://theweekinchess.com/zips/twic1663g.zip
          curl -L --fail --retry 3 -o data/twic1664g.zip https://theweekinchess.com/zips/twic1664g.zip
          echo "67462b854b974e5425216d6ad1387489d9e34a61850c8fde84f637aefcda53f6  data/twic1659g.zip" | sha256sum -c -
          echo "f46e172fa2ed5fe53cc465e44f3c8f321685d123006e32b6f531b95dafffc263  data/twic1660g.zip" | sha256sum -c -
          echo "36ac4a1324a21674649f7b5eb12e0ef21167b18288917cce6aba3d8120669dd9  data/twic1663g.zip" | sha256sum -c -
          echo "e760b3419af0e441d74dad500130b2d585e3dfff6f3954244b957e61b3d3572a  data/twic1664g.zip" | sha256sum -c -
          unzip -p data/twic1659g.zip > data/twic1659.pgn
          unzip -p data/twic1660g.zip > data/twic1660.pgn
          unzip -p data/twic1663g.zip > data/twic1663.pgn
          unzip -p data/twic1664g.zip > data/twic1664.pgn
      - name: Engine-blind balanced harvest
        run: |
          python3 tools/g10_p14_balanced_harvest.py             --source "P14_SRC_TWIC_1659|data/twic1659.pgn|67462b854b974e5425216d6ad1387489d9e34a61850c8fde84f637aefcda53f6"             --source "P14_SRC_TWIC_1660|data/twic1660.pgn|f46e172fa2ed5fe53cc465e44f3c8f321685d123006e32b6f531b95dafffc263"             --source "P14_SRC_TWIC_1663|data/twic1663.pgn|36ac4a1324a21674649f7b5eb12e0ef21167b18288917cce6aba3d8120669dd9"             --source "P14_SRC_TWIC_1664|data/twic1664.pgn|e760b3419af0e441d74dad500130b2d585e3dfff6f3954244b957e61b3d3572a"             --exclude c3x --exclude hist             --game-limit 6144 --ply-lo 12 --ply-hi 160             --min-cell-support 3 --per-source-cell 2             --out g10-p14-balanced-corpus.json
          python3 - <<'PY'
          import json
          r=json.load(open("g10-p14-balanced-corpus.json"))
          assert r["selection"]["engine_outcomes_consulted"] is False
          assert r["selection"]["certificate_outcomes_consulted"] is False
          print("G10_P14_HARVEST_VERDICT",r["verdict"])
          print("G10_P14_GATE",r["gate"])
          print("G10_P14_CELLS",r["admissible_cells"])
          PY
          sha256sum g10-p14-balanced-corpus.json > g10-p14-balanced-corpus.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: g10-p14-balanced-corpus-sealed
          path: |
            g10-p14-balanced-corpus.json
            g10-p14-balanced-corpus.sha256
          retention-days: 90
