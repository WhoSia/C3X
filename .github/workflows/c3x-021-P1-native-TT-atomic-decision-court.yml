name: C3X 0.21 P1 March Native TT and Atomic Chess Choice Court
on:
  push:
    paths:
      - '.github/workflows/c3x-021-P1-native-TT-atomic-decision-court.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-independent-march-TT-atomic-root-choice:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python and source-anchor negative fixture tests
        run: |
          python -m pip install -q chess==1.11.2
          python -m py_compile tools/c3x_019_root_return_one_site_rescue_overlay.py
          python -m py_compile harness/c3x_019_Feb_four_first_root_return_rescue_native.py
          python -m py_compile harness/c3x_018_native_TT_lineage_factorial_6_8.py
          python -m unittest discover -s tools -p 'test_c3x_019_root_return_one_site_rescue.py' -v
          python -m py_compile tools/c3x_020_multi_state_root_repair_overlay.py
          python -m py_compile harness/c3x_020_B_minimal_multi_state_native_court.py
          python -m unittest discover -s tools -p 'test_c3x_020_multi_state_root_repair.py' -v
          python -m py_compile harness/c3x_020_C_alpha_gate_threshold_ladder_native.py
          python -m unittest discover -s tools -p 'test_c3x_020_C_alpha_gate_ladder.py' -v
          python -m py_compile harness/c3x_021_P1_march_native_TT_atomic_bridge.py
          python -m unittest discover -s tools -p 'test_c3x_021_P1_native_TT_atomic_bridge.py' -v
      - name: Previously independent March16 SOURCE ONLY no prior native outcome
        uses: actions/download-artifact@v4
        with:
          name: c3x-020-C2-march2026-enginefree-blind16-source
          path: march/
          repository: WhoSia/C3X
          run-id: '38038059013'
          github-token: ${{ github.token }}
      - name: Engine-free 635 chess root action transitions before this native court
        uses: actions/download-artifact@v4
        with:
          name: c3x-021-P1-all-legal-atomic-march16-source
          path: atomic/
          repository: WhoSia/C3X
          run-id: '38039330829'
          github-token: ${{ github.token }}
      - name: Verify two frozen March source hashes and denominators
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(sha256sum march/C3X020_C2_MARCH_BLIND16_SOURCE.json | cut -d' ' -f1)" = d79e48633be2b683176f1a6d4650aeea1b7584f11c85c2349a5bddda113febee
          test "$(sha256sum atomic/C3X021_P1_ATOMIC_CHESS_TRANSITIONS_MARCH16.json | cut -d' ' -f1)" = c14711c0e31bde26c2c7fc6e77f1f2fdf0ac70180a517b91f71845f1fd78ed3f
          python - <<'PY'
          import json
          s=json.load(open('march/C3X020_C2_MARCH_BLIND16_SOURCE.json'))
          a=json.load(open('atomic/C3X021_P1_ATOMIC_CHESS_TRANSITIONS_MARCH16.json'))
          assert len(s['selected'])==len(a['positions'])==16
          assert sum(len(x['profile']['moves']) for x in a['positions'])==635
          print('C3X021_P1_SOURCE_AND_ALL635_CHESS_ACTIONS_VERIFIED')
          PY
      - name: Native Stockfish16 single-return plus second-return and persistent-state build
        run: |
          set -euo pipefail
          root=/tmp/C3X020_MULTI_STATE
          git clone -q --single-branch --branch sf_16 https://github.com/official-stockfish/Stockfish.git "$root"
          test "$(git -C "$root" rev-parse HEAD)" = 68e1e9b3811e16cad014b590d7443b9063b3eb52
          python tools/c3x_016_P4_independent_12root_source_order_patch.py --source "$root" --out-manifest evidence/P4.json
          python tools/c3x_017_early_depth1_root_window_trace_patch.py --source "$root" --out-manifest evidence/ROOT_TRACE.json
          python tools/c3x_018_trial_call_identity_patch.py --source "$root" --out-manifest evidence/TRIAL_ID.json
          python tools/c3x_018_physical_epoch_lineage_patch.py --source "$root" --out-manifest evidence/EPOCH.json
          python tools/c3x_018_tt_eval_consumption_overlay.py --source "$root" --out-manifest evidence/V.json
          python tools/c3x_018_physical_value_witness_overlay.py --source "$root" --out-manifest evidence/WRITER_TICKET.json
          python tools/c3x_018_root_TT_genealogy_overlay.py --source "$root" --out-manifest evidence/ROOT_TT_LINEAGE.json
          python tools/c3x_018_TT_reader_writer_age_bound_root_feature_overlay.py --source "$root" --out-manifest evidence/AGE_BOUND.json
          python tools/c3x_018_january2048_TT_reader_source_census.py --source "$root" --out-manifest evidence/CENSUS.json
          python tools/c3x_018_adaptive_writer_age_root_call_V_gate.py --source "$root" --out-manifest evidence/AGE_GATE.json
          python tools/c3x_018_january_cross_window_pair_source_gate.py --source "$root" --out-manifest evidence/WINDOW_GATE.json
          python tools/c3x_018_jan_original_key_TT_probe_watch_overlay.py --source "$root" --out-manifest evidence/PROBE.json
          python tools/c3x_018_jan_TT_probe_physical_writer_epoch_witness.py --source "$root" --out-manifest evidence/PROBE_WRITER.json
          python tools/c3x_018_P0P1_TT_save_decision_writer_reinstate_overlay.py --source "$root" --out-manifest evidence/P0_P1_SOURCE_MUTATION.json
          python tools/c3x_018_P1_pre_second_reader_temporal_scope_overlay.py --source "$root" --out-manifest evidence/P1_PRE_SECOND_TEMPORAL_GATE.json
          python tools/c3x_019_tt_raw_bytes_shadow_writer_orthogonal_overlay.py --source "$root" --out-manifest evidence/C3X019_ORTHOGONAL_WRITER_STATE.json
          python tools/c3x_019_actual_native_tt_eval_use_source_witness.py --source "$root" --out-manifest evidence/C3X019_NATIVE_EVAL_USE.json
          python tools/c3x_019_native_TT_cutoff_actual_return_overlay.py --source "$root" --out-manifest evidence/C3X019_NATIVE_TT_CUTOFF_RETURN.json
          python tools/c3x_019_root_return_one_site_rescue_overlay.py --source "$root" --out-manifest evidence/ONE_SITE_RETURN_MUTATION.json
          python tools/c3x_020_multi_state_root_repair_overlay.py --source "$root" --out-manifest evidence/C3X020_MULTI_STATE_MUTATION.json
          git -C "$root" diff -- src/ > evidence/SOURCE_DIFF.patch
          make -s -C "$root/src" -j2 build ARCH=x86-64
          sha256sum "$root/src/stockfish" > evidence/BINARY_SHA256.txt
      - name: New March16 native F versus physical TT reader decisions plus atomic legal-action join
        run: |
          set -euo pipefail
          python -u harness/c3x_021_P1_march_native_TT_atomic_bridge.py \
            --march march/C3X020_C2_MARCH_BLIND16_SOURCE.json \
            --atomic atomic/C3X021_P1_ATOMIC_CHESS_TRANSITIONS_MARCH16.json \
            --engine /tmp/C3X020_MULTI_STATE/src/stockfish \
            --out evidence/C3X021_P1_MARCH16_NATIVE_TT_ATOMIC_ROOT_CHOICE.json | tee evidence/NATIVE_STDOUT.txt
          python - <<'PY'
          import json
          x=json.load(open("evidence/C3X021_P1_MARCH16_NATIVE_TT_ATOMIC_ROOT_CHOICE.json"))
          assert len(x['cases'])==16
          assert x['summary']['role_denominator']==32
          print('C3X021_P1_NATIVE_FULL16_ROLE32_COMPLETE',x['summary'])
          PY
      - name: Preserve manifest, source diff and all negative observations
        if: always()
        run: |
          mkdir -p evidence
          find evidence -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > evidence/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-021-P1-march-native-TT-atomic-root-choice
          path: evidence/
          retention-days: 90
          if-no-files-found: error
