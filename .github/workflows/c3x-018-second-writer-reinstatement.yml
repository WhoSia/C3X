name: C3X 0.18 Second TT Writer Reinstatement
on:
  push:
    paths:
      - 'tools/c3x_018_second_writer_restoration_overlay.py'
      - 'harness/c3x_018_second_writer_reinstatement_native.py'
      - '.github/workflows/c3x-018-second-writer-reinstatement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  second-writer-source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: |
          python -m py_compile tools/c3x_018_second_writer_restoration_overlay.py
          python -m py_compile harness/c3x_018_second_writer_reinstatement_native.py
      - name: Frozen P4 baseline evidence
        uses: actions/download-artifact@v4
        with:
          name: c3x-016-P4-12-Lichess-root-order-72-native
          path: baseline/
          repository: WhoSia/C3X
          run-id: '37948775813'
          github-token: ${{ github.token }}
      - name: Compile frozen SF16 with physical writer and targeted reinstatement
        run: |
          set -euo pipefail
          mkdir -p evidence
          root=/tmp/C3X018_RESCUE_NATIVE
          git clone -q --single-branch --branch sf_16 https://github.com/official-stockfish/Stockfish.git "$root"
          test "$(git -C "$root" rev-parse HEAD)" = 68e1e9b3811e16cad014b590d7443b9063b3eb52
          python tools/c3x_016_P4_independent_12root_source_order_patch.py --source "$root" --out-manifest evidence/P4.json
          python tools/c3x_018_physical_epoch_lineage_patch.py --source "$root" --out-manifest evidence/EPOCH.json
          python tools/c3x_018_second_writer_restoration_overlay.py --source "$root" --out-manifest evidence/REINSTATEMENT.json
          git -C "$root" diff -- src/search.cpp src/tt.cpp src/tt.h > evidence/REINSTATEMENT_SOURCE_DIFF.patch
          make -s -C "$root/src" -j2 build ARCH=x86-64
          sha256sum "$root/src/stockfish" > evidence/NATIVE_BINARY_SHA256.txt
      - name: Cold native focal W1 W2 S1 S2 S3 rescue
        run: |
          set -euo pipefail
          python -u harness/c3x_018_second_writer_reinstatement_native.py \
            --cohort c3x/cohorts/c3x-016-P4-12-independent-Lichess-legal-root-order-sourceonly-frozen.json \
            --prior baseline/C3X016_P4_12_LICHESS_MULTIMOTIF_ROOT_ORDER_72_NATIVE.json \
            --engine /tmp/C3X018_RESCUE_NATIVE/src/stockfish \
            --out evidence/SELECTIVE_WRITER_REINSTATEMENT.json | tee evidence/NATIVE_STDOUT.txt
          python - <<'PY'
          import json
          j=json.load(open("evidence/SELECTIVE_WRITER_REINSTATEMENT.json"))
          assert [x["id"] for x in j["cases"]]==[6,8]
          assert all(c["arms"]["S2"]["writer_rescues"]==1 for c in j["cases"])
          print("C3X018_SOURCE_SELECTIVE_REINSTATEMENT_PASS")
          PY
      - name: Evidence SHA256
        if: always()
        run: |
          mkdir -p evidence
          find evidence -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > evidence/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-018-selective-TT-writer-reinstatement
          path: evidence/
          retention-days: 90
          if-no-files-found: error
