name: C3X 027 SEE exchange presealed replay
on:
  push:
    branches: [main]
    paths:
      - tools/c3x_027_see_exchange_presealed_replay.py
      - .github/workflows/c3x-027-see-exchange.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install python-chess==1.999
      - run: python tools/c3x_027_see_exchange_presealed_replay.py
      - uses: actions/upload-artifact@v4
        with:
          name: c3x-027-see-exchange-results
          path: C3X_027_SEE_EXCHANGE_RESULTS.json
          if-no-files-found: error
