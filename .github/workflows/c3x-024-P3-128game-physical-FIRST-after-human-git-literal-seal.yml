name: C3X 0.24 P3 Sep128 Prospective Physical TT FIRST Against Human-Git-Presealed Five Models
# FIRST experiment permitted only after human Git exact 512-role UCI seal commit c5aa9582
# and successful NO-ENGINE pre-FIRST gate run 38081668509.
on:
  push:
    paths:
      - '.github/workflows/c3x-024-P3-128game-physical-FIRST-after-human-git-literal-seal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prospective-native-FIRST-sharded:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact Git human author 512 role UCI forecast exists BEFORE this FIRST workflow
        run: |
          set -euo pipefail
          python -m pip install -q chess==1.11.2 zstandard==0.25.0
          python -m py_compile harness/c3x_024_P3_preFIRST_literal_512role_integrity_gate.py harness/c3x_024_P3_Sep128_sharded_presealed_native_first.py
          test -f c3x/forecasts/c3x-024-P3-Sep2025-128game-512role-five-model-literal-UCI-before-FIRST-human-Git-seal-20261011.json
          python - <<'PY'
          import json
          p='c3x/forecasts/c3x-024-P3-Sep2025-128game-512role-five-model-literal-UCI-before-FIRST-human-Git-seal-20261011.json'
          d=json.load(open(p))
          assert len(d['ordered_games_literal_rows'])==128 and d['forecast_untreated_full_JSON_SHA256']=='c402a6808bcaa2d73ec58632f87aa4ba7e8be0577b051b85e0a5610750eb1887'
          assert d['eligible_first_reader_role_cells']==501 and d['M3_v2_predicted_flips']==1
          print('C3X024_P3_512ROLE_HUMAN_GIT_PRE FIRST_SEAL_PRESENT__NEVER_REFIT')
          PY
          mkdir -p source stageA forecast evidence public
      - uses: actions/download-artifact@v4
        with:
          name: c3x-024-P3-SEP2025-128independent-SOURCE-ONLY-no-engine
          path: source/
          repository: WhoSia/C3X
          run-id: '38079947147'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: c3x-024-P3-SEP2025-128-untreated-native-O-F-SEE-no-treatment
          path: stageA/
          repository: WhoSia/C3X
          run-id: '38080171816'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: c3x-024-P3-September128-five-model-literal-512role-UCI-preFIRST
          path: forecast/
          repository: WhoSia/C3X
          run-id: '38081547936'
          github-token: ${{ github.token }}
      - name: Test EXACT 512 sealed literal rows SHA gates AGAIN before any FIRST action
        run: |
          set -euo pipefail
          python -u harness/c3x_024_P3_preFIRST_literal_512role_integrity_gate.py --source source/C3X024_P3_SEPT2025_ENGINEBLIND_128.json --stagea stageA/C3X024_P3_SEP2025_STAGEA_UNTREATED_NATIVE128.json --forecast forecast/C3X024_P3_SEPT128_FIVE_MODELS_EXACT_UCI_PRE_FIRST.json --seal c3x/forecasts/c3x-024-P3-Sep2025-128game-512role-five-model-literal-UCI-before-FIRST-human-Git-seal-20261011.json
      - name: Native Stockfish16 single-return plus second-return and persistent-state build
        run: |
          set -euo pipefail
          root=/tmp/C3X020_MULTI_STATE
          git clone -q --single-branch --branch sf_16 https://github.com/official-stockfish/Stockfish.git "$root"
          test "$(git -C "$root" rev-parse HEAD)" = 68e1e9b3811e16cad014b590d7443b9063b3eb52
          python tools/c3x_016_P4_independent_12root_source_order_patch.py --source "$root" --out-manifest evidence/P4.json
          python tools/c3x_017_early_depth1_root_window_trace_patch.py --source "$root" --out-manifest evidence/ROOT_TRACE.json
          python tools/c3x_018_trial_call_identity_patch.py --source "$root" --out-manifest evidence/TRIAL_ID.json
          python tools/c3x_018_physical_epoch_lineage_patch.py --source "$root" --out-manifest evidence/EPOCH.json
          python tools/c3x_018_tt_eval_consumption_overlay.py --source "$root" --out-manifest evidence/V.json
          python tools/c3x_018_physical_value_witness_overlay.py --source "$root" --out-manifest evidence/WRITER_TICKET.json
          python tools/c3x_018_root_TT_genealogy_overlay.py --source "$root" --out-manifest evidence/ROOT_TT_LINEAGE.json
          python tools/c3x_018_TT_reader_writer_age_bound_root_feature_overlay.py --source "$root" --out-manifest evidence/AGE_BOUND.json
          python tools/c3x_018_january2048_TT_reader_source_census.py --source "$root" --out-manifest evidence/CENSUS.json
          python tools/c3x_018_adaptive_writer_age_root_call_V_gate.py --source "$root" --out-manifest evidence/AGE_GATE.json
          python tools/c3x_018_january_cross_window_pair_source_gate.py --source "$root" --out-manifest evidence/WINDOW_GATE.json
          python tools/c3x_018_jan_original_key_TT_probe_watch_overlay.py --source "$root" --out-manifest evidence/PROBE.json
          python tools/c3x_018_jan_TT_probe_physical_writer_epoch_witness.py --source "$root" --out-manifest evidence/PROBE_WRITER.json
          python tools/c3x_018_P0P1_TT_save_decision_writer_reinstate_overlay.py --source "$root" --out-manifest evidence/P0_P1_SOURCE_MUTATION.json
          python tools/c3x_018_P1_pre_second_reader_temporal_scope_overlay.py --source "$root" --out-manifest evidence/P1_PRE_SECOND_TEMPORAL_GATE.json
          python tools/c3x_019_tt_raw_bytes_shadow_writer_orthogonal_overlay.py --source "$root" --out-manifest evidence/C3X019_ORTHOGONAL_WRITER_STATE.json
          python tools/c3x_019_actual_native_tt_eval_use_source_witness.py --source "$root" --out-manifest evidence/C3X019_NATIVE_EVAL_USE.json
          python tools/c3x_019_native_TT_cutoff_actual_return_overlay.py --source "$root" --out-manifest evidence/C3X019_NATIVE_TT_CUTOFF_RETURN.json
          python tools/c3x_019_root_return_one_site_rescue_overlay.py --source "$root" --out-manifest evidence/ONE_SITE_RETURN_MUTATION.json
          python tools/c3x_020_multi_state_root_repair_overlay.py --source "$root" --out-manifest evidence/C3X020_MULTI_STATE_MUTATION.json
          python tools/c3x_022_P2_R2_native_SEE_source_witness_overlay.py --source "$root" --out-manifest evidence/C3X022_R2_NATIVE_SEE_FOUR_SOURCE_SITES.json
          python tools/c3x_022_P2_R2_D1_rootcall_only_SEE_observer.py --source "$root" --out-manifest evidence/C3X022_R2_D1_DESCENDANT_READONLY.json
          python tools/c3x_023_P1_native_SEE_parent_path_key_overlay.py --source "$root" --out-manifest evidence/C3X023_P1_MAIN_QSEARCH_ANCESTRY_KEYPATH.json
          git -C "$root" diff -- src/ > /tmp/C3X023_GPL_MODIFIED_ENGINE_SOURCE.diff
          sha256sum /tmp/C3X023_GPL_MODIFIED_ENGINE_SOURCE.diff | awk '{print $1 "  GPL_DIFF_PRIVATE_NOT_UPLOADED"}' > evidence/MODIFIED_GPL_DIFF_SHA256.txt
          make -s -C "$root/src" -j2 build ARCH=x86-64
          sha256sum "$root/src/stockfish" | awk '{print $1 "  MODIFIED_ENGINE_BINARY_NOT_UPLOADED"}' > evidence/BINARY_SHA256.txt
      - name: Perform original source physically REAL TT FIRST shard ${{ matrix.shard }} after Git preseal
        run: |
          set -euo pipefail
          python -u harness/c3x_024_P3_Sep128_sharded_presealed_native_first.py --source source/C3X024_P3_SEPT2025_ENGINEBLIND_128.json --stagea stageA/C3X024_P3_SEP2025_STAGEA_UNTREATED_NATIVE128.json --forecast forecast/C3X024_P3_SEPT128_FIVE_MODELS_EXACT_UCI_PRE_FIRST.json --seal c3x/forecasts/c3x-024-P3-Sep2025-128game-512role-five-model-literal-UCI-before-FIRST-human-Git-seal-20261011.json --engine /tmp/C3X020_MULTI_STATE/src/stockfish --shard ${{ matrix.shard }} --out public/C3X024_P3_TREATED_SHARD_${{ matrix.shard }}.json
          python tools/c3x_023_rights_preupload_gate.py --tier P2_AGGREGATE_SUMMARY --file public/C3X024_P3_TREATED_SHARD_${{ matrix.shard }}.json --report public/RIGHTS_P3_NATIVE_SHARD_${{ matrix.shard }}.json
          echo 'Derived paired physical TT FIRST and original-cold Stockfish16 from 2025-09 Lichess broadcast CC BY-SA 4.0 https://database.lichess.org/broadcast/lichess_db_broadcast_2025-09.pgn.zst. Original PGNs/players/FEN and GPL modified engine binary excluded. Rights gate does not imply legal clearance.' > public/SOURCE_LICENSE_ATTRIBUTION.txt
      - name: Public artifact member SHA
        if: always()
        run: |
          mkdir -p public
          find public -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > public/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-024-P3-September-128game-after-Git-seal-native-FIRST-shard-${{ matrix.shard }}
          path: public/
          if-no-files-found: warn
          retention-days: 90
  prospective-game-clustered-model-court:
    needs: [prospective-native-FIRST-sharded]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download only four complete read-only original-source TT FIRST shard receipts
        uses: actions/download-artifact@v4
        with:
          pattern: c3x-024-P3-September-128game-after-Git-seal-native-FIRST-shard-*
          path: inputs/
          merge-multiple: true
      - name: Game-clustered M3v2 vs M0 fair exact-UCI score with 501 eligible roles 11 HOLD
        run: |
          set -euo pipefail
          mkdir -p public
          python -u harness/c3x_024_P3_Sep128_after_preseal_game_cluster_model_score.py --directory inputs --out public/C3X024_P3_SEPTEMBER128_M3v2_VS_M0_PROSPECTIVE_GAME_CLUSTER_VERDICT.json
          python tools/c3x_023_rights_preupload_gate.py --tier P2_AGGREGATE_SUMMARY --file public/C3X024_P3_SEPTEMBER128_M3v2_VS_M0_PROSPECTIVE_GAME_CLUSTER_VERDICT.json --report public/RIGHTS_PROSPECTIVE_GAME_MODEL_SCAN.json
          echo 'Source official Lichess Sept2025 broadcast CC BY-SA 4.0, 128 different original games. Five model exact UCI predictions human Git sealed BEFORE this run. Game-level count and dependence, original complete game/player/FEN excluded. No claim of natural TT SEE mediation or licence from scan.' > public/SOURCE_LICENSE_NOTICE.txt
      - name: Final public aggregate SHA256 manifest
        if: always()
        run: |
          mkdir -p public
          find public -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > public/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-024-P3-September128-presealed-M3v2-versus-M0-game-cluster-science-verdict
          path: public/
          if-no-files-found: error
          retention-days: 90
