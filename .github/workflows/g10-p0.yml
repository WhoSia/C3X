name: c3x-g10-p0-contrast-to-explanation

on:
  workflow_dispatch:
  push:
    paths:
      - "c3x_g10/**"
      - "tests/test_g10_p0.py"
      - "c3x/ontology/g10-p0-loop-contract-v1.json"
      - "c3x/data/g10-p0-source-manifest.json"
      - "c3x/receipts/g10-p0-*.json"
      - "docs/G10_P0_CONSTITUTION.md"
      - ".github/workflows/g10-p0.yml"

permissions:
  contents: read

jobs:
  contract-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check python-chess==1.999 pytest
      - name: G10 contract + I0-I8 regression
        run: PYTHONPATH=. pytest -q tests/test_g10_p0.py tests/test_c3x_explain.py
      - run: python3 -m py_compile c3x_g10/*.py c3x_explain/*.py
      - name: Preseal authority smoke
        run: |
          PYTHONPATH=. python3 - <<'PY'
          from c3x_g10.loop import g10_p0_preseal
          p=g10_p0_preseal()
          assert p["h_family_privileged"] is False
          assert p["fresh_intervention_outcomes_opened"] is False
          assert "no transportable causal law" in p["authority_ceiling"]
          print("C3X_G10_P0_PRESEAL_PASS", p["generation_alias"])
          PY

  historical-p16-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check python-chess==1.999
      - name: Replay canonical P16 local certificate through G10 interface
        run: |
          PYTHONPATH=. python3 - <<'PY'
          import json
          from c3x_g10.loop import historical_contract_witness,build_roundtrip_packet
          c=json.load(open("c3x/certificates/g95-p16-local-minimal-full-bridge.json"))
          q=historical_contract_witness(c)
          out=build_roundtrip_packet(q,certificate=c)
          assert out["causal_status"]=="LOCAL_CERTIFICATE_ATTACHED"
          assert out["certificate"]["replication_status"]=="LOCAL_ONLY"
          assert out["transportable_law_claim"] is False
          assert out["chess_native_consequence"]["verified_legal_objects_only"] is True
          json.dump(out,open("/tmp/g10-p0-p16-roundtrip.json","w"),indent=2)
          print(
              "C3X_G10_P0_P16_ROUNDTRIP_PASS",
              out["certificate"]["pair_id"],
              out["chess_native_consequence"]["board_preference_transition"],
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: g10-p0-p16-roundtrip
          path: /tmp/g10-p0-p16-roundtrip.json

  real-pgn-demand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bounded source/runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          python3 -m pip install --disable-pip-version-check python-chess==1.999
      - name: Acquire and verify pinned Lichess official-broadcast source
        run: |
          set -euxo pipefail
          FILE=lichess_db_broadcast_2026-07.pgn.zst
          curl -L --fail --retry 3 "https://database.lichess.org/broadcast/$FILE" -o "/tmp/$FILE"
          curl -L --fail --retry 3 "https://database.lichess.org/broadcast/sha256sums.txt" -o /tmp/broadcast-sha256sums.txt
          EXPECTED="$(awk -v f="$FILE" '$2==f {print $1}' /tmp/broadcast-sha256sums.txt)"
          test -n "$EXPECTED"
          OBSERVED="$(sha256sum "/tmp/$FILE" | awk '{print $1}')"
          printf '%s  %s\n' "$EXPECTED" "$FILE" | tee /tmp/pinned-source-checksum.txt
          printf '%s  %s\n' "$OBSERVED" "$FILE" | tee /tmp/observed-source-sha256.txt
          test "$EXPECTED" = "$OBSERVED"
          unzstd -q "/tmp/$FILE" -o /tmp/broadcast.pgn
      - name: Extract first legal standard real game
        run: |
          python3 - <<'PY'
          import chess.pgn
          f=open("/tmp/broadcast.pgn",encoding="utf-8",errors="replace")
          chosen=None
          for _ in range(50):
              g=chess.pgn.read_game(f)
              if g is None:
                  break
              if g.headers.get("Variant","Standard") not in ("Standard","From Position"):
                  continue
              if sum(1 for _ in g.mainline_moves()) < 12:
                  continue
              chosen=g
              break
          assert chosen is not None
          open("/tmp/real.pgn","w",encoding="utf-8").write(str(chosen)+"\n")
          print("C3X_G10_P0_REAL_PGN",dict(chosen.headers))
          PY
      - name: Build pinned Stockfish
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/official-stockfish/Stockfish.git /tmp/sf
          git -C /tmp/sf checkout --detach edb0d9db6731067ec50ce619ff372b463bc4dd5d
          make -C /tmp/sf/src -j2 build ARCH=x86-64
      - name: Outcome-blind explanation-demand discovery
        run: |
          PYTHONPATH=. python3 - <<'PY'
          import json
          from c3x_g10.loop import discover_pgn_demands,build_roundtrip_packet
          text=open("/tmp/real.pgn",encoding="utf-8").read()
          out=discover_pgn_demands(
              text,
              engine_path="/tmp/sf/src/stockfish",
              source_id="LICHESS_BROADCAST_2026_07_PINNED",
              nodes=5000,
              multipv=3,
              max_proposals=3,
          )
          assert out["causal_outcomes_opened"] is False
          assert out["proposal_count"] >= 1, out
          for q in out["proposals"]:
              assert q["authority"]=="QUESTION_PROPOSAL_ONLY"
              assert q["causal_outcomes_opened"] is False
              assert q["certificate_attached"] is False
              rt=build_roundtrip_packet(q)
              assert rt["causal_status"]=="NO_CERTIFICATE"
              assert rt["commentary_route"]["causal_wording_authorized"] is False
          json.dump(out,open("/tmp/g10-p0-real-demand.json","w"),indent=2)
          print("C3X_G10_P0_REAL_DEMAND_PASS",out["positions_scanned"],out["proposal_count"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: g10-p0-real-demand
          path: |
            /tmp/real.pgn
            /tmp/g10-p0-real-demand.json
            /tmp/pinned-source-checksum.txt
            /tmp/observed-source-sha256.txt
