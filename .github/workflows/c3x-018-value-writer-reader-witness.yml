name: C3X 0.18 Actual TT Value Writer Reader Witness
on:
  push:
    paths:
      - 'tools/c3x_018_physical_value_witness_overlay.py'
      - 'harness/c3x_018_value_writer_reader_exact_native.py'
      - '.github/workflows/c3x-018-value-writer-reader-witness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-exact-TT-value-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python code and manifest preflight
        run: |
          python -m py_compile tools/c3x_018_physical_value_witness_overlay.py
          python -m py_compile harness/c3x_018_value_writer_reader_exact_native.py
      - name: Historical exact native P4 baseline
        uses: actions/download-artifact@v4
        with:
          name: c3x-016-P4-12-Lichess-root-order-72-native
          path: baseline/
          repository: WhoSia/C3X
          run-id: '37948775813'
          github-token: ${{ github.token }}
      - name: Frozen SF16 main qsearch TT payload witness compile
        run: |
          set -euo pipefail
          mkdir -p evidence
          root=/tmp/C3X018_VALUE_WITNESS_NATIVE
          git clone -q --single-branch --branch sf_16 https://github.com/official-stockfish/Stockfish.git "$root"
          test "$(git -C "$root" rev-parse HEAD)" = 68e1e9b3811e16cad014b590d7443b9063b3eb52
          python tools/c3x_016_P4_independent_12root_source_order_patch.py --source "$root" --out-manifest evidence/P4.json
          python tools/c3x_018_physical_epoch_lineage_patch.py --source "$root" --out-manifest evidence/EPOCH.json
          python tools/c3x_018_tt_eval_consumption_overlay.py --source "$root" --out-manifest evidence/V_GATE.json
          python tools/c3x_018_physical_value_witness_overlay.py --source "$root" --out-manifest evidence/WRITER_READER_WITNESS.json
          git -C "$root" diff -- src/tt.cpp src/tt.h src/search.cpp > evidence/SOURCE_DIFF.patch
          make -s -C "$root/src" -j2 build ARCH=x86-64
          sha256sum "$root/src/stockfish" > evidence/BINARY_SHA256.txt
      - name: Native writer-raw-payload and actual evaluation consumer equality
        run: |
          set -euo pipefail
          python -u harness/c3x_018_value_writer_reader_exact_native.py \
            --cohort c3x/cohorts/c3x-016-P4-12-independent-Lichess-legal-root-order-sourceonly-frozen.json \
            --prior baseline/C3X016_P4_12_LICHESS_MULTIMOTIF_ROOT_ORDER_72_NATIVE.json \
            --engine /tmp/C3X018_VALUE_WITNESS_NATIVE/src/stockfish \
            --out evidence/TWO_SOURCE_VALUE_WRITER_READER_NATIVE.json | tee evidence/NATIVE_STDOUT.txt
          python - <<'PY'
          import json
          j=json.load(open("evidence/TWO_SOURCE_VALUE_WRITER_READER_NATIVE.json"))
          assert [x['id'] for x in j['cases']]==[2,5]
          assert all(x['verified_source_value_in_V'] for x in j['cases'])
          print('C3X018_NATIVE_PHYSICAL_TT_VALUE_WRITER_CONSUMER_PROVENANCE_PASS')
          PY
      - name: Hash source and raw evidence
        if: always()
        run: |
          mkdir -p evidence
          find evidence -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > evidence/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-018-value-writer-reader-native
          path: evidence/
          retention-days: 90
          if-no-files-found: error
