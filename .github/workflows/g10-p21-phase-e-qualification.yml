name: c3x-g10-p21-phase-e-qualification

on:
  push:
    branches: [main]
    paths: ['.github/workflows/g10-p21-phase-e-qualification.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CENSUS_RUN: '37439787214'
  ROUTER_RUN: '37120074387'
  P16_BUILD_RUN: '36544344858'

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: g10-p21-phase-e-census
          path: census
          repository: WhoSia/C3X
          run-id: ${{ env.CENSUS_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: g10-p16-router-freeze-sealed
          path: router
          repository: WhoSia/C3X
          run-id: ${{ env.ROUTER_RUN }}
          github-token: ${{ github.token }}
      - name: Project frozen router
        run: |
          python3 tools/g10_p19_router_project.py \
            --census census/g10-p21-phase-e-census.json \
            --router router/g10-p16-router-freeze.json \
            --out g10-p21-phase-e-projected.json
      - uses: actions/upload-artifact@v4
        with:
          name: g10-p21-phase-e-projected
          path: g10-p21-phase-e-projected.json
          retention-days: 60

  design:
    needs: project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check python-chess==1.999
      - uses: actions/download-artifact@v4
        with:
          name: g10-p21-phase-e-projected
          path: state
      - uses: actions/download-artifact@v4
        with:
          pattern: g95-p16-build-*
          path: builds
          repository: WhoSia/C3X
          run-id: ${{ env.P16_BUILD_RUN }}
          github-token: ${{ github.token }}
      - name: Build frozen near-equal qualification design
        run: |
          python3 tools/g10_p19_design_adapter.py \
            --projected state/g10-p21-phase-e-projected.json \
            --legacy-p16-constitution c3x/ontology/g95-p16-constitution.json \
            --build-dir builds --out g10-p21-phase-e-design.json
      - uses: actions/upload-artifact@v4
        with:
          name: g10-p21-phase-e-design
          path: g10-p21-phase-e-design.json
          retention-days: 60

  qualify:
    needs: design
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check python-chess==1.999
      - uses: actions/download-artifact@v4
        with:
          name: g10-p21-phase-e-design
          path: state
      - uses: actions/download-artifact@v4
        with:
          pattern: g95-p16-build-*
          path: builds
          repository: WhoSia/C3X
          run-id: ${{ env.P16_BUILD_RUN }}
          github-token: ${{ github.token }}
      - name: Qualify near-equal pairs
        run: |
          PYTHONPATH=. python3 tools/g10_p5_p16_shard.py \
            --phase qualify --state state/g10-p21-phase-e-design.json --build-dir builds \
            --shard ${{ matrix.shard }} --shards 8 --out-dir out
      - uses: actions/upload-artifact@v4
        with:
          name: g10-p21-phase-e-qualify-${{ matrix.shard }}
          path: out/
          retention-days: 60

  pair:
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check python-chess==1.999
      - uses: actions/download-artifact@v4
        with:
          name: g10-p21-phase-e-design
          path: state
      - uses: actions/download-artifact@v4
        with:
          pattern: g10-p21-phase-e-qualify-*
          path: quals
      - uses: actions/download-artifact@v4
        with:
          name: g10-p21-phase-e-projected
          path: corpus
      - name: Freeze fresh pairs and apply inherited positivity gate
        run: |
          PYTHONPATH=. python3 harness/g95_p16_court.py pair-freeze \
            --design state/g10-p21-phase-e-design.json --qualifications quals --out g10-p21-phase-e-pair-freeze.json
          python3 tools/g10_p19_pair_gate.py \
            --corpus corpus/g10-p21-phase-e-projected.json \
            --pair-freeze g10-p21-phase-e-pair-freeze.json \
            --out g10-p21-phase-e-pair-gate.json
          cat g10-p21-phase-e-pair-gate.json
          sha256sum g10-p21-phase-e-pair-freeze.json g10-p21-phase-e-pair-gate.json > g10-p21-phase-e-pair.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: g10-p21-phase-e-pair-sealed
          path: |
            g10-p21-phase-e-pair-freeze.json
            g10-p21-phase-e-pair-gate.json
            g10-p21-phase-e-pair.sha256
          retention-days: 60
