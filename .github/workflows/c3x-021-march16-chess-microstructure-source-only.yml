name: C3X 0.21 March16 Engine-Free Chess Microstructure Freeze
on:
  push:
    paths:
      - '.github/workflows/c3x-021-march16-chess-microstructure-source-only.yml'
      - 'harness/c3x_021_march_sourceonly_chess_microfeatures.py'
      - 'tools/test_c3x_021_chess_microfeatures.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legal-board-microstructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pure chess board reader and run positive/negative microfeatures fixtures
        run: |
          python -m pip install -q chess==1.11.2
          python -m py_compile harness/c3x_021_march_sourceonly_chess_microfeatures.py
          python -m unittest discover -s tools -p 'test_c3x_021_chess_microfeatures.py' -v
      - name: Download exact already frozen March source; no engine
        uses: actions/download-artifact@v4
        with:
          name: c3x-020-C2-march2026-enginefree-blind16-source
          path: march/
          repository: WhoSia/C3X
          run-id: '38038059013'
          github-token: ${{ github.token }}
      - name: Verify March source and extract chess microstructures before engine
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(sha256sum march/C3X020_C2_MARCH_BLIND16_SOURCE.json | cut -d' ' -f1)" = d79e48633be2b683176f1a6d4650aeea1b7584f11c85c2349a5bddda113febee
          python -u harness/c3x_021_march_sourceonly_chess_microfeatures.py \
            --march march/C3X020_C2_MARCH_BLIND16_SOURCE.json \
            --out evidence/C3X021_MARCH16_SOURCEONLY_CHESS_MICROSTRUCTURES.json | tee evidence/SOURCE_ONLY_STDOUT.txt
          python - <<'PY'
          import json
          d=json.load(open('evidence/C3X021_MARCH16_SOURCEONLY_CHESS_MICROSTRUCTURES.json'))
          assert d['phase']=='BEFORE_MARCH_NATIVE_ENGINE_OUTCOMES'
          assert len(d['positions'])==16
          assert all(p['features']['legal_move_count']>=3 for p in d['positions'])
          print('C3X021_ALL16_CHESS_SOURCE_MICROFEATURES_READY')
          PY
      - name: Hash and retain every artifact member
        if: always()
        run: |
          mkdir -p evidence
          find evidence -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > evidence/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-021-march16-sourceonly-chess-microstructure
          path: evidence/
          retention-days: 90
          if-no-files-found: error
