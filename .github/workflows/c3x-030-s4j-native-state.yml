name: C3X 0.30 S4J Cross-arm TT Search State Identity Pilot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c3x-030-s4j-native-state.yml'
      - 'harness/c3x_030_s4j_state_fingerprint_patch.py'
      - 'harness/c3x_030_s4j_state_alignment.py'
      - 'harness/test_c3x_030_s4j_state_alignment.py'
      - 'harness/c3x_030_s4j_native_state_court.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-development-tt-cutoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin chess validator and run contract tests
        run: |
          set -euo pipefail
          python -m pip install -q chess==1.11.2
          PYTHONPATH=harness python -m unittest -v test_c3x_030_s4j_state_alignment
      - name: Recover exact S4H2 archived development R2 and original frozen protocol
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prior/r2 prior/protocol public
          gh run download 43349835109 -R WhoSia/C3X -n c3x030-s4h2-development-native-samebin-paired-dose -D prior/r2
          gh run download 43347740057 -R WhoSia/C3X -n c3x030-s4h2-preoutcome-frozen-design -D prior/protocol
          sha256sum prior/r2/S4H2_DEVELOPMENT_PAIRED_NATIVE_RESULT.json prior/protocol/S4H2_PREOUTCOME_PROTOCOL.json > public/PRIOR_RAW_SHA256.txt
      - name: Compile original and read-only TT early cutoff modified source
        run: |
          set -euo pipefail
          git clone -q https://github.com/official-stockfish/Stockfish.git /tmp/c3x-s4j-upstream
          git -C /tmp/c3x-s4j-upstream checkout -q 68e1e9b3811e16cad014b590d7443b9063b3eb52
          test "$(git -C /tmp/c3x-s4j-upstream rev-parse HEAD)" = 68e1e9b3811e16cad014b590d7443b9063b3eb52
          make -s -C /tmp/c3x-s4j-upstream/src -j2 build ARCH=x86-64
          cp /tmp/c3x-s4j-upstream/src/stockfish /tmp/c3x-s4j-original
          cp -a /tmp/c3x-s4j-upstream /tmp/c3x-s4j-modified
          python harness/c3x_030_s4j_state_fingerprint_patch.py \
            --source /tmp/c3x-s4j-upstream/src/search.cpp \
            --out /tmp/c3x-s4j-modified/src/search.cpp
          make -s -C /tmp/c3x-s4j-modified/src -j2 build ARCH=x86-64
          sha256sum /tmp/c3x-s4j-upstream/src/search.cpp /tmp/c3x-s4j-modified/src/search.cpp /tmp/c3x-s4j-original /tmp/c3x-s4j-modified/src/stockfish > public/SOURCE_BINARY_SHA256.txt
      - name: Execute original-sham-two-hit paired source TT cutoff diagnosis on development ONLY
        run: |
          set -euo pipefail
          PYTHONPATH=harness python -u harness/c3x_030_s4j_native_state_court.py \
            --protocol prior/protocol/S4H2_PREOUTCOME_PROTOCOL.json \
            --r2 prior/r2/S4H2_DEVELOPMENT_PAIRED_NATIVE_RESULT.json \
            --baseline /tmp/c3x-s4j-original \
            --modified /tmp/c3x-s4j-modified/src/stockfish \
            --out public/S4J_NATIVE_CANDIDATE_SEARCH_STATES.json
          sha256sum public/S4J_NATIVE_CANDIDATE_SEARCH_STATES.json > public/RESULT_SHA256.txt
      - name: Explicit conservative research scope
        if: always()
        run: |
          mkdir -p public
          echo 'S4J exploratory development-only state identity: candidate TT key/depth/alpha-beta/PV/cutnode/ply fingerprints, repeated matches marked ambiguous; event IDs are run-local. Unobserved and capped logs are not causal negatives. 48 planned searches; no held-out games, causal mediation or paper superiority. Actions bot never commits.' > public/SCOPE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x030-s4j-native-cross-arm-state-candidates
          path: public/*
          if-no-files-found: error
          retention-days: 90
