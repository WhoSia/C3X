name: p15-custody-split

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/p15-custody.yml"

permissions:
  actions: read
  contents: read

jobs:
  split:
    name: Split sealed P15 precommit for long-term custody
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original sealed pre-selective-mask artifact
        uses: actions/download-artifact@v4
        with:
          name: p15-sham-precommit-sealed
          path: sealed
          repository: WhoSia/C3X
          run-id: 35966181981
          github-token: ${{ github.token }}

      - name: Verify canonical precommit and binaries
        run: |
          python3 - <<'PY'
          import hashlib,json
          p=json.load(open("sealed/p15-sham-precommit.json"))
          assert p["precommit_sha256"]=="f207c31748dfb00982bfba52a078fee7cbaa92cef26bf7e5a088191ba5211795"
          assert p["selective_mask_outcomes_consulted"] is False
          assert p["authorization"]=="P15-FACTORIAL-READY"
          def sha(path):
              h=hashlib.sha256()
              with open(path,"rb") as f:
                  for c in iter(lambda:f.read(1<<20),b""):h.update(c)
              return h.hexdigest()
          assert sha("sealed/c3x-p15-frozen")=="4cc22d7fc1943ab5d23142a868a101d45ca253f4c915d7fbbaccaa91a2aa0e5b"
          assert sha("sealed/c3x-p15-sf19")=="bb8487ab5de45a192d56502fdf33d3b74e5489f043528ea1240c68b7c7533425"
          print("P15_CUSTODY_SPLIT_VERIFIED")
          PY

      - name: Materialize metadata packet
        run: |
          mkdir -p metadata
          cp sealed/p15-sham-precommit.json metadata/
          cp sealed/p15-sham-precommit-file-sha256.txt metadata/
          cp sealed/binary-sha256.txt metadata/
          cp sealed/full-mask-equivalence.txt metadata/
          cp sealed/frozen-uci-smoke.txt metadata/
          cp sealed/frozen-native-sham.txt metadata/
          cp sealed/sf19-uci-smoke.txt metadata/
          cp sealed/sf19-native-sham.txt metadata/

      - uses: actions/upload-artifact@v4
        with:
          name: p15-precommit-metadata-canonical
          path: metadata/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: p15-frozen-binary-canonical
          path: sealed/c3x-p15-frozen
          retention-days: 30
          compression-level: 6
      - uses: actions/upload-artifact@v4
        with:
          name: p15-sf19-binary-canonical
          path: sealed/c3x-p15-sf19
          retention-days: 30
          compression-level: 6
