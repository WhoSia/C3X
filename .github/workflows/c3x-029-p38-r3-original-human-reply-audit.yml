name: C3X P38 R3 Read-only Actual Human Reply Reaudit of Sealed P37 Forecasts
on:
  push:
    paths:
      - '.github/workflows/c3x-029-p38-r3-original-human-reply-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-observed-reply-no-writeback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install chess-law checker
        run: python -m pip install -q chess==1.11.2
      - name: Adversarially test actual historical reply versus unplayed foil
        run: python -m unittest discover -s tools -p 'test_c3x_029_p38_r3_original_human_reply_audit.py' -v
      - name: Download P37 original source-only eight-event freeze
        uses: actions/download-artifact@v4
        with:
          name: c3x-p37-r1-oct-eight-distinct-events-original-pgn-and-engine-blind-freeze
          repository: WhoSia/C3X
          run-id: '41968008046'
          path: source
          github-token: ${{ github.token }}
      - name: Download original P37 prediction BEFORE same-engine referee
        uses: actions/download-artifact@v4
        with:
          name: c3x-p37-r2-pre-referee-eight-event-three-rival-predictions
          repository: WhoSia/C3X
          run-id: '41969173637'
          path: predictions
          github-token: ${{ github.token }}
      - name: Verify original source manifest, forecasts and pre-future prefix
        run: |
          set -euo pipefail
          printf '%s  %s\n' 77ebaa409e7c2099cc6cce3419c2f55ded295d925ab441dc2d13c16b67c2c361 source/P37_R1_8_EVENT_8_GAME_SOURCE_ONLY_MANIFEST.json | sha256sum -c -
          printf '%s  %s\n' da395f0eb16e7b294af2056dadd92b579770aa8f1ae288d1d358132685807051 predictions/P37_R2_THREE_RIVAL_PRE_REFERENCE_PREDICTIONS.json | sha256sum -c -
          printf '%s  %s\n' 0f6a3c371e4154342f65167dfa9afa269705999c549eec53235d8763cb18ceb9 predictions/P37_PREDICTOR_PREFIX_ONLY_INPUT.json | sha256sum -c -
      - name: Recalculate observation-only human-reply outcomes for all eight events
        run: |
          set -euo pipefail
          mkdir -p output
          python -u tools/c3x_029_p38_r3_original_human_reply_audit.py \
            --source-zip source \
            --prediction-zip predictions \
            --out output/P38_R3_ORIGINAL_HUMAN_OPPONENT_REPLY_POSTHOC_AUDIT.json \
            | tee output/P38_R3_STDOUT.txt
          grep -q 'P38_HUMAN_OBSERVED_REPLY_AUDIT' output/P38_R3_STDOUT.txt
      - name: Independent summary-count check without chess-analysis tools
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('output/P38_R3_ORIGINAL_HUMAN_OPPONENT_REPLY_POSTHOC_AUDIT.json').read_text())
          rows=d['events']
          assert len(rows)==8
          covered=[r for r in rows if r['prediction_coverage']]
          assert len(covered)==d['observed_played_move_is_in_frozen_two_candidate_roots']
          assert len(rows)-len(covered)==d['observed_human_reply_unavailable_for_foils']
          for method in ('stockfish_pv','simple_json','c3x_legal_plan'):
              reported=d['conditional_prediction_accuracy_on_observed_coverage'][method]
              assert reported['correct']==sum(r['predictions'][method]==r['historical_opponent_reply_uci'] for r in covered)
          assert d['paired_pv_c3x']['pv_only_correct']+d['paired_pv_c3x']['c3x_only_correct']+d['paired_pv_c3x']['both_correct']+d['paired_pv_c3x']['both_wrong']==len(covered)
          print('P38_POSTHOC_HUMAN_REPLY_INDEPENDENT_RECOUNT_PASS')
          PY
      - name: Seal source-linked result members, no git writeback
        if: always()
        run: |
          mkdir -p output
          find output -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > output/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-p38-r3-eight-event-actual-human-reply-posthoc-original-prediction-audit
          path: output/
          retention-days: 90
          if-no-files-found: error
