name: C3X R52 depth stability
on:
  push:
    branches: [main]
    paths:
      - 'product/c3x_depth_stability.py'
      - 'product/test_c3x_depth_stability.py'
      - 'product/c3x_explain_two_moves.py'
      - 'product/c3x_local_web.py'
      - 'product/c3x_board.js'
      - '.github/workflows/c3x-031-r52-depth-stability.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'chess==1.11.2'
      - run: |
          PYTHONPATH=product python -m unittest discover -s product -p 'test_c3x_depth_stability.py' -v
          PYTHONPATH=product python -m unittest discover -s product -p 'test_c3x_explain_two_moves.py' -v
          PYTHONPATH=product python -m unittest discover -s product -p 'test_c3x_local_web.py' -v
          node --check product/c3x_board.js
      - uses: actions/download-artifact@v4
        with:
          repository: WhoSia/C3X
          run-id: '44872473600'
          name: c3x031-p2-pinned-SF16-native-source-build-no-treatments
          github-token: ${{ github.token }}
          path: /tmp/r52-build
      - name: Real engine quick/audit on public low-material position
        run: |
          chmod +x /tmp/r52-build/c3x031-p2-SF16-pre-R33-reference
          export PYTHONPATH=product
          python - <<'PY'
          import chess,chess.engine,json
          from pathlib import Path
          from c3x_explain_two_moves import generate,make_markdown,configure_engine,evaluation_profile,sha
          b=Path('/tmp/r52-build/c3x031-p2-SF16-pre-R33-reference')
          assert sha(b)=='78cae269c73eb080c8a508e839dcde15ce48888b3fc4317fa3311de49e5ee7bb'
          board=chess.Board('8/8/8/3k4/8/4K3/4P3/8 w - - 0 1')
          for profile in ('quick','audit'):
              with chess.engine.SimpleEngine.popen_uci(str(b),timeout=120) as e:
                  provenance=configure_engine(e,b,evaluation_profile())
                  r=generate(board,'e3d3','e3f3',e,analysis_profile=profile)
                  r['engine_provenance']=provenance
              s=r['depth_stability']
              assert len(s['depths'])==(2 if profile=='quick' else 5)
              assert not s['draw_proven'] and not s['global_best_proven']
              assert '신뢰구간 아님' in make_markdown(r) or s['finite_observed_range_cp'] is None
              if profile=='quick':assert s['status']=='UNRESOLVED'
              print('R52_ACTUAL',json.dumps(s,sort_keys=True),flush=True)
          PY
