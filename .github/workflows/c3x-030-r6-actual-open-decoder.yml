name: C3X 0.30 R6 genuine Qwen 0.5B Parfenova blind move-recovery pilot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c3x-030-r6-actual-open-decoder.yml'
      - 'harness/c3x_030_r6a_actual_open_decoder_blind_arm.py'
      - 'harness/c3x_030_r6b_posthoc_decoder_recovery_evaluator.py'
      - 'harness/test_c3x_030_r6_open_decoder_contracts.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  five-isolated-real-open-model-arm-decoders:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test leakage controls before ANY decoder access
        run: |
          set -euo pipefail
          python -m pip install -q chess==1.11.2
          PYTHONPATH=harness python -m unittest -v \
            test_c3x_030_r6_open_decoder_contracts \
            test_c3x_030_r5_parfenova_move_mask_control_protocol
      - uses: actions/download-artifact@v4
        with:
          name: c3x030-r5-parfenova-source-history-mask-20-PROTOCOL-packets
          repository: WhoSia/C3X
          run-id: '42755543672'
          path: r5/
          github-token: ${{ github.token }}
      - name: Verify exact R5 truth and all 5 blind model-only arm input files before inference
        run: |
          set -euo pipefail
          echo '4221f90ed5ab86ef38b05e47d248f5906048c7c5812d0430c2c48fc680760f0b  r5/public/C3X030_R5_PARFENOVA_SYNTHETIC_EXPLANATION_CONTROL_PACKETS.json' | sha256sum -c -
          echo '71497e2bdbb7e240eaf1cb6a29e1bf3d8d4e19ce0e0a9fe02e9e9bafece5aea5  r5/blind-per-arm/R5_BLIND_ONLY_explanation_only.json' | sha256sum -c -
          echo '3709dd687f468170af80446f7ebe853b51328a866161c572597b96abf0504bbc  r5/blind-per-arm/R5_BLIND_ONLY_fen_only.json' | sha256sum -c -
          echo '178a33cfbe5b722d54aa7fb22de4d440bbc06df5d079465bea7188aab2db4de8  r5/blind-per-arm/R5_BLIND_ONLY_fen_plus_strict_masked.json' | sha256sum -c -
          echo '9a245d1066fa05f4822d34e0c5208851e09f746d9099375b205198b50191d4f6  r5/blind-per-arm/R5_BLIND_ONLY_fen_plus_unmasked.json' | sha256sum -c -
          echo '20ab9f46fca00b1f6fdb2f0483b8554f0c6bb7aba6dc37be4484528f4233795e  r5/blind-per-arm/R5_BLIND_ONLY_fen_plus_unrelated_foil.json' | sha256sum -c -
      - name: Install PINNED CPU-only torch + transformers for Qwen2.5 0.5B
        run: |
          set -euo pipefail
          python -m pip install -q --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install -q 'transformers==4.47.1' 'huggingface-hub==0.27.1' 'accelerate==1.2.1' 'safetensors==0.4.5'
          python - <<'PY'
          import torch,transformers,huggingface_hub
          print('PINNED_MODEL Qwen/Qwen2.5-0.5B-Instruct @ 7ae557604adf67be50417f59c2c2f167def9a775')
          print('torch',torch.__version__,'transformers',transformers.__version__,'hub',huggingface_hub.__version__)
          PY
      - name: TRUE small open model inference, five isolated arms / fresh prompt each instance
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          mkdir -p predictions
          for arm in fen_only explanation_only fen_plus_unmasked fen_plus_strict_masked fen_plus_unrelated_foil; do
            echo "RUNNING_ISOLATED_REAL_DECODER_ARM $arm"
            PYTHONPATH=harness python -u harness/c3x_030_r6a_actual_open_decoder_blind_arm.py \
              --arm "$arm" \
              --input "r5/blind-per-arm/R5_BLIND_ONLY_${arm}.json" \
              --out "predictions/R6_REAL_DECODER_${arm}.json"
          done
          sha256sum predictions/*.json
      - name: ONLY NOW join frozen truth in a different evaluator process
        run: |
          set -euo pipefail
          mkdir -p public
          PYTHONPATH=harness python -u harness/c3x_030_r6b_posthoc_decoder_recovery_evaluator.py \
            --audit r5/public/C3X030_R5_PARFENOVA_SYNTHETIC_EXPLANATION_CONTROL_PACKETS.json \
            --predictions-dir predictions \
            --out public/C3X030_R6_REAL_SMALL_DECODER_NOMINATED_CANDIDATE_RECOVERY.json
          sha256sum public/C3X030_R6_REAL_SMALL_DECODER_NOMINATED_CANDIDATE_RECOVERY.json
      - name: Scientific limitations and rights gate
        if: always()
        run: |
          set -euo pipefail
          mkdir -p public
          if test -f public/C3X030_R6_REAL_SMALL_DECODER_NOMINATED_CANDIDATE_RECOVERY.json; then
            python tools/c3x_023_rights_preupload_gate.py \
              --tier P2_AGGREGATE_SUMMARY \
              --file public/C3X030_R6_REAL_SMALL_DECODER_NOMINATED_CANDIDATE_RECOVERY.json \
              --report /tmp/R6_RIGHTS_PRIVATE.json
          fi
          echo 'R6 uses real original open licensed Qwen2.5 0.5B Instruct pinned model, on ACT-Eval validated R5 synthetic explanations over 2 historically selected source worlds with 4 nominated candidate moves. This is NOT Parfenova original 200 endgame puzzles, NOT Qwen3 32B, not original generated-versus-reference separation, not a gold Lichess answer, not original token-level all legal action scoring, not prospective and no source engine causal strategy proof. Only top1 strict UCI recovery of historical nominated moves; 4 paired samples = non-generalizable exploratory.' > public/SCIENTIFIC_SCOPE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x030-r6-REAL-Qwen2.5-0.5B-20-blind-trials
          path: |
            predictions/*.json
            public/C3X030_R6_REAL_SMALL_DECODER_NOMINATED_CANDIDATE_RECOVERY.json
            public/SCIENTIFIC_SCOPE.txt
          if-no-files-found: warn
