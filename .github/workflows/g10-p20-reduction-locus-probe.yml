name: c3x-g10-p20-reduction-locus-probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/g10-p20-reduction-locus-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: stockfish_19
            repo: https://github.com/official-stockfish/Stockfish.git
            commit: edb0d9db6731067ec50ce619ff372b463bc4dd5d
          - engine: berserk
            repo: https://github.com/jhonnold/berserk.git
            commit: 32628515050b83805bab4afa1026dd2bcaa93f55
          - engine: ethereal
            repo: https://github.com/AndyGrant/Ethereal.git
            commit: 0e47e9b67f345c75eb965d9fb3e2493b6a11d09a
    steps:
      - uses: actions/checkout@v4
      - name: Clone exact engine source
        run: |
          git clone "${{ matrix.repo }}" src
          git -C src checkout --detach "${{ matrix.commit }}"
          test "$(git -C src rev-parse HEAD)" = "${{ matrix.commit }}"
      - name: Census direct reduction loci
        run: |
          mkdir -p out
          {
            echo "ENGINE=${{ matrix.engine }}"
            echo "COMMIT=${{ matrix.commit }}"
            echo "=== filenames ==="
            find src -maxdepth 3 -type f | sort
            echo "=== reduction-like anchors ==="
            grep -RInE --include='*.c' --include='*.cpp' --include='*.h'               'LMR|lmr|reduction|Reduction|reducedDepth|reduced_depth|full.?depth|FullDepth|late.?move|LateMove' src/src || true
            echo "=== search recursive calls / depth arithmetic ==="
            grep -RInE --include='search.c' --include='search.cpp'               'depth[[:space:]]*-[[:space:]]*[A-Za-z0-9_()+*/ -]+|search\([^;]*depth|Search\([^;]*depth' src/src || true
          } > "out/${{ matrix.engine }}-reduction-census.txt"
          wc -l "out/${{ matrix.engine }}-reduction-census.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: g10-p20-reduction-locus-${{ matrix.engine }}
          path: out/
          retention-days: 30
