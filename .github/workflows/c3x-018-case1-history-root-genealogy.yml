name: C3X 0.18 Case One Original History Search Genealogy
on:
  push:
    paths:
      - 'harness/c3x_018_case1_history_residual_root_genealogy_native.py'
      - '.github/workflows/c3x-018-case1-history-root-genealogy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  case1-history-residual-root:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Chess rules dependency and source checks
        run: |
          python -m pip install -q chess==1.11.2
          python -m py_compile harness/c3x_018_case1_history_residual_root_genealogy_native.py
      - name: Frozen prior source and history
        uses: actions/download-artifact@v4
        with:
          name: c3x-018-independent-PGN-blind-source-16
          path: source/
          repository: WhoSia/C3X
          run-id: '37981820261'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: c3x-018-real-game-history-vs-FEN-source
          path: history/
          repository: WhoSia/C3X
          run-id: '37983641417'
          github-token: ${{ github.token }}
      - name: Source frozen Stockfish 16 aspiration TT provenance compile
        run: |
          set -euo pipefail
          mkdir -p evidence
          root=/tmp/C3X018_CASE1_RESIDUAL
          git clone -q --single-branch --branch sf_16 https://github.com/official-stockfish/Stockfish.git "$root"
          test "$(git -C "$root" rev-parse HEAD)" = 68e1e9b3811e16cad014b590d7443b9063b52
          python tools/c3x_016_P4_independent_12root_source_order_patch.py --source "$root" --out-manifest evidence/P4.json
          python tools/c3x_017_early_depth1_root_window_trace_patch.py --source "$root" --out-manifest evidence/017_ROOT.json
          python tools/c3x_018_trial_call_identity_patch.py --source "$root" --out-manifest evidence/018_CALL.json
          python tools/c3x_018_physical_epoch_lineage_patch.py --source "$root" --out-manifest evidence/018_TT.json
          python tools/c3x_018_root_TT_genealogy_overlay.py --source "$root" --out-manifest evidence/018_TT_ROOT_JOIN.json
          git -C "$root" diff -- src/ > evidence/SOURCE_DIFF.patch
          make -s -C "$root/src" -j2 build ARCH=x86-64
          sha256sum "$root/src/stockfish" > evidence/BINARY_SHA256.txt
      - name: Actual game history versus six-field FEN native root episode
        run: |
          set -euo pipefail
          python -u harness/c3x_018_case1_history_residual_root_genealogy_native.py \
            --source source/C3X018_INDEPENDENT_BLIND16_PGN_SOURCE.json \
            --prior-history history/ORIGINAL_GAME_HISTORY_VS_FEN_16_NATIVE.json \
            --engine /tmp/C3X018_CASE1_RESIDUAL/src/stockfish \
            --out evidence/CASE1_FEN6_VS_REAL_PGN_GENEALOGY.json | tee evidence/NATIVE_STDOUT.txt
      - name: Hash all raw source and outcomes
        if: always()
        run: |
          mkdir -p evidence
          find evidence -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > evidence/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-018-case1-history-search-root-genealogy
          path: evidence/
          if-no-files-found: error
          retention-days: 90
