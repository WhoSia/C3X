name: C3X 0.30 F2 Selective Risk-Coverage Fusion Audit Contracts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c3x-030-f2-risk-coverage.yml'
      - 'harness/c3x_030_p11f2_risk_coverage_audit.py'
      - 'harness/test_c3x_030_p11f2_risk_coverage_audit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  risk-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: F2 source-level safety, blind manifest and grouped-resampling contracts
        run: |
          set -euo pipefail
          PYTHONPATH=harness python3 -m unittest -v test_c3x_030_p11f2_risk_coverage_audit
          python3 -m py_compile harness/c3x_030_p11f2_risk_coverage_audit.py
      - name: Preserve honest benchmark boundary
        run: |
          mkdir -p public
          echo 'F2 tests are SYNTHETIC contracts only, zero real chess/engine searches. They verify that unseen game manifest identities cannot silently drift, abstention reduces coverage and all-case positive recall, and bootstrap resamples complete game clusters. Never call these tests an original paper head-to-head or a human learning experiment. Source/judge labels remain self-attested without independently adjudicated receipts. No Github Actions bot commits.' > public/SCOPE.txt
          sha256sum harness/c3x_030_p11f2_risk_coverage_audit.py > public/F2_CODE_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: c3x030-f2-synthetic-risk-coverage-contract-only
          path: public/*
          retention-days: 90
