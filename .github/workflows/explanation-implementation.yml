name: c3x-explanation-implementation

on:
  workflow_dispatch:
  push:
    paths:
      - "c3x_explain/**"
      - "tests/test_c3x_explain.py"
      - "docs/EXPLANATION_IMPLEMENTATION_TRACK.md"
      - "docs/EXPLANATION_LITERATURE_DONORS_2026-09.md"
      - ".github/workflows/explanation-implementation.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check python-chess==1.999 pytest
      - run: PYTHONPATH=. pytest -q tests/test_c3x_explain.py
      - run: python3 -m py_compile c3x_explain/*.py

  pinned-stockfish-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euxo pipefail
          python3 -m pip install --disable-pip-version-check python-chess==1.999
          git clone https://github.com/official-stockfish/Stockfish.git sf
          git -C sf checkout --detach edb0d9db6731067ec50ce619ff372b463bc4dd5d
          make -C sf/src -j2 build ARCH=x86-64
          cat > /tmp/smoke.pgn <<'PGN'
          [Event "C3X Explain Smoke"]
          [Result "*"]

          1. f3 e5 2. g4 Qh4# *
          PGN
          PYTHONPATH=. python3 -m c3x_explain.cli /tmp/smoke.pgn --engine sf/src/stockfish --nodes 5000 --multipv 3 --out /tmp/graph.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/graph.json'))
          assert x['schema']=='c3x-explanation-graph-v1'
          assert x['moment_count']>0
          assert all(m['firewall']['pass'] for m in x['moments'])
          assert all(m['render_packet']['pass'] for m in x['moments'])
          assert x['renderer_benchmark']['renderer_failed_moments']==0
          assert x['renderer_benchmark']['atomic_factuality_rate']==1.0
          assert x['realization_benchmark']['failed_packets']==0
          assert x['verification_benchmark']['clean_pass_rate']==1.0
          assert x['verification_benchmark']['adversarial_rejection_rate']==1.0
          assert any(m['candidates'] for m in x['moments'])
          assert any(a['type']=='verified_line_evidence' for m in x['moments'] for a in m['atoms'])
          print('C3X_EXPLAIN_PINNED_STOCKFISH_PASS',x['moment_count'],x['renderer_benchmark']['claim_count'],x['verification_benchmark']['adversarial_case_count'])
          PY
