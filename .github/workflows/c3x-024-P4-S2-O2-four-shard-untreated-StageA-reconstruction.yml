name: C3X 0.24 P4 July256 Exact Four Shard Untreated StageA Source Reconstruction
on:
  push:
    paths:
      - '.github/workflows/c3x-024-P4-S2-O2-four-shard-untreated-StageA-reconstruction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  four-original-sha-preFIRST-source-native-shards:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original July256 source and native overflow HOLD precommit, no TT FIRST
        run: |
          set -euo pipefail
          python -m pip install -q chess==1.11.2 zstandard==0.25.0
          python -m py_compile harness/c3x_024_P4_S2_O2_sharded_untreated_StageA_original_reconstruction.py harness/c3x_024_P4_July256_untreated_native_stageA.py
          test -f c3x/ontology/c3x-024-P4-S2-O2-sharded-untreated-StageA-same-source-reconstruction-precommit-20261011.md
          test -f c3x/ontology/c3x-024-P4-S2-O1-native-lineage-trace-censor-failclosed-full256-recovery-precommit-20261011.md
          mkdir -p evidence source
      - uses: actions/download-artifact@v4
        with:
          name: c3x-024-P4-JULY2025-256independent-SOURCE-ONLY-before-M4
          path: source/
          repository: WhoSia/C3X
          run-id: '38083154595'
          github-token: ${{ github.token }}
      - name: Strict raw July source SHA and full original 256 game human Git identity
        run: |
          set -euo pipefail
          test "$(sha256sum source/C3X024_P4_JULY2025_ENGINEBLIND_256.json | awk '{print $1}')" = d2c50a1293e68c3feb8571d1ee1be6ba1a7ee539a12dd1a98378adfa9b54fb58
          python tools/c3x_024_P4_July2025_256source_only_rights_gate.py --file source/C3X024_P4_JULY2025_ENGINEBLIND_256.json --report evidence/ORIGINAL_SOURCE_RIGHTS_SCAN.json
      - name: Native Stockfish16 single-return plus second-return and persistent-state build
        run: |
          set -euo pipefail
          root=/tmp/C3X020_MULTI_STATE
          git clone -q --single-branch --branch sf_16 https://github.com/official-stockfish/Stockfish.git "$root"
          test "$(git -C "$root" rev-parse HEAD)" = 68e1e9b3811e16cad014b590d7443b9063b3eb52
          python tools/c3x_016_P4_independent_12root_source_order_patch.py --source "$root" --out-manifest evidence/P4.json
          python tools/c3x_017_early_depth1_root_window_trace_patch.py --source "$root" --out-manifest evidence/ROOT_TRACE.json
          python tools/c3x_018_trial_call_identity_patch.py --source "$root" --out-manifest evidence/TRIAL_ID.json
          python tools/c3x_018_physical_epoch_lineage_patch.py --source "$root" --out-manifest evidence/EPOCH.json
          python tools/c3x_018_tt_eval_consumption_overlay.py --source "$root" --out-manifest evidence/V.json
          python tools/c3x_018_physical_value_witness_overlay.py --source "$root" --out-manifest evidence/WRITER_TICKET.json
          python tools/c3x_018_root_TT_genealogy_overlay.py --source "$root" --out-manifest evidence/ROOT_TT_LINEAGE.json
          python tools/c3x_018_TT_reader_writer_age_bound_root_feature_overlay.py --source "$root" --out-manifest evidence/AGE_BOUND.json
          python tools/c3x_018_january2048_TT_reader_source_census.py --source "$root" --out-manifest evidence/CENSUS.json
          python tools/c3x_018_adaptive_writer_age_root_call_V_gate.py --source "$root" --out-manifest evidence/AGE_GATE.json
          python tools/c3x_018_january_cross_window_pair_source_gate.py --source "$root" --out-manifest evidence/WINDOW_GATE.json
          python tools/c3x_018_jan_original_key_TT_probe_watch_overlay.py --source "$root" --out-manifest evidence/PROBE.json
          python tools/c3x_018_jan_TT_probe_physical_writer_epoch_witness.py --source "$root" --out-manifest evidence/PROBE_WRITER.json
          python tools/c3x_018_P0P1_TT_save_decision_writer_reinstate_overlay.py --source "$root" --out-manifest evidence/P0_P1_SOURCE_MUTATION.json
          python tools/c3x_018_P1_pre_second_reader_temporal_scope_overlay.py --source "$root" --out-manifest evidence/P1_PRE_SECOND_TEMPORAL_GATE.json
          python tools/c3x_019_tt_raw_bytes_shadow_writer_orthogonal_overlay.py --source "$root" --out-manifest evidence/C3X019_ORTHOGONAL_WRITER_STATE.json
          python tools/c3x_019_actual_native_tt_eval_use_source_witness.py --source "$root" --out-manifest evidence/C3X019_NATIVE_EVAL_USE.json
          python tools/c3x_019_native_TT_cutoff_actual_return_overlay.py --source "$root" --out-manifest evidence/C3X019_NATIVE_TT_CUTOFF_RETURN.json
          python tools/c3x_019_root_return_one_site_rescue_overlay.py --source "$root" --out-manifest evidence/ONE_SITE_RETURN_MUTATION.json
          python tools/c3x_020_multi_state_root_repair_overlay.py --source "$root" --out-manifest evidence/C3X020_MULTI_STATE_MUTATION.json
          python tools/c3x_022_P2_R2_native_SEE_source_witness_overlay.py --source "$root" --out-manifest evidence/C3X022_R2_NATIVE_SEE_FOUR_SOURCE_SITES.json
          python tools/c3x_022_P2_R2_D1_rootcall_only_SEE_observer.py --source "$root" --out-manifest evidence/C3X022_R2_D1_DESCENDANT_READONLY.json
          python tools/c3x_023_P1_native_SEE_parent_path_key_overlay.py --source "$root" --out-manifest evidence/C3X023_P1_MAIN_QSEARCH_ANCESTRY_KEYPATH.json
          git -C "$root" diff -- src/ > /tmp/C3X023_GPL_MODIFIED_ENGINE_SOURCE.diff
          sha256sum /tmp/C3X023_GPL_MODIFIED_ENGINE_SOURCE.diff | awk '{print $1 "  GPL_DIFF_PRIVATE_NOT_UPLOADED"}' > evidence/MODIFIED_GPL_DIFF_SHA256.txt
          make -s -C "$root/src" -j2 build ARCH=x86-64
          sha256sum "$root/src/stockfish" | awk '{print $1 "  MODIFIED_ENGINE_BINARY_NOT_UPLOADED"}' > evidence/BINARY_SHA256.txt
      - name: Original per-game no-V July256 fixed shard ${{ matrix.shard }} exactly 64 games
        run: |
          set -euo pipefail
          python -u harness/c3x_024_P4_S2_O2_sharded_untreated_StageA_original_reconstruction.py --source source/C3X024_P4_JULY2025_ENGINEBLIND_256.json --engine /tmp/C3X020_MULTI_STATE/src/stockfish --shard ${{ matrix.shard }} --out evidence/C3X024_P4_STAGEA_SOURCE_SHARD_${{ matrix.shard }}.json
          python tools/c3x_023_rights_preupload_gate.py --tier P2_AGGREGATE_SUMMARY --file evidence/C3X024_P4_STAGEA_SOURCE_SHARD_${{ matrix.shard }}.json --report evidence/RIGHTS_ORIGINAL_SHARD_${{ matrix.shard }}.json
          echo 'Official Lichess July2025 broadcast CC BY-SA4 https://database.lichess.org/broadcast/lichess_db_broadcast_2025-07.pgn.zst, source original 256 games 4x64 source-only untreated native no FIRST. Original full PGN, player headers and GPL modified engine binaries not uploaded.' > evidence/SOURCE_LICENSE_NOTICE.txt
      - name: Original native source rights evidence member SHA
        if: always()
        run: |
          find evidence -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > evidence/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-024-P4-July256-untreated-original-native-StageA-shard-${{ matrix.shard }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
  aggregate-256-unmodified-source-game-preFIRST:
    needs: [four-original-sha-preFIRST-source-native-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact four original 64 game physical source histories, do not filter successes
        uses: actions/download-artifact@v4
        with:
          pattern: c3x-024-P4-July256-untreated-original-native-StageA-shard-*
          path: parts/
          merge-multiple: true
      - name: Check full SHA and original 256 source game IDs and rebuild genuine Stage A
        run: |
          set -euo pipefail
          python -m py_compile harness/c3x_024_P4_S2_O2_sharded_untreated_StageA_original_reconstruction.py
          test -f parts/C3X024_P4_STAGEA_SOURCE_SHARD_0.json
          test -f parts/C3X024_P4_STAGEA_SOURCE_SHARD_1.json
          test -f parts/C3X024_P4_STAGEA_SOURCE_SHARD_2.json
          test -f parts/C3X024_P4_STAGEA_SOURCE_SHARD_3.json
          mkdir -p evidence
          PYTHONPATH=harness python -u harness/c3x_024_P4_S2_O2_sharded_untreated_StageA_original_reconstruction.py --source c3x/forecasts/c3x-024-P4-July2025-256-source-game-SHA-human-Git-seal-before-native-20261011.json --parts parts/C3X024_P4_STAGEA_SOURCE_SHARD_0.json parts/C3X024_P4_STAGEA_SOURCE_SHARD_1.json parts/C3X024_P4_STAGEA_SOURCE_SHARD_2.json parts/C3X024_P4_STAGEA_SOURCE_SHARD_3.json --out evidence/C3X024_P4_JULY2025_STAGEA_UNTREATED_NATIVE256.json
          python tools/c3x_023_rights_preupload_gate.py --tier P2_AGGREGATE_SUMMARY --file evidence/C3X024_P4_JULY2025_STAGEA_UNTREATED_NATIVE256.json --report evidence/RIGHTS_JULY256_MERGED_UNTREATED_SOURCE.json
          echo 'Lichess original July2025 broadcast CC BY-SA 4.0; exact 256 source-git sealed game identity original Stockfish16 no-FIRST native UCI summary, source original PGN/player/GPL-modified binaries not in uploaded artifact.' > evidence/SOURCE_LICENSE_NOTICE.txt
      - name: SHA manifest for rights scoped original StageA
        if: always()
        run: |
          mkdir -p evidence
          find evidence -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > evidence/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-024-P4-July256-4shard-merged-genuine-untreated-native-StageA
          path: evidence/
          if-no-files-found: error
          retention-days: 90
