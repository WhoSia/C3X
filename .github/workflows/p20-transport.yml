name: p20-r2-cross-engine-naturality

on:
  push:
    paths:
      - ".github/workflows/p20-transport.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  merge-worlds:
    name: R2 inherit valid fresh-world constitution from superseded instrument run
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Await all eight independent world artifacts from source run
        shell: bash
        run: |
          set -euo pipefail
          source_run=36026765136
          for i in $(seq 1 90); do
            n="$(gh api "repos/WhoSia/C3X/actions/runs/$source_run/artifacts?per_page=100" --jq '[.artifacts[] | select(.name | startswith("p20-stage-a-"))] | length')"
            echo "P20_SOURCE_WORLD_ARTIFACTS $n/8"
            if [ "$n" = "8" ]; then exit 0; fi
            status="$(gh api "repos/WhoSia/C3X/actions/runs/$source_run" --jq '.status')"
            if [ "$status" = "completed" ]; then
              echo "source run completed before all eight world artifacts existed"
              exit 1
            fi
            sleep 10
          done
          echo "source-world artifact acquisition timeout"
          exit 1

      - name: Download source-run world artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: p20-stage-a-*
          path: parts
          repository: WhoSia/C3X
          run-id: 36026765136
          github-token: ${{ github.token }}

      - name: Merge and verify inherited symmetric fresh pool
        run: |
          mkdir -p out
          python3 compiler/exact_world/p20_merge.py \
            --parts parts \
            --out out/p20-stage-a-pool.json

      - uses: actions/upload-artifact@v4
        with:
          name: p20-stage-a-pool
          path: out/
          retention-days: 30

  instrument:
    name: R2 portable transport-binary revalidation + SF19 bridge
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download canonical R1 authorization
        uses: actions/download-artifact@v4
        with:
          name: p20-r1-admission-result
          path: r1/result
          repository: WhoSia/C3X
          run-id: 36026256576
          github-token: ${{ github.token }}

      - name: Verify R1 causal-adapter authorization
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=next(Path("r1/result").glob("p20-r1-admission-result.json"))
          x=json.loads(p.read_text())
          assert x["authorization"]=="P20-HETEROGENEOUS-ADMISSION-PASS", x
          assert x["engines"]["berserk"]["verdict"]=="PASS"
          assert x["engines"]["ethereal"]["verdict"]=="PASS"
          print("P20_R1_AUTHORIZATION_PASS",x["result_sha256"])
          PY

      - name: Clone exact Berserk source into portable revalidation triplet
        run: |
          git clone https://github.com/jhonnold/berserk.git ext/berserk-source
          git -C ext/berserk-source checkout --detach 32628515050b83805bab4afa1026dd2bcaa93f55
          test "$(git -C ext/berserk-source rev-parse HEAD)" = "32628515050b83805bab4afa1026dd2bcaa93f55"
          cp -a ext/berserk-source ext/berserk-baseline
          cp -a ext/berserk-source ext/berserk-instrument
          cp -a ext/berserk-source ext/berserk-removal
          mkdir -p out/revalidation/berserk
          python3 tools/p20_patch_berserk.py \
            --root ext/berserk-instrument \
            --variant instrument \
            --manifest out/revalidation/berserk/instrument-manifest.json
          python3 tools/p20_patch_berserk.py \
            --root ext/berserk-removal \
            --variant removal \
            --manifest out/revalidation/berserk/removal-manifest.json

      - name: Build portable Berserk triplet without runner-native ISA promotion
        shell: bash
        run: |
          set -eux
          for d in baseline instrument removal; do
            make -C "ext/berserk-$d/src" ARCH=x86-64 M64=-m64 build
          done
          cp ext/berserk-baseline/src/berserk out/revalidation/berserk/baseline
          cp ext/berserk-instrument/src/berserk out/revalidation/berserk/instrument
          cp ext/berserk-removal/src/berserk out/revalidation/berserk/removal
          chmod +x out/revalidation/berserk/baseline out/revalidation/berserk/instrument out/revalidation/berserk/removal
          sha256sum out/revalidation/berserk/baseline out/revalidation/berserk/instrument out/revalidation/berserk/removal \
            | tee out/revalidation/berserk/binary-sha256.txt

      - name: Revalidate portable Berserk causal admission
        run: |
          python3 harness/p20_engine_admission.py \
            --engine berserk \
            --baseline out/revalidation/berserk/baseline \
            --instrument out/revalidation/berserk/instrument \
            --removal out/revalidation/berserk/removal \
            --instrument-manifest out/revalidation/berserk/instrument-manifest.json \
            --removal-manifest out/revalidation/berserk/removal-manifest.json \
            --nodes 80000 \
            --out out/revalidation/berserk/admission.json

      - name: Clone exact Ethereal source into portable revalidation triplet
        run: |
          git clone https://github.com/AndyGrant/Ethereal.git ext/ethereal-source
          git -C ext/ethereal-source checkout --detach 0e47e9b67f345c75eb965d9fb3e2493b6a11d09a
          test "$(git -C ext/ethereal-source rev-parse HEAD)" = "0e47e9b67f345c75eb965d9fb3e2493b6a11d09a"
          cp -a ext/ethereal-source ext/ethereal-baseline
          cp -a ext/ethereal-source ext/ethereal-instrument
          cp -a ext/ethereal-source ext/ethereal-removal
          mkdir -p out/revalidation/ethereal
          python3 tools/p20_patch_ethereal.py \
            --root ext/ethereal-instrument \
            --variant instrument \
            --manifest out/revalidation/ethereal/instrument-manifest.json
          python3 tools/p20_patch_ethereal.py \
            --root ext/ethereal-removal \
            --variant removal \
            --manifest out/revalidation/ethereal/removal-manifest.json

      - name: Build portable Ethereal triplet without -march=native
        shell: bash
        run: |
          set -eux
          PORTABLE_CFLAGS='-O3 -std=gnu11 -Wall -Wextra -Wshadow -DNDEBUG -flto -DUSE_NNUE=0 -static'
          for d in baseline instrument removal; do
            make -C "ext/ethereal-$d/src" basic CFLAGS="$PORTABLE_CFLAGS"
          done
          cp ext/ethereal-baseline/src/Ethereal out/revalidation/ethereal/baseline
          cp ext/ethereal-instrument/src/Ethereal out/revalidation/ethereal/instrument
          cp ext/ethereal-removal/src/Ethereal out/revalidation/ethereal/removal
          chmod +x out/revalidation/ethereal/baseline out/revalidation/ethereal/instrument out/revalidation/ethereal/removal
          sha256sum out/revalidation/ethereal/baseline out/revalidation/ethereal/instrument out/revalidation/ethereal/removal \
            | tee out/revalidation/ethereal/binary-sha256.txt

      - name: Revalidate portable Ethereal causal admission
        run: |
          python3 harness/p20_engine_admission.py \
            --engine ethereal \
            --baseline out/revalidation/ethereal/baseline \
            --instrument out/revalidation/ethereal/instrument \
            --removal out/revalidation/ethereal/removal \
            --instrument-manifest out/revalidation/ethereal/instrument-manifest.json \
            --removal-manifest out/revalidation/ethereal/removal-manifest.json \
            --nodes 80000 \
            --out out/revalidation/ethereal/admission.json

      - name: Rebuild source-locked SF19 bridge with P19 lineage instrument
        run: |
          git clone https://github.com/official-stockfish/Stockfish.git sf19
          git -C sf19 checkout --detach edb0d9db6731067ec50ce619ff372b463bc4dd5d
          test "$(git -C sf19 rev-parse HEAD)" = "edb0d9db6731067ec50ce619ff372b463bc4dd5d"
          python3 tools/materialize_p15.py --stockfish sf19 --target stockfish_19
          make -C sf19/src clean
          make -C sf19/src -j2 build ARCH=x86-64

      - name: Materialize revalidated R2 binary packet
        run: |
          mkdir -p out/packet
          cp out/revalidation/berserk/instrument out/packet/c3x-p20-berserk
          cp out/revalidation/ethereal/instrument out/packet/c3x-p20-ethereal
          cp sf19/src/stockfish out/packet/c3x-p20-sf19
          chmod +x out/packet/c3x-p20-berserk out/packet/c3x-p20-ethereal out/packet/c3x-p20-sf19
          sha256sum out/packet/c3x-p20-berserk out/packet/c3x-p20-ethereal out/packet/c3x-p20-sf19 | tee out/packet/binary-sha256.txt
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          def sh(p):
              h=hashlib.sha256()
              with open(p,"rb") as f:
                  for b in iter(lambda:f.read(1<<20),b""): h.update(b)
              return h.hexdigest()
          b=json.loads(Path("out/revalidation/berserk/admission.json").read_text())
          e=json.loads(Path("out/revalidation/ethereal/admission.json").read_text())
          assert b["verdict"]=="PASS" and e["verdict"]=="PASS"
          x={
            "schema":"c3x-p20-r2-portable-binary-revalidation-v1",
            "scientific_stage":"C3X 0.7.0-G9.4-P20-R2",
            "r1_run_id":36026256576,
            "transport_outcomes_consulted":False,
            "reason":"R1 artifact binary hit runner-dependent illegal-instruction portability failure; causal source/adapter contract is unchanged.",
            "build_policy":{
              "berserk":"ARCH=x86-64 with M64=-m64; no -march=native and no forced POPCNT",
              "ethereal":"generic C flags; no -march=native / USE_* SIMD feature promotion",
              "stockfish_19":"source-locked P19 instrument, ARCH=x86-64"
            },
            "admission_revalidation":{
              "berserk":b["verdict"],
              "ethereal":e["verdict"]
            },
            "packet_sha256":{
              "berserk":sh("out/packet/c3x-p20-berserk"),
              "ethereal":sh("out/packet/c3x-p20-ethereal"),
              "stockfish_19":sh("out/packet/c3x-p20-sf19")
            }
          }
          payload=json.dumps(x,sort_keys=True,separators=(",",":")).encode()
          x["receipt_sha256"]=hashlib.sha256(payload).hexdigest()
          Path("out/packet/p20-r2-portable-binary-revalidation.json").write_text(
              json.dumps(x,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(x,indent=2,sort_keys=True))
          PY

      - name: Generic UCI smoke on transport packet
        shell: bash
        run: |
          for b in out/packet/c3x-p20-berserk out/packet/c3x-p20-ethereal out/packet/c3x-p20-sf19; do
            log="$(mktemp)"
            printf "%s\n" uci isready quit | timeout 20s "$b" > "$log" 2>&1
            grep -Fxq "uciok" "$log"
            grep -Fxq "readyok" "$log"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: p20-r2-instrument
          path: out/
          retention-days: 30

  census:
    name: R2 joint SHAM census — ${{ matrix.family }}
    needs: [merge-worlds, instrument]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        family: [KQQvKQ, KQRvKQ, KQQvKR, KQRvKR, KRBvKB, KRNvKB, KRBvKN, KRNvKN]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p20-stage-a-pool
          path: stage
      - uses: actions/download-artifact@v4
        with:
          name: p20-r2-instrument
          path: instrument
      - name: SHAM-only joint engagement census
        run: |
          chmod +x instrument/c3x-p20-*
          mkdir -p out
          python3 harness/p20_transport.py census \
            --stage-a stage/p20-stage-a-pool.json \
            --engine stockfish_19,stockfish_uci,instrument/c3x-p20-sf19 \
            --engine berserk,env,instrument/c3x-p20-berserk \
            --engine ethereal,env,instrument/c3x-p20-ethereal \
            --family "${{ matrix.family }}" \
            --out "out/p20-census-${{ matrix.family }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: p20-census-${{ matrix.family }}
          path: out/
          retention-days: 30

  precommit:
    name: R2 seal 96-cell same-world precommit
    needs: census
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p20-stage-a-pool
          path: stage
      - uses: actions/download-artifact@v4
        with:
          pattern: p20-census-*
          path: census
      - name: Seal outcome-blind committed cells
        run: |
          mkdir -p out
          python3 harness/p20_transport.py seal \
            --stage-a stage/p20-stage-a-pool.json \
            --census-dir census \
            --out out/p20-r2-precommit.json
      - uses: actions/upload-artifact@v4
        with:
          name: p20-r2-precommit
          path: out/
          retention-days: 30

  vertex:
    name: R2 selective interventions — ${{ matrix.family }}
    needs: [precommit, instrument]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        family: [KQQvKQ, KQRvKQ, KQQvKR, KQRvKR, KRBvKB, KRNvKB, KRBvKN, KRNvKN]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p20-r2-precommit
          path: precommit
      - uses: actions/download-artifact@v4
        with:
          name: p20-r2-instrument
          path: instrument
      - name: Execute sealed five-arm interventions
        run: |
          chmod +x instrument/c3x-p20-*
          mkdir -p out
          python3 harness/p20_transport.py vertex \
            --precommit precommit/p20-r2-precommit.json \
            --engine stockfish_19,stockfish_uci,instrument/c3x-p20-sf19 \
            --engine berserk,env,instrument/c3x-p20-berserk \
            --engine ethereal,env,instrument/c3x-p20-ethereal \
            --family "${{ matrix.family }}" \
            --out "out/p20-vertex-${{ matrix.family }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: p20-vertex-${{ matrix.family }}
          path: out/
          retention-days: 30

  adjudicate:
    name: R2 engine-family naturality adjudication
    needs: vertex
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: p20-vertex-*
          path: vertices
      - name: Adjudicate same-world cross-engine relation geometry
        run: |
          mkdir -p out
          python3 harness/p20_transport.py adjudicate \
            --result-dir vertices \
            --out out/p20-r2-result.json
          sha256sum out/p20-r2-result.json | tee out/result-file-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p20-r2-result
          path: out/
          retention-days: 30
