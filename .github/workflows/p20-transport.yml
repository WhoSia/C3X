name: p20-r2-cross-engine-naturality

on:
  push:
    paths:
      - ".github/workflows/p20-transport.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  merge-worlds:
    name: R2 inherit and verify sealed 576-world outcome-blind pool
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify donor merged-pool artifact identity before download
        shell: bash
        run: |
          set -euo pipefail
          source_run=36026765136
          got="$(gh api "repos/WhoSia/C3X/actions/runs/$source_run/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="p20-stage-a-pool") | [.id,.digest] | @tsv')"
          test "$got" = $'10822061010\tsha256:bfaaa15ae76ea580d89beef2a70cad5e04a2fafec775f54c20fdfa36cde65a81'
          echo "P20_DONOR_POOL_ARTIFACT_IDENTITY_PASS $got"

      - name: Download sealed donor pool
        uses: actions/download-artifact@v4
        with:
          name: p20-stage-a-pool
          path: out
          repository: WhoSia/C3X
          run-id: 36026765136
          github-token: ${{ github.token }}

      - name: Verify donor pool scientific constitution
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          p=Path("out/p20-stage-a-pool.json")
          x=json.loads(p.read_text())
          assert x["schema"]=="c3x-p20-r2-stage-a-pool-v1"
          assert x["scientific_stage"]=="C3X 0.7.0-G9.4-P20-R2"
          assert x["compiler_version"]=="c3x-p20-r2-stage-a-v1"
          assert x["stockfish_outcomes_consulted"] is False
          assert x["cross_engine_transport_outcomes_consulted"] is False
          assert x["freshness"]["generation_index_offset"]==80000
          assert x["pool_sha256"]=="1fc45b4fcb8db407cd95d937861d895348876332dd35a3093f8c45ff805d5291"
          cs=x["candidates"]
          assert len(cs)==576
          by=Counter(c["material_seed_name"] for c in cs)
          expected={"KQQvKQ","KQRvKQ","KQQvKR","KQRvKR","KRBvKB","KRNvKB","KRBvKN","KRNvKN"}
          assert set(by)==expected and all(by[m]==72 for m in expected),by
          for m in expected:
              sides=Counter(c["side_to_move"] for c in cs if c["material_seed_name"]==m)
              assert sides==Counter({"WHITE":36,"BLACK":36}),(m,sides)
          print("P20_DONOR_POOL_CONSTITUTION_PASS",len(cs),x["pool_sha256"])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: p20-stage-a-pool
          path: out/
          retention-days: 30

  instrument:
    name: R2 inherit and verify portable revalidated transport packet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Inherit portable-revalidated packet from pre-census predecessor
        uses: actions/download-artifact@v4
        with:
          name: p20-r2-instrument
          path: out
          repository: WhoSia/C3X
          run-id: 36027604444
          github-token: ${{ github.token }}

      - name: Verify portable receipt and exact packet identity
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          expected={
            "berserk":"5e95346d204dfa88a61e1c7a539906079b4a72053e4afcaac151b2b44285cc1f",
            "ethereal":"55d1fea3dd34c2478143c01cf802c60b2fc0e8253888051725a2d01062867a8d",
            "stockfish_19":"bb8487ab5de45a192d56502fdf33d3b74e5489f043528ea1240c68b7c7533425"
          }
          receipt=json.loads(Path("out/packet/p20-r2-portable-binary-revalidation.json").read_text())
          assert receipt["receipt_sha256"]=="f19ebf4996c210b3d51e8f27deedc6cab17ed8a0aeb5001717a8d0c6ad3cc66e"
          assert receipt["admission_revalidation"]=={"berserk":"PASS","ethereal":"PASS"}
          assert receipt["packet_sha256"]==expected
          def sh(p):
              h=hashlib.sha256()
              with open(p,"rb") as f:
                  for b in iter(lambda:f.read(1<<20),b""): h.update(b)
              return h.hexdigest()
          actual={
            "berserk":sh("out/packet/c3x-p20-berserk"),
            "ethereal":sh("out/packet/c3x-p20-ethereal"),
            "stockfish_19":sh("out/packet/c3x-p20-sf19")
          }
          assert actual==expected,(actual,expected)
          print("P20_PORTABLE_PACKET_IDENTITY_PASS",receipt["receipt_sha256"])
          PY

      - name: Restore execute bits and generic UCI smoke
        shell: bash
        run: |
          chmod +x out/packet/c3x-p20-berserk out/packet/c3x-p20-ethereal out/packet/c3x-p20-sf19
          for b in out/packet/c3x-p20-berserk out/packet/c3x-p20-ethereal out/packet/c3x-p20-sf19; do
            log="$(mktemp)"
            printf "%s\n" uci isready quit | timeout 20s "$b" > "$log" 2>&1
            grep -Fxq "uciok" "$log"
            grep -Fxq "readyok" "$log"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: p20-r2-instrument
          path: out/
          retention-days: 30

  census:
    name: R2 joint SHAM census — ${{ matrix.family }}
    needs: [merge-worlds, instrument]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        family: [KQQvKQ, KQRvKQ, KQQvKR, KQRvKR, KRBvKB, KRNvKB, KRBvKN, KRNvKN]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p20-stage-a-pool
          path: stage
      - uses: actions/download-artifact@v4
        with:
          name: p20-r2-instrument
          path: instrument
      - name: SHAM-only joint engagement census
        run: |
          chmod +x instrument/packet/c3x-p20-*
          mkdir -p out
          python3 harness/p20_transport.py census \
            --stage-a stage/p20-stage-a-pool.json \
            --engine stockfish_19,stockfish_uci,instrument/packet/c3x-p20-sf19 \
            --engine berserk,env,instrument/packet/c3x-p20-berserk \
            --engine ethereal,env,instrument/packet/c3x-p20-ethereal \
            --family "${{ matrix.family }}" \
            --out "out/p20-census-${{ matrix.family }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: p20-census-${{ matrix.family }}
          path: out/
          retention-days: 30

  precommit:
    name: R2 seal 96-cell same-world precommit
    needs: census
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p20-stage-a-pool
          path: stage
      - uses: actions/download-artifact@v4
        with:
          pattern: p20-census-*
          path: census
      - name: Seal outcome-blind committed cells
        run: |
          mkdir -p out
          python3 harness/p20_transport.py seal \
            --stage-a stage/p20-stage-a-pool.json \
            --census-dir census \
            --out out/p20-r2-precommit.json
      - uses: actions/upload-artifact@v4
        with:
          name: p20-r2-precommit
          path: out/
          retention-days: 30

  vertex:
    name: R2 selective interventions — ${{ matrix.family }}
    needs: [precommit, instrument]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        family: [KQQvKQ, KQRvKQ, KQQvKR, KQRvKR, KRBvKB, KRNvKB, KRBvKN, KRNvKN]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p20-r2-precommit
          path: precommit
      - uses: actions/download-artifact@v4
        with:
          name: p20-r2-instrument
          path: instrument
      - name: Execute sealed five-arm interventions
        run: |
          chmod +x instrument/c3x-p20-*
          mkdir -p out
          python3 harness/p20_transport.py vertex \
            --precommit precommit/p20-r2-precommit.json \
            --engine stockfish_19,stockfish_uci,instrument/packet/c3x-p20-sf19 \
            --engine berserk,env,instrument/packet/c3x-p20-berserk \
            --engine ethereal,env,instrument/packet/c3x-p20-ethereal \
            --family "${{ matrix.family }}" \
            --out "out/p20-vertex-${{ matrix.family }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: p20-vertex-${{ matrix.family }}
          path: out/
          retention-days: 30

  adjudicate:
    name: R2 engine-family naturality adjudication
    needs: vertex
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: p20-vertex-*
          path: vertices
      - name: Adjudicate same-world cross-engine relation geometry
        run: |
          mkdir -p out
          python3 harness/p20_transport.py adjudicate \
            --result-dir vertices \
            --out out/p20-r2-result.json
          sha256sum out/p20-r2-result.json | tee out/result-file-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p20-r2-result
          path: out/
          retention-days: 30
