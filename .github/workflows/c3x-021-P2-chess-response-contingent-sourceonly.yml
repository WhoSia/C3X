name: C3X 0.21 P2 Standard Chess Response-Contingent Decision Primitive Court
on:
  push:
    paths:
      - '.github/workflows/c3x-021-P2-chess-response-contingent-sourceonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-ply-legal-chess-primitive-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent legal chess response census unit fixtures
        run: |
          python -m pip install -q chess==1.11.2
          python -m py_compile harness/c3x_021_P2_reply_contingent_chess_primitives.py
          python -m unittest discover -s tools -p 'test_c3x_021_P2_reply_contingent_chess_primitives.py' -v
      - name: Source-month March16 original legal games (engine-free)
        uses: actions/download-artifact@v4
        with:
          name: c3x-020-C2-march2026-enginefree-blind16-source
          path: march/
          repository: WhoSia/C3X
          run-id: '38038059013'
          github-token: ${{ github.token }}
      - name: Original sealed all-635 root moves and legal immediate reply SHAs
        uses: actions/download-artifact@v4
        with:
          name: c3x-021-P1-all-legal-atomic-march16-source
          path: atomic/
          repository: WhoSia/C3X
          run-id: '38039330829'
          github-token: ${{ github.token }}
      - name: Freeze exact two-root response contingent legality and forced reply space
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(sha256sum march/C3X020_C2_MARCH_BLIND16_SOURCE.json | cut -d' ' -f1)" = d79e48633be2b683176f1a6d4650aeea1b7584f11c85c2349a5bddda113febee
          test "$(sha256sum atomic/C3X021_P1_ATOMIC_CHESS_TRANSITIONS_MARCH16.json | cut -d' ' -f1)" = c14711c0e31bde26c2c7fc6e77f1f2fdf0ac70180a517b91f71845f1fd78ed3f
          python -u harness/c3x_021_P2_reply_contingent_chess_primitives.py \
            --march march/C3X020_C2_MARCH_BLIND16_SOURCE.json \
            --atomic atomic/C3X021_P1_ATOMIC_CHESS_TRANSITIONS_MARCH16.json \
            --out evidence/C3X021_P2_CHESS_RESPONSE_CONTINGENT_3PLY.json | tee evidence/CHESS_SOURCE_ONLY_STDOUT.txt
          python - <<'PY'
          import json
          d=json.load(open("evidence/C3X021_P2_CHESS_RESPONSE_CONTINGENT_3PLY.json"))
          assert set(d["selected_cases"])=={"4","9"}
          assert d["selected_cases"]["4"]["F_legal_opponent_reply_count"]==29
          assert d["selected_cases"]["4"]["V_legal_opponent_reply_count"]==29
          assert d["selected_cases"]["9"]["F_legal_opponent_reply_count"]==40
          assert d["selected_cases"]["9"]["V_legal_opponent_reply_count"]==41
          print("C3X021_P2_ALL_RESPONSE_CONTINGENT_CHESS_STANDARD_LEGAL_PASS")
          PY
      - name: Hash all source only members
        if: always()
        run: |
          mkdir -p evidence
          find evidence -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > evidence/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-021-P2-standard-chess-3ply-response-contingent-source
          path: evidence/
          retention-days: 90
          if-no-files-found: error
