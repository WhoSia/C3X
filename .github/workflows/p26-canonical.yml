name: p26-canonical-product-field-parallel
on:
  push:
    paths:
      - ".github/workflows/p26-canonical.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PREFIX_RUN: 36148531504
  INSTRUMENT_RUN: 36041727983
jobs:
  precommit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Compile current LawGen v2 constitution
        run: |
          cargo test --manifest-path crates/c3x-lawgen/Cargo.toml
          cargo run --release --manifest-path crates/c3x-lawgen/Cargo.toml --bin c3x-lawgen-v2 -- c3x/ontology/p26-lawgen-spec.json lawgen
          python3 - <<'PY'
          import json
          x=json.load(open('lawgen/constitution.json'))
          c=x['constitution']
          assert c['schema']=='c3x-lawgen-constitution-v2'
          assert 'adjudication_support' in c
          assert c['adjudication_support']['minimum_equalized_rows_per_vertex']==2
          print('P26_CANONICAL_LAWGEN_PASS',x['constitution_sha256'])
          PY
      - uses: actions/download-artifact@v4
        with:
          name: p26-core-pool
          path: stage
          repository: WhoSia/C3X
          run-id: ${{ env.PREFIX_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: p26-census-*
          path: census
          repository: WhoSia/C3X
          run-id: ${{ env.PREFIX_RUN }}
          github-token: ${{ github.token }}
      - name: Revalidate outcome-blind prefix and build frozen correspondence
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=json.load(open('stage/p26-core-pool.json'))
          assert len(p['candidates'])==384
          assert p['freshness']['generation_index_offset']==720000
          assert p['engine_outcomes_consulted'] is False
          xs=list(pathlib.Path('census').rglob('*.json'))
          assert len(xs)==8
          for q in xs:
            x=json.load(open(q)); assert x['selective_outcomes_consulted'] is False
          print('P26_PREFIX_REVALIDATED',p['pool_sha256'])
          PY
          mkdir -p atlas
          cargo test --manifest-path crates/c3x-atlas/Cargo.toml
          for b in 40000 80000 160000 300000; do
            python3 harness/p26_product_field.py export --census-dir census --budget "$b" --out "atlas/p26-census-$b.tsv"
            cargo run --release --manifest-path crates/c3x-atlas/Cargo.toml -- "atlas/p26-census-$b.tsv" "atlas/p26-atlas-$b.tsv" "atlas/p26-atlas-$b-receipt.json"
          done
          python3 harness/p26_product_field.py precommit --census-dir census --pool stage/p26-core-pool.json --constitution lawgen/constitution.json --atlas-dir atlas --out atlas/p26-precommit.json
      - uses: actions/upload-artifact@v4
        with:
          name: p26-canonical-precommit
          path: |
            atlas/
            lawgen/
            stage/p26-core-pool.json
          retention-days: 30
  vertex:
    needs: precommit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        family: [KQQvKQ,KQRvKQ,KQQvKR,KQRvKR,KRBvKB,KRNvKB,KRBvKN,KRNvKN]
        budget: [40000,80000,160000,300000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p26-canonical-precommit
          path: pre
      - uses: actions/download-artifact@v4
        with:
          name: p21-instrument-packet
          path: instrument
          repository: WhoSia/C3X
          run-id: ${{ env.INSTRUMENT_RUN }}
          github-token: ${{ github.token }}
      - name: Execute frozen family-budget product-field slice
        run: |
          chmod +x instrument/p20/packet/c3x-p20-*
          mkdir -p out
          python3 harness/p26_parallel.py vertex-budget --precommit pre/atlas/p26-precommit.json --engine stockfish_19,stockfish_uci,instrument/p20/packet/c3x-p20-sf19 --engine berserk,env,instrument/p20/packet/c3x-p20-berserk --engine ethereal,env,instrument/p20/packet/c3x-p20-ethereal --family "${{ matrix.family }}" --budget "${{ matrix.budget }}" --out "out/p26-${{ matrix.family }}-${{ matrix.budget }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: p26-slice-${{ matrix.family }}-${{ matrix.budget }}
          path: out/
          retention-days: 30
  adjudicate:
    needs: vertex
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p26-canonical-precommit
          path: pre
      - uses: actions/download-artifact@v4
        with:
          pattern: p26-slice-*
          path: slices
      - name: Reconstruct full-family receipts and adjudicate frozen field
        run: |
          python3 harness/p26_parallel.py merge --results slices --out-dir merged
          python3 harness/p26_product_field.py adjudicate --precommit pre/atlas/p26-precommit.json --results merged --out p26-adjudication.json
          node tools/p26-verify.mjs pre/p26-precommit.json p26-adjudication.json p26-report.md
          cat p26-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: p26-canonical-final
          path: |
            p26-adjudication.json
            p26-report.md
          retention-days: 30
