name: p32-event-targeted-tt-explainer

on:
  workflow_dispatch:
  push:
    paths:
      - "c3x/ontology/p32-support-from-p31.json"
      - "c3x/ontology/p32-lawgen-spec.json"
      - "crates/c3x-lawgen/src/bin/lawgen_v8.rs"
      - "tools/p32_event_target.inc"
      - "tools/p32_patch_event_target.py"
      - "harness/p32_event_court.py"
      - "harness/p32_explanation_verify.py"
      - ".github/workflows/p32.yml"

concurrency:
  group: p32-event-targeted-tt-explainer
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  P31_RUN: "36183969565"

jobs:
  lawgen:
    name: LawGen v8 event causality constitution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static gates
        run: |
          python3 -m py_compile tools/p32_patch_event_target.py harness/p32_event_court.py harness/p32_explanation_verify.py
          cargo run --release --manifest-path crates/c3x-lawgen/Cargo.toml --bin lawgen_v8 --             c3x/ontology/p32-lawgen-spec.json             c3x/ontology/p32-support-from-p31.json             out/lawgen
          sha256sum out/lawgen/* | sort > out/lawgen-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p32-lawgen-preseal
          path: out/
          retention-days: 30

  build:
    name: Event-target tracer — ${{ matrix.engine }}
    needs: lawgen
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: stockfish_19
            repo: https://github.com/official-stockfish/Stockfish.git
            commit: edb0d9db6731067ec50ce619ff372b463bc4dd5d
            native_policy: OFF
          - engine: berserk
            repo: https://github.com/jhonnold/berserk.git
            commit: 32628515050b83805bab4afa1026dd2bcaa93f55
            native_policy: OFF
          - engine: ethereal
            repo: https://github.com/AndyGrant/Ethereal.git
            commit: 0e47e9b67f345c75eb965d9fb3e2493b6a11d09a
            native_policy: ON
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p31-precommit-sealed
          path: parent-pre
          repository: WhoSia/C3X
          run-id: ${{ env.P31_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: p31-final-explainer
          path: parent-final
          repository: WhoSia/C3X
          run-id: ${{ env.P31_RUN }}
          github-token: ${{ github.token }}
      - name: Resolve source and parent authority
        run: |
          P31_PRE="$(find parent-pre -name p31-precommit.json -print -quit)"
          P31_FINAL="$(find parent-final -name p31-adjudication.json -print -quit)"
          test -n "$P31_PRE" && test -n "$P31_FINAL"
          echo "P31_PRE=$P31_PRE" >> "$GITHUB_ENV"
          echo "P31_FINAL=$P31_FINAL" >> "$GITHUB_ENV"
          git clone "${{ matrix.repo }}" src
          git -C src checkout --detach "${{ matrix.commit }}"
          test "$(git -C src rev-parse HEAD)" = "${{ matrix.commit }}"
          mkdir -p out
      - name: Materialize native observer and event-target chain
        run: |
          if [ "${{ matrix.engine }}" = stockfish_19 ]; then
            python3 tools/materialize_p15.py --stockfish src --target stockfish_19
          elif [ "${{ matrix.engine }}" = berserk ]; then
            python3 tools/p20_patch_berserk.py --root src --variant instrument --manifest out/p20.json
          else
            python3 tools/p20_patch_ethereal.py --root src --variant instrument --manifest out/p20.json
          fi
          python3 tools/p27_patch_age.py --root src --engine "${{ matrix.engine }}" --policy "${{ matrix.native_policy }}" --manifest out/p27.json
          python3 tools/p29_patch_tttrace.py --root src --engine "${{ matrix.engine }}" --policy "${{ matrix.native_policy }}" --manifest out/p29.json
          python3 tools/p30_patch_victim.py --root src --engine "${{ matrix.engine }}" --manifest out/p30.json
          python3 tools/p31_patch_semantics.py --root src --engine "${{ matrix.engine }}" --manifest out/p31.json
          python3 tools/p32_patch_event_target.py --root src --engine "${{ matrix.engine }}" --manifest out/p32.json
      - name: Build portable binary
        run: |
          set -eux
          if [ "${{ matrix.engine }}" = stockfish_19 ]; then
            make -C src/src -j2 build ARCH=x86-64
            cp src/src/stockfish out/c3x-p32-${{ matrix.engine }}
          elif [ "${{ matrix.engine }}" = berserk ]; then
            make -C src/src ARCH=x86-64 build
            cp src/src/berserk out/c3x-p32-${{ matrix.engine }}
          else
            ECFLAGS="-O3 -std=gnu11 -Wall -Wextra -Wshadow -DNDEBUG -flto -DUSE_NNUE=0 -march=x86-64 -msse2"
            make -C src/src basic CFLAGS="$ECFLAGS"
            cp src/src/Ethereal out/c3x-p32-${{ matrix.engine }}
          fi
          chmod +x out/c3x-p32-${{ matrix.engine }}
          sha256sum out/c3x-p32-${{ matrix.engine }} > out/p32-binary-sha256-${{ matrix.engine }}.txt
      - name: BASE transparency against P31 certificates
        run: |
          python3 harness/p32_event_court.py transparency             --engine "${{ matrix.engine }}"             --binary "out/c3x-p32-${{ matrix.engine }}"             --support c3x/ontology/p32-support-from-p31.json             --parent-final "$P31_FINAL"             --parent-pre "$P31_PRE"             --out "out/p32-transparency-${{ matrix.engine }}.json"
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["verdict"]=="PASS"' "out/p32-transparency-${{ matrix.engine }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: p32-build-${{ matrix.engine }}
          path: out/
          retention-days: 30

  precommit:
    name: Seal P32 event-causality cases
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p31-precommit-sealed
          path: parent-pre
          repository: WhoSia/C3X
          run-id: ${{ env.P31_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: p31-final-explainer
          path: parent-final
          repository: WhoSia/C3X
          run-id: ${{ env.P31_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with: {name: p32-lawgen-preseal, path: lawgen}
      - uses: actions/download-artifact@v4
        with:
          pattern: p32-build-*
          path: builds
      - run: |
          P31_PRE="$(find parent-pre -name p31-precommit.json -print -quit)"
          P31_FINAL="$(find parent-final -name p31-adjudication.json -print -quit)"
          CONST="$(find lawgen -name constitution.json -print -quit)"
          python3 harness/p32_event_court.py precommit             --support c3x/ontology/p32-support-from-p31.json             --parent-final "$P31_FINAL"             --parent-pre "$P31_PRE"             --constitution "$CONST"             --build-dir builds             --out p32-precommit.json
          sha256sum p32-precommit.json > p32-precommit-file-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p32-precommit-sealed
          path: p32-precommit*
          retention-days: 30

  case:
    name: Event court — ${{ matrix.artifact }}
    needs: precommit
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: stockfish_19, case_id: "stockfish_19:b27b7a24ddcd:CUTOFF", artifact: "sf-b27b-cutoff"}
          - {engine: stockfish_19, case_id: "stockfish_19:b27b7a24ddcd:MOVE_ORDER+EVAL", artifact: "sf-b27b-move-eval-diagnostic"}
          - {engine: stockfish_19, case_id: "stockfish_19:ec55f57dd7e3:CUTOFF", artifact: "sf-ec55-cutoff"}
          - {engine: stockfish_19, case_id: "stockfish_19:ec55f57dd7e3:MOVE_ORDER", artifact: "sf-ec55-move"}
          - {engine: stockfish_19, case_id: "stockfish_19:eccbac6921d8:EVAL", artifact: "sf-eccb-eval"}
          - {engine: stockfish_19, case_id: "stockfish_19:f85d0171a40b:MOVE_ORDER", artifact: "sf-f85d-move"}
          - {engine: stockfish_19, case_id: "stockfish_19:f85d0171a40b:EVAL", artifact: "sf-f85d-eval"}
          - {engine: stockfish_19, case_id: "stockfish_19:c18e10bd6a3a:CUTOFF", artifact: "sf-c18e-cutoff"}
          - {engine: stockfish_19, case_id: "stockfish_19:f8cde3d6abb4:MOVE_ORDER+EVAL", artifact: "sf-f8cd-move-eval-primary"}
          - {engine: berserk, case_id: "berserk:7dc2aade6996:MOVE_ORDER", artifact: "be-7dc2-move"}
          - {engine: berserk, case_id: "berserk:b27b7a24ddcd:MOVE_ORDER", artifact: "be-b27b-move"}
          - {engine: berserk, case_id: "berserk:b27b7a24ddcd:EVAL", artifact: "be-b27b-eval"}
          - {engine: berserk, case_id: "berserk:ec55f57dd7e3:MOVE_ORDER", artifact: "be-ec55-move"}
          - {engine: berserk, case_id: "berserk:f85d0171a40b:MOVE_ORDER", artifact: "be-f85d-move"}
          - {engine: berserk, case_id: "berserk:f8cde3d6abb4:CUTOFF", artifact: "be-f8cd-cutoff"}
          - {engine: berserk, case_id: "berserk:f8cde3d6abb4:EVAL", artifact: "be-f8cd-eval"}
          - {engine: ethereal, case_id: "ethereal:a8fd39b3864a:CUTOFF", artifact: "et-a8fd-cutoff"}
          - {engine: ethereal, case_id: "ethereal:c18e10bd6a3a:MOVE_ORDER", artifact: "et-c18e-move"}
          - {engine: ethereal, case_id: "ethereal:f8cde3d6abb4:MOVE_ORDER", artifact: "et-f8cd-move"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: p32-precommit-sealed, path: pre}
      - uses: actions/download-artifact@v4
        with:
          name: p32-build-${{ matrix.engine }}
          path: build
      - name: Execute event-target minimality court
        run: |
          chmod +x build/c3x-p32-${{ matrix.engine }}
          mkdir -p out
          python3 harness/p32_event_court.py case             --precommit pre/p32-precommit.json             --case-id "${{ matrix.case_id }}"             --binary build/c3x-p32-${{ matrix.engine }}             --out "out/p32-case-${{ matrix.artifact }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: p32-case-${{ matrix.artifact }}
          path: out/
          retention-days: 30

  adjudicate:
    name: Verify PV grounding and explanation synthesis
    needs: case
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: p32-precommit-sealed, path: pre}
      - uses: actions/download-artifact@v4
        with:
          pattern: p32-case-*
          path: cases
          merge-multiple: true
      - name: Install chess verifier
        run: python3 -m pip install --disable-pip-version-check python-chess==1.999
      - name: Compile and independently verify explanations
        run: |
          mkdir -p final
          python3 harness/p32_explanation_verify.py             --precommit pre/p32-precommit.json             --results cases             --out final/p32-adjudication.json             --ast final/p32-explanation-ast.json             --grounding final/p32-chess-grounding.json             --markdown final/p32-explanations.md
          sha256sum final/* | sort > final/p32-final-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p32-final-event-explainer
          path: final/
          retention-days: 30
