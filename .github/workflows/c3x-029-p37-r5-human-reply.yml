name: C3X P37 R5 Real Human Reply Court
on:
  push:
    paths:
      - '.github/workflows/c3x-029-p37-r5-human-reply.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observed-human-reply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original eight event source
        uses: actions/download-artifact@v4
        with:
          name: c3x-p37-r1-oct-eight-distinct-events-original-pgn-and-engine-blind-freeze
          repository: WhoSia/C3X
          run-id: '41968008046'
          path: source
          github-token: ${{ github.token }}
      - name: Fetch pre-referee prediction (no original human continuation in model input)
        uses: actions/download-artifact@v4
        with:
          name: c3x-p37-r2-pre-referee-eight-event-three-rival-predictions
          repository: WhoSia/C3X
          run-id: '41969173637'
          path: predictions
          github-token: ${{ github.token }}
      - name: Source-hash verified retrospective observed-human court with tampering tests
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import copy,hashlib,json,pathlib,sys
          sys.path.insert(0,'tools')
          from c3x_029_p37_r5_real_human_continuation_court import audit,SOURCE_JSON_SHA256,PRED_JSON_SHA256
          def open_verified(name,expected):
              raw=pathlib.Path(name).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==expected,'SOURCE_MEMBER_SHA_MISMATCH'
              return json.loads(raw)
          src=open_verified('source/P37_R1_8_EVENT_8_GAME_SOURCE_ONLY_MANIFEST.json',SOURCE_JSON_SHA256)
          pred=open_verified('predictions/P37_R2_THREE_RIVAL_PRE_REFERENCE_PREDICTIONS.json',PRED_JSON_SHA256)
          r=audit(src,pred)
          assert r['observed_human_reply_labels']==6
          assert r['counterfactual_unobserved']==2
          assert r['hits']=={'stockfish_pv':4,'simple_json':2,'c3x_legal_plan':1}
          z=copy.deepcopy(pred)
          z['cases'][0]['original_prefix_uci'][0]='a2a4'
          try:
              audit(src,z)
          except ValueError as e:
              assert 'PREFIX' in str(e)
          else:raise AssertionError('TAMPERED_PREFIX_ACCEPTED')
          y=copy.deepcopy(src)
          y['sources'][0]['selected']['full_game_uci'][31]='a7a6'
          try:
              audit(y,pred)
          except ValueError as e:
              assert 'GAME_HISTORY_SHA' in str(e)
          else:raise AssertionError('TAMPERED_HUMAN_MOVE_ACCEPTED')
          pathlib.Path('output/P37_R5_HUMAN_REPLY_AUDIT.json').write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          print('P37_R5_REAL_HUMAN_REPLY_COURT_PASS',r['hits'])
          PY
      - name: Archive integrity receipt, never write to git
        if: always()
        run: |
          mkdir -p output
          find output -type f -name '*.json' -print0 | xargs -0 -r sha256sum > output/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-p37-r5-observed-human-reply-court
          path: output/
          retention-days: 90
          if-no-files-found: error
