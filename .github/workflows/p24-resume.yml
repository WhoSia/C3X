name: p24-exact-prefix-resume
on:
  push:
    paths:
      - ".github/workflows/p24-resume.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  SOURCE_RUN: 36135412548
  INSTRUMENT_RUN: 36041727983
jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: p24-census-*
          path: census
          repository: WhoSia/C3X
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: p24-core-pool
          path: stage
          repository: WhoSia/C3X
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
      - name: Revalidate and export sealed outcome-blind census prefix
        run: python3 harness/p24_atlas.py export --census-dir census --out p24-census.tsv
      - name: Test Rust scientific kernel
        run: cargo test --manifest-path crates/c3x-atlas/Cargo.toml
      - name: Freeze empirical-copula atlas before any selective outcome
        run: cargo run --release --manifest-path crates/c3x-atlas/Cargo.toml -- p24-census.tsv p24-atlas.tsv p24-atlas-receipt.json
      - name: Materialize P24 precommit
        run: python3 harness/p24_atlas.py precommit --census-dir census --pool stage/p24-core-pool.json --atlas p24-atlas.tsv --atlas-receipt p24-atlas-receipt.json --out p24-core-precommit.json
      - uses: actions/upload-artifact@v4
        with:
          name: p24-atlas-precommit
          path: |
            p24-census.tsv
            p24-atlas.tsv
            p24-atlas-receipt.json
            p24-core-precommit.json
          retention-days: 30
  vertex:
    needs: atlas
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        family: [KQQvKQ,KQRvKQ,KQQvKR,KQRvKR,KRBvKB,KRNvKB,KRBvKN,KRNvKN]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p24-atlas-precommit
          path: pre
      - uses: actions/download-artifact@v4
        with:
          name: p21-instrument-packet
          path: instrument
          repository: WhoSia/C3X
          run-id: ${{ env.INSTRUMENT_RUN }}
          github-token: ${{ github.token }}
      - name: Execute frozen intervention algebra on every fresh atlas cell
        run: |
          chmod +x instrument/p20/packet/c3x-p20-* instrument/inanis/inanis-instrument
          mkdir -p out
          python3 harness/p24_atlas.py vertex --precommit pre/p24-core-precommit.json --engine stockfish_19,stockfish_uci,instrument/p20/packet/c3x-p20-sf19 --engine berserk,env,instrument/p20/packet/c3x-p20-berserk --engine ethereal,env,instrument/p20/packet/c3x-p20-ethereal --inanis instrument/inanis/inanis-instrument --family "${{ matrix.family }}" --nodes 300000 --out "out/p24-core-${{ matrix.family }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: p24-vertex-${{ matrix.family }}
          path: out/
          retention-days: 30
  adjudicate:
    needs: vertex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p24-atlas-precommit
          path: pre
      - uses: actions/download-artifact@v4
        with:
          pattern: p24-vertex-*
          path: results
      - name: Adjudicate nested quotient court and response bisimulation
        run: python3 harness/p24_atlas.py adjudicate --precommit pre/p24-core-precommit.json --results results --out p24-adjudication.json
      - name: Independent JavaScript lineage and receipt verification
        run: node tools/p24-verify.mjs pre/p24-core-precommit.json p24-adjudication.json p24-report.md
      - run: cat p24-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: p24-final
          path: |
            p24-adjudication.json
            p24-report.md
          retention-days: 30
