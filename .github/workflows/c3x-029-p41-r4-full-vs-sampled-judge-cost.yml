name: C3X P41 R4 Original 16-World Universal-vs-Sampled Chess Judge Cost
on:
  push:
    paths:
      - '.github/workflows/c3x-029-p41-r4-full-vs-sampled-judge-cost.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-branch-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test accounting and contamination guards
        run: python -m unittest discover -s tools -p 'test_c3x_029_p41_r4_full_vs_sampled_value_cost.py' -v
      - name: Fetch immutable original P39 whole-response ledger
        uses: actions/download-artifact@v4
        with:
          name: c3x-p39-r2-verified-all-replies-mobility-minimax
          repository: WhoSia/C3X
          run-id: '41993256831'
          path: historical
          github-token: ${{ github.token }}
      - name: Measure existing legal branch costs, NO referee execution
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'tools')
          from c3x_029_p41_r4_full_vs_sampled_value_cost import read_source,estimate
          raw=read_source('historical/P39_R2_ADVERSARIAL_OPTION_VALUE_16_WORLDS.json')
          result=estimate(raw,reference_nodes=96000,k_opp=3,k_own=3)
          assert result['observed_legal_opponent_replies']==644
          assert result['observed_legal_own_followups']==24894
          assert result['observed_legal_expansions']==25554
          assert result['sampled_own_followups']<=144
          assert 'NOT_CHESS_VALUE_RESULT' in result['status']
          with open('output/P41_R4_BRANCH_AND_HYPOTHETICAL_NODES.json','w') as f:
              json.dump(result,f,indent=2)
          print('P41_R4_ORIGINAL_BRANCH_COST_RECONCILIATION_PASS_NO_NATIVE_JUDGE')
          PY
      - name: Record original results hashes, never push repository
        run: sha256sum output/*.json > output/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: c3x-p41-r4-original-branch-accounting-not-an-independent-referee
          path: output/
          retention-days: 90
