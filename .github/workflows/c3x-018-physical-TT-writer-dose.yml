name: C3X 0.18 Physical TT Writer Dose 6 8
on:
  push:
    paths:
      - 'tools/c3x_018_physical_epoch_lineage_patch.py'
      - 'harness/c3x_018_native_TT_lineage_factorial_6_8.py'
      - 'harness/c3x_018_TT_writer_dose_6_8.py'
      - '.github/workflows/c3x-018-physical-TT-writer-dose.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preregistered-native-dose:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight code syntax
        run: |
          python -m py_compile tools/c3x_018_physical_epoch_lineage_patch.py
          python -m py_compile harness/c3x_018_native_TT_lineage_factorial_6_8.py
          python -m py_compile harness/c3x_018_TT_writer_dose_6_8.py
      - name: Frozen original P4 output court
        uses: actions/download-artifact@v4
        with:
          name: c3x-016-P4-12-Lichess-root-order-72-native
          path: baseline/
          repository: WhoSia/C3X
          run-id: '37948775813'
          github-token: ${{ github.token }}
      - name: Compile frozen Stockfish16 and dose-enabled observer
        run: |
          set -euo pipefail
          mkdir -p evidence
          git clone -q --single-branch --branch sf_16 https://github.com/official-stockfish/Stockfish.git /tmp/C3X018_DOSE_ENGINE
          test "$(git -C /tmp/C3X018_DOSE_ENGINE rev-parse HEAD)" = 68e1e9b3811e16cad014b590d7443b9063b3eb52
          python tools/c3x_016_P4_independent_12root_source_order_patch.py \
            --source /tmp/C3X018_DOSE_ENGINE --out-manifest evidence/P4_PATCH.json
          python tools/c3x_018_physical_epoch_lineage_patch.py \
            --source /tmp/C3X018_DOSE_ENGINE --out-manifest evidence/EPOCH_DOSE_SOURCE_PATCH.json
          git -C /tmp/C3X018_DOSE_ENGINE diff -- src/search.cpp src/tt.cpp src/tt.h > evidence/DOSE_SOURCE_DIFF.patch
          make -s -C /tmp/C3X018_DOSE_ENGINE/src -j2 build ARCH=x86-64
          cp /tmp/C3X018_DOSE_ENGINE/src/stockfish /tmp/C3X018_DOSE_PATCHED
          sha256sum /tmp/C3X018_DOSE_PATCHED > evidence/DOSE_BINARY_SHA256.txt
      - name: Frozen source nine-dose each #6 and #8 native contrasts
        run: |
          set -euo pipefail
          python -u harness/c3x_018_TT_writer_dose_6_8.py \
            --cohort c3x/cohorts/c3x-016-P4-12-independent-Lichess-legal-root-order-sourceonly-frozen.json \
            --prior baseline/C3X016_P4_12_LICHESS_MULTIMOTIF_ROOT_ORDER_72_NATIVE.json \
            --preseal c3x/receipts/c3x-018-physical-TT-epoch-sticky-vs-single-write-native-falsification-20261010.json \
            --patched /tmp/C3X018_DOSE_PATCHED \
            --out evidence/FOCAL_WRITER_DOSE_6_8.json | tee evidence/DOSE_NATIVE_STDOUT.txt
          python - <<'PY'
          import json
          j=json.load(open('evidence/FOCAL_WRITER_DOSE_6_8.json'))
          assert [x['id'] for x in j['cases']]==[6,8]
          assert j['preregistered_budgets']==[0,1,2,4,8,16,32,64,128]
          for row in j['cases']:
              assert row['decoy_no_contact_exact']
              assert len(row['writer_dose_results'])==9
              assert row['writer_dose_results'][0]['matches_F_core']
              assert row['writer_dose_results'][1]['actual_writer_blocks']==1
          print('C3X018_PREREGISTERED_NINE_DOSE_NATIVE_PASS')
          PY
      - name: SHA256 native evidence
        if: always()
        run: |
          mkdir -p evidence
          find evidence -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > evidence/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-018-physical-TT-writer-dose-6-8
          path: evidence/
          retention-days: 90
          if-no-files-found: error
