name: p34-open-event-causal-cone

on:
  push:
    paths:
      - "c3x/ontology/p34-support-from-p33.json"
      - "c3x/ontology/p34-lawgen-spec.json"
      - "crates/c3x-lawgen/src/bin/lawgen_v10.rs"
      - "crates/c3x-cone/**"
      - "tools/p34_cone_target.inc"
      - "tools/p34_patch_cone.py"
      - "harness/p34_cone_court.py"
      - "harness/p34_explanation_verify.py"
      - "tools/p34-verify.mjs"
      - ".github/workflows/p34.yml"

permissions:
  contents: read
  actions: read

jobs:
  lawgen:
    name: LawGen v10 quotient constitution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static prospective gates
        run: |
          python3 -m py_compile tools/p34_patch_cone.py harness/p34_cone_court.py harness/p34_explanation_verify.py
          node --check tools/p34-verify.mjs
          cargo run --release --manifest-path crates/c3x-lawgen/Cargo.toml --bin lawgen_v10 -- c3x/ontology/p34-lawgen-spec.json c3x/ontology/p34-support-from-p33.json out/lawgen
          sha256sum out/lawgen/* | sort > out/lawgen-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p34-lawgen-preseal
          path: out/
          retention-days: 30

  coner:
    name: Rust independent quotient verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test and build
        run: |
          cargo test --manifest-path crates/c3x-cone/Cargo.toml
          cargo build --release --manifest-path crates/c3x-cone/Cargo.toml
          mkdir -p out
          cp crates/c3x-cone/target/release/c3x-cone out/c3x-cone
          sha256sum out/c3x-cone > out/c3x-cone-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p34-coner
          path: out/
          retention-days: 30
