name: c3x-g10-p22-heldout-qualification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/g10-p22-heldout-qualification.yml'
      - 'tools/g10_p22_router_project.py'
      - 'tools/g10_p22_design_adapter.py'
      - 'tools/g10_p22_pair_gate.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CENSUS_RUN: '37550371354'
  ROUTER_RUN: '37120074387'
  P16_BUILD_RUN: '36544344858'

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: g10-p22-heldout-census
          path: census
          repository: WhoSia/C3X
          run-id: ${{ env.CENSUS_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: g10-p16-router-freeze-sealed
          path: router
          repository: WhoSia/C3X
          run-id: ${{ env.ROUTER_RUN }}
          github-token: ${{ github.token }}
      - run: |
          python3 tools/g10_p22_router_project.py             --census census/g10-p22-heldout-census.json             --router router/g10-p16-router-freeze.json             --out g10-p22-heldout-projected.json
      - uses: actions/upload-artifact@v4
        with:
          name: g10-p22-heldout-projected
          path: g10-p22-heldout-projected.json
          retention-days: 90

  design:
    needs: project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check python-chess==1.999
      - uses: actions/download-artifact@v4
        with:
          name: g10-p22-heldout-projected
          path: state
      - uses: actions/download-artifact@v4
        with:
          pattern: g95-p16-build-*
          path: builds
          repository: WhoSia/C3X
          run-id: ${{ env.P16_BUILD_RUN }}
          github-token: ${{ github.token }}
      - run: |
          python3 tools/g10_p22_design_adapter.py             --projected state/g10-p22-heldout-projected.json             --legacy-p16-constitution c3x/ontology/g95-p16-constitution.json             --build-dir builds --out g10-p22-heldout-design.json
      - uses: actions/upload-artifact@v4
        with:
          name: g10-p22-heldout-design
          path: g10-p22-heldout-design.json
          retention-days: 90

  qualify:
    needs: design
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check python-chess==1.999
      - uses: actions/download-artifact@v4
        with:
          name: g10-p22-heldout-design
          path: state
      - uses: actions/download-artifact@v4
        with:
          pattern: g95-p16-build-*
          path: builds
          repository: WhoSia/C3X
          run-id: ${{ env.P16_BUILD_RUN }}
          github-token: ${{ github.token }}
      - run: |
          mkdir -p out
          PYTHONPATH=. python3 tools/g10_p5_p16_shard.py             --phase qualify --state state/g10-p22-heldout-design.json --build-dir builds             --shard ${{ matrix.shard }} --shards 8 --out-dir out
      - uses: actions/upload-artifact@v4
        with:
          name: g10-p22-heldout-qualify-${{ matrix.shard }}
          path: out/
          retention-days: 90

  pair:
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check python-chess==1.999
      - uses: actions/download-artifact@v4
        with:
          name: g10-p22-heldout-design
          path: state
      - uses: actions/download-artifact@v4
        with:
          pattern: g10-p22-heldout-qualify-*
          path: quals
      - uses: actions/download-artifact@v4
        with:
          name: g10-p22-heldout-projected
          path: corpus
      - run: |
          PYTHONPATH=. python3 harness/g95_p16_court.py pair-freeze             --design state/g10-p22-heldout-design.json --qualifications quals             --out g10-p22-heldout-pair-freeze.json
          python3 tools/g10_p22_pair_gate.py             --corpus corpus/g10-p22-heldout-projected.json             --pair-freeze g10-p22-heldout-pair-freeze.json             --out g10-p22-heldout-pair-gate.json
          sha256sum g10-p22-heldout-pair-freeze.json g10-p22-heldout-pair-gate.json > g10-p22-heldout-pair.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: g10-p22-heldout-pair-sealed
          path: |
            g10-p22-heldout-pair-freeze.json
            g10-p22-heldout-pair-gate.json
            g10-p22-heldout-pair.sha256
          retention-days: 90
