name: C3X 0.18 December Case11 Old Reader Exact Event Gate
on:
  push:
    paths:
      - 'tools/c3x_018_adaptive_writer_age_root_call_V_gate.py'
      - 'harness/c3x_018_case11_actual_old_reader_age_filtered_native.py'
      - '.github/workflows/c3x-018-case11-physical-read-age-disambiguation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  old-reader-versus-earlier-source-collision:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin original game source and native filters source
        run: |
          python -m pip install -q chess==1.11.2
          python -m py_compile tools/c3x_018_adaptive_writer_age_root_call_V_gate.py
          python -m py_compile harness/c3x_018_case11_actual_old_reader_age_filtered_native.py
      - name: Source-only twelve frozen December games
        uses: actions/download-artifact@v4
        with:
          name: c3x-018-december2025-blind12-source
          path: source/
          repository: WhoSia/C3X
          run-id: '37987794988'
          github-token: ${{ github.token }}
      - name: Complete December eight-selector original native results
        uses: actions/download-artifact@v4
        with:
          name: c3x-018-december12-TT-age-bound-ply-root-factors
          path: previous_native/
          repository: WhoSia/C3X
          run-id: '37988014141'
          github-token: ${{ github.token }}
      - name: Verify immutable original source and observed collision results
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(sha256sum source/C3X018_DECEMBER12_INDEPENDENT_GAMES.json | cut -d' ' -f1)" = 51366a480fe2631005dbded7992e870443ef6dd2dfd785fd10952d6eeff5e7cd
          test "$(sha256sum previous_native/DECEMBER12_TT_EIGHT_ROLE_CAUSAL_COURT.json | cut -d' ' -f1)" = 93742e35c09f83a24aeea91f3632227165bb9208c606e3b81766e54d512a9883
      - name: Frozen SF16 physical TT writer age ancestry V exact single source site
        run: |
          set -euo pipefail
          root=/tmp/C3X018_CASE11_AGE_FILTER
          git clone -q --single-branch --branch sf_16 https://github.com/official-stockfish/Stockfish.git "$root"
          test "$(git -C "$root" rev-parse HEAD)" = 68e1e9b3811e16cad014b590d7443b9063b3eb52
          python tools/c3x_016_P4_independent_12root_source_order_patch.py --source "$root" --out-manifest evidence/P4.json
          python tools/c3x_017_early_depth1_root_window_trace_patch.py --source "$root" --out-manifest evidence/ROOT.json
          python tools/c3x_018_trial_call_identity_patch.py --source "$root" --out-manifest evidence/TRIAL.json
          python tools/c3x_018_physical_epoch_lineage_patch.py --source "$root" --out-manifest evidence/EPOCH.json
          python tools/c3x_018_tt_eval_consumption_overlay.py --source "$root" --out-manifest evidence/V.json
          python tools/c3x_018_physical_value_witness_overlay.py --source "$root" --out-manifest evidence/V_WITNESS.json
          python tools/c3x_018_root_TT_genealogy_overlay.py --source "$root" --out-manifest evidence/ANCESTRY.json
          python tools/c3x_018_TT_reader_writer_age_bound_root_feature_overlay.py --source "$root" --out-manifest evidence/FEATURES.json
          python tools/c3x_018_adaptive_writer_age_root_call_V_gate.py --source "$root" --out-manifest evidence/EXACT_FILTER.json
          git -C "$root" diff -- src/ > evidence/SOURCE_DIFF.patch
          make -s -C "$root/src" -j2 build ARCH=x86-64
          sha256sum "$root/src/stockfish" > evidence/BINARY_SHA256.txt
      - name: Source case11 age eighteen first contact versus age ninety targeted later reader
        run: |
          set -euo pipefail
          python -u harness/c3x_018_case11_actual_old_reader_age_filtered_native.py \
            --source source/C3X018_DECEMBER12_INDEPENDENT_GAMES.json \
            --prior previous_native/DECEMBER12_TT_EIGHT_ROLE_CAUSAL_COURT.json \
            --engine /tmp/C3X018_CASE11_AGE_FILTER/src/stockfish \
            --out evidence/CASE11_ACTUAL_OLDER_TT_READER_COUNTERFACTUAL.json | tee evidence/NATIVE_STDOUT.txt
      - name: Source and raw evidence SHA256
        if: always()
        run: |
          mkdir -p evidence
          find evidence -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > evidence/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-018-case11-actual-writer-age-conditional-gate
          path: evidence/
          retention-days: 90
          if-no-files-found: error
