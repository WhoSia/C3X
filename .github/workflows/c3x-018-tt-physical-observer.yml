name: C3X 0.18 Physical TT Observer Source Court
on:
  push:
    paths:
      - 'tools/c3x_018_tt_physical_observer_patch.py'
      - 'tools/test_c3x_018_tt_physical_observer_patch.py'
      - '.github/workflows/c3x-018-tt-physical-observer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-sf16-tt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source-anchor regressions
        run: |
          python -m unittest discover -s tools -p 'test_c3x_018_tt_physical_observer_patch.py' -v
      - name: Compile frozen SF16 source and TT-only observer
        run: |
          set -euo pipefail
          git clone -q --single-branch --branch sf_16 https://github.com/official-stockfish/Stockfish.git /tmp/C3X018_TT_SF16
          test "$(git -C /tmp/C3X018_TT_SF16 rev-parse HEAD)" = 68e1e9b3811e16cad014b590d7443b9063b3eb52
          make -s -C /tmp/C3X018_TT_SF16/src -j2 build ARCH=x86-64
          cp /tmp/C3X018_TT_SF16/src/stockfish /tmp/C3X018_TT_ORIGINAL
          mkdir -p evidence
          python tools/c3x_018_tt_physical_observer_patch.py --source /tmp/C3X018_TT_SF16 --out-manifest evidence/TT_PATCH_MANIFEST.json
          git -C /tmp/C3X018_TT_SF16 diff -- src/tt.cpp > evidence/TT_SOURCE_DIFF.patch
          test -s evidence/TT_SOURCE_DIFF.patch
          make -s -C /tmp/C3X018_TT_SF16/src -j2 build ARCH=x86-64
          cp /tmp/C3X018_TT_SF16/src/stockfish /tmp/C3X018_TT_PATCHED
          sha256sum /tmp/C3X018_TT_ORIGINAL /tmp/C3X018_TT_PATCHED > evidence/BINARY_SHA256.txt
      - name: Single-source TT activation and output equivalence smoke test
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess
          commands=['uci','setoption name Threads value 1','setoption name Hash value 16',
                    'setoption name Use NNUE value false','isready',
                    'position startpos','go depth 5']
          open('evidence/UCI_SMOKE_COMMANDS.txt','w').write('\n'.join(commands)+'\n')
          for name,engine,activate in [('original','/tmp/C3X018_TT_ORIGINAL',False),
                                        ('passive','/tmp/C3X018_TT_PATCHED',False),
                                        ('trace','/tmp/C3X018_TT_PATCHED',True)]:
              env=os.environ.copy()
              if activate: env['C3X018_TT_TRACE']='1'
              else: env.pop('C3X018_TT_TRACE',None)
              proc=subprocess.Popen([engine],stdin=subprocess.PIPE,stdout=subprocess.PIPE,
                                     stderr=subprocess.STDOUT,text=True,env=env,bufsize=1)
              transcript=[]
              for command in commands:
                  proc.stdin.write(command+'\n');proc.stdin.flush()
                  if command=='uci':
                      marker='uciok'
                  elif command=='isready':
                      marker='readyok'
                  elif command=='go depth 5':
                      marker='bestmove '
                  else:
                      continue
                  while True:
                      line=proc.stdout.readline()
                      if not line: raise RuntimeError((name,marker,'PREMATURE_EOF'))
                      transcript.append(line)
                      if line.startswith(marker): break
              proc.stdin.write('quit\n');proc.stdin.flush()
              assert proc.wait(timeout=20)==0,name
              open('evidence/'+name+'_UCI_OUTPUT.txt','w').writelines(transcript)
          assert 'c3x018_tt kind=' not in open('evidence/passive_UCI_OUTPUT.txt').read()
          assert 'c3x018_tt kind=' in open('evidence/trace_UCI_OUTPUT.txt').read()
          import re
          def core(name):
              lines=open('evidence/'+name+'_UCI_OUTPUT.txt').read().splitlines()
              end=[x for x in lines if x.startswith('bestmove ')]
              info=[x for x in lines if x.startswith('info depth 5 ') and ' pv ' in x]
              assert len(end)==1 and info,(name,'NO_FINAL_CORE')
              t=info[-1]
              score=re.search(r'\bscore (cp|mate) (-?\d+)(?: (lowerbound|upperbound))?',t)
              nodes=re.search(r'\bnodes (\d+)',t)
              assert score and nodes,(name,'SCORE_OR_NODES_MISSING')
              return (end[0].split()[1],score.groups(),int(nodes.group(1)),t.split(' pv ',1)[1])
          assert core('original')==core('passive')==core('trace'), 'TT_OBSERVER_NONINTERFERENCE_FAIL'
          print('C3X018_TT_UCI_CORE_NONINTERFERENCE_PASS')
          print('C3X018_TT_TELEMETRY_ACTIVATION_SMOKE_PASS')
          PY
      - name: SHA evidence
        if: always()
        run: |
          mkdir -p evidence
          find evidence -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > evidence/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-018-tt-physical-source-observer
          path: evidence/
          retention-days: 90
          if-no-files-found: error
