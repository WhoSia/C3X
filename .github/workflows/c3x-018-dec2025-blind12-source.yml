name: C3X 0.18 December Blind Independent Twelve
on:
  push:
    paths:
      - 'harness/c3x_018_blind_2025dec_broadcast_PGN_cohort.py'
      - '.github/workflows/c3x-018-dec2025-blind12-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blind-source-not-an-engine-court:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Chess game PGN source parser only
        run: |
          python -m pip install -q chess==1.11.2 zstandard==0.25.0
          python -m py_compile harness/c3x_018_blind_2025dec_broadcast_PGN_cohort.py
      - name: Existing October engine-free source archive
        uses: actions/download-artifact@v4
        with:
          name: c3x-018-independent-PGN-blind-source-16
          path: october/
          repository: WhoSia/C3X
          run-id: '37981820261'
          github-token: ${{ github.token }}
      - name: Existing November engine-free source archive
        uses: actions/download-artifact@v4
        with:
          name: c3x-018-november-blind12-chess-source
          path: november/
          repository: WhoSia/C3X
          run-id: '37985213908'
          github-token: ${{ github.token }}
      - name: Verify both older cohorts before sampling
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(sha256sum october/C3X018_INDEPENDENT_BLIND16_PGN_SOURCE.json | cut -d' ' -f1)" = 6520672aabab7f525872169085f19bdd81e27a4473f0c58ba9c9aa428937104c
          test "$(sha256sum november/C3X018_NOVEMBER_12_BLIND_GAMES.json | cut -d' ' -f1)" = 2971fe617f39fbba6d40fb0b09d8a18ce247d5865dc807fcdab9a594e3473402
      - name: Download December 2025 broadcast PGN only
        run: |
          set -euo pipefail
          mkdir -p /tmp/C3X018_BLIND_DEC
          curl -fL --retry 3 --max-time 200 -sS https://database.lichess.org/broadcast/lichess_db_broadcast_2025-12.pgn.zst \
            -o /tmp/C3X018_BLIND_DEC/games.pgn.zst
          test -s /tmp/C3X018_BLIND_DEC/games.pgn.zst
          sha256sum /tmp/C3X018_BLIND_DEC/games.pgn.zst > evidence/ORIGINAL_COMPRESSED_SOURCE_SHA256.txt
      - name: Create twelve new chess games and full historical move lists before engine outcomes
        run: |
          set -euo pipefail
          python -u harness/c3x_018_blind_2025dec_broadcast_PGN_cohort.py \
            --zst /tmp/C3X018_BLIND_DEC/games.pgn.zst \
            --prior c3x/cohorts/c3x-016-P4-12-independent-Lichess-legal-root-order-sourceonly-frozen.json \
            --october october/C3X018_INDEPENDENT_BLIND16_PGN_SOURCE.json \
            --november november/C3X018_NOVEMBER_12_BLIND_GAMES.json \
            --out evidence/C3X018_DECEMBER12_INDEPENDENT_GAMES.json | tee evidence/SOURCE_STDOUT.txt
          python - <<'PY'
          import json
          x=json.load(open("evidence/C3X018_DECEMBER12_INDEPENDENT_GAMES.json"))
          assert len(x["selected"])==12 and x["eligible_games"]==512
          assert x["previous_12_and_october16_and_november12_FEN_overlap"]==0
          assert len({r["source_game_sha256"] for r in x["selected"]})==12
          assert all(r["full_original_mainline_uci"] for r in x["selected"])
          print("C3X018_DECEMBER_HOLDOUT_SOURCE_ONLY_FREEZE_PASS")
          PY
      - name: Hash untouched source evidence
        if: always()
        run: |
          mkdir -p evidence
          find evidence -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > evidence/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-018-december2025-blind12-source
          path: evidence/
          retention-days: 90
          if-no-files-found: error
