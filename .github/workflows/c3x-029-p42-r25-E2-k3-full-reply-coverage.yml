name: C3X P42-R25-E2 engine-ranked top3 versus all-147 frozen judge coverage (no engine)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c3x-029-p42-r25-E2-k3-full-reply-coverage.yml'
      - 'harness/c3x_029_p42_r25_e2_k3_full_reply_coverage.py'
      - 'harness/test_c3x_029_p42_r25_e2_k3_full_reply_coverage.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-retrospective-ranked-k3-with-immutable-all-replies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Standard-library tests, no pip install
        run: |
          set -euo pipefail
          python -m py_compile harness/c3x_029_p42_r25_e2_k3_full_reply_coverage.py
          PYTHONPATH=harness python -m unittest -v test_c3x_029_p42_r25_e2_k3_full_reply_coverage
      - uses: actions/download-artifact@v4
        with:
          name: c3x042-r25-E1-real-source-ranked-first-layer-k3
          repository: WhoSia/C3X
          run-id: '42569966329'
          path: e1/
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: c3x042-p42-r24-B2-judged-all-reply-conditioned-plans-aggregate-only
          repository: WhoSia/C3X
          run-id: '42565712361'
          path: b2/
          github-token: ${{ github.token }}
      - name: SHA-gated existing Berserk judgments and genuinely pre-judge top3
        run: |
          set -euo pipefail
          echo '2fd30e135a1d4f4575b71cd263f01fdd363659fe3f05b6cafc653dc98646e365  b2/C3X042_R24_B_JUDGED_REPLY_CONDITIONED_OWN_PLAN.json' | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('e1/C3X042_R25_E1_SOURCE_RANKED_FIRST_LAYER_K3.json').read_text())
          assert p['schema']=='c3x042-r25-e1-source-ranked-first-layer-k3-v1'
          assert p['independent_referee_consulted_for_ranking'] is False
          assert p['source_commit']=='68e1e9b3811e16cad014b590d7443b9063b3eb52'
          print('E1_SOURCE_ONLY_PREJUDGE_RANKS_PRESENT')
          PY
      - name: Compare k3 restricted worst response against all 147 WITHOUT rerunning chess
        run: |
          set -euo pipefail
          mkdir -p public
          PYTHONPATH=harness python -u harness/c3x_029_p42_r25_e2_k3_full_reply_coverage.py \
            --e1 e1/C3X042_R25_E1_SOURCE_RANKED_FIRST_LAYER_K3.json \
            --b2 b2/C3X042_R24_B_JUDGED_REPLY_CONDITIONED_OWN_PLAN.json \
            --out public/C3X042_R25_E2_RANKED_K3_VS_FULL_147_COVERAGE.json
          sha256sum public/C3X042_R25_E2_RANKED_K3_VS_FULL_147_COVERAGE.json
          python - <<'PY'
          import json
          p=json.load(open('public/C3X042_R25_E2_RANKED_K3_VS_FULL_147_COVERAGE.json'))
          for c in p['cases']:
              for r in c['roots']:
                  print('R25_E2_CASE',c['event_family'],r['root_uci'],
                        'legal',r['legal_reply_count'],'top3',r['ranked_k3_reply_uci'])
                  for d in ('12','16'):
                      for mode in ('unrestricted','frozen_policy'):
                          v=r['estimates'][d][mode]
                          print('R25_E2_SCORE',d,mode,'full',v['full_reply_worst_cp'],
                                'k3',v['source_ranked_k3_worst_cp'],
                                'optimism',v['k3_optimism_cp'])
          PY
      - name: Rights and epistemic ceiling
        if: always()
        run: |
          set -euo pipefail
          if test -f public/C3X042_R25_E2_RANKED_K3_VS_FULL_147_COVERAGE.json; then
            python tools/c3x_023_rights_preupload_gate.py \
              --tier P2_AGGREGATE_SUMMARY \
              --file public/C3X042_R25_E2_RANKED_K3_VS_FULL_147_COVERAGE.json \
              --report /tmp/R25_E2_PRIVATE_RIGHTS.json
          fi
          echo 'R25-E2 retrospective first-layer only, no full Cui tree, no new Berserk judging, no novel cohort, no objective optimality, no causal action explanation. Source original broadcast CC BY-SA 4.0.' > public/SOURCE_LICENSE_NOTICE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x042-r25-E2-engine-ranked-k3-versus-all-replies-retrospective
          path: |
            public/C3X042_R25_E2_RANKED_K3_VS_FULL_147_COVERAGE.json
            public/SOURCE_LICENSE_NOTICE.txt
          if-no-files-found: warn
