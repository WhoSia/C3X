name: C3X 0.31 P2 Genuine Native Source Interventions — Frozen Transport Court

on:
  pull_request:
    paths:
      - ".github/workflows/c3x-031-p2-treatment.yml"
      - "harness/c3x_031_p2_treatment.py"
      - "frozen/C3X_031_P2_SOURCE_TARGETS_BEFORE_TREATMENT_20261121.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-source-contrasts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin chess parser, no untrusted model retrieval
        run: python -m pip install -q chess==1.11.2
      - name: Retrieve untampered original full-game 64-position sample
        uses: actions/download-artifact@v4
        with:
          name: c3x031-p2-64game-private-history-freeze
          repository: WhoSia/C3X
          run-id: "44872034069"
          path: /tmp/p2-source
          github-token: ${{ github.token }}
      - name: Retrieve before-treatment 128 target source identities and model predictions
        uses: actions/download-artifact@v4
        with:
          name: c3x031-p2-private-untreated-contact-prediction-seal
          repository: WhoSia/C3X
          run-id: "44872579316"
          path: /tmp/p2-discovery
          github-token: ${{ github.token }}
      - name: Retrieve previously compiled exact source-gate Stockfish 16 and NNUE
        uses: actions/download-artifact@v4
        with:
          name: c3x031-p2-pinned-SF16-native-source-build-no-treatments
          repository: WhoSia/C3X
          run-id: "44872473600"
          path: /tmp/p2-build
          github-token: ${{ github.token }}
      - name: All original bytes and preintervention science claims must match
        run: |
          set -euo pipefail
          echo '2a174dcf56a333408693785eb0a844a419f7f8ba090c0a00187f3dab483d57e4  /tmp/p2-source/C3X_031_P2_TWIC1670_GAME_FREEZE_FULL_HISTORIES.json' | sha256sum -c -
          echo '17915c7d9ae56dd950cd026d07a4917a414213415ea3b28af256b305eb8ad146  /tmp/p2-discovery/C3X_031_P2_PHYSICAL_EVENT_AND_FORECAST_PRETREATMENT.json' | sha256sum -c -
          echo 'f27a89fd15efa3f35738ba8cf2a6d1243c8336268e4661c653bbd1e6c0bfee23  frozen/C3X_031_P2_FINAL_MODELS_PREOUTCOME_20261121.json' | sha256sum -c -
          echo 'ce13b5899ab6862a621ee6033ac661f7ded0abf3f2b4ea073a163b0c3154afa1  /tmp/p2-build/c3x031-p2-SF16-patched' | sha256sum -c -
          echo '5af11540bbfefcb54e38c5dd000cab4b469dfa7599a1d55be5d2722c20a8929b  /tmp/p2-build/nn-5af11540bbfe.nnue' | sha256sum -c -
          chmod +x /tmp/p2-build/c3x031-p2-SF16-patched
          python - <<'PY'
          import json
          p='frozen/C3X_031_P2_SOURCE_TARGETS_BEFORE_TREATMENT_20261121.json'
          j=json.load(open(p))
          assert j['actual_native_treatment_searches']==0
          assert j['exact_treated_outcome_labels_known'] is False
          assert j['exact_pre_treatment_private_json_sha256']=='17915c7d9ae56dd950cd026d07a4917a414213415ea3b28af256b305eb8ad146'
          assert j['frozen_physically_contacted_null_ineligible_targets']==64
          assert j['frozen_physically_contacted_null_eligible_targets']==64
          PY
      - name: Execute all physically contacted source-event contrasts, two cold repeats and sham
        env:
          PYTHONPATH: harness
        run: |
          set -euo pipefail
          mkdir -p private public /tmp/p2-treatment/logs
          python -u harness/c3x_031_p2_treatment.py \
            /tmp/p2-source/C3X_031_P2_TWIC1670_GAME_FREEZE_FULL_HISTORIES.json \
            /tmp/p2-discovery/C3X_031_P2_PHYSICAL_EVENT_AND_FORECAST_PRETREATMENT.json \
            /tmp/p2-build/c3x031-p2-SF16-patched \
            /tmp/p2-build/nn-5af11540bbfe.nnue \
            frozen/C3X_031_P2_FINAL_MODELS_PREOUTCOME_20261121.json \
            frozen/C3X_031_P1_R33_128_PRETREATMENT_ROWS_20261121.tsv \
            /tmp/p2-treatment/logs \
            private/C3X_031_P2_TWIC1670_TREATED_NATIVE_ALL_EVENTS.json \
            public/C3X_031_P2_TWIC1670_PROSPECTIVE_PREDICTION_COURT.json \
            --expected-discovery-sha256 17915c7d9ae56dd950cd026d07a4917a414213415ea3b28af256b305eb8ad146
          sha256sum private/*.json public/*.json
          python - <<'PY'
          import json
          j=json.load(open('public/C3X_031_P2_TWIC1670_PROSPECTIVE_PREDICTION_COURT.json'))
          assert j['source_game_count']==64
          assert j['potential_source_event_slots']==128
          assert j['true_mechanistic_intermediate_mediator_identified'] is False
          assert j['human_learning_measured'] is False
          assert j['observed_effect_denominator']+sum(
            n for k,n in j['physical_target_statuses'].items()
            if k!='ACTUAL_SOURCE_TREATMENT_OBSERVED')==128
          PY
      - name: Upload all actual source-contrast receipts, not a Git commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3x031-p2-native-treatment-private-all-events
          path: private/
          if-no-files-found: warn
      - name: Preserve original touched native UCI and stderr logs for auditing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3x031-p2-native-treatment-private-full-logs
          path: /tmp/p2-treatment/logs/
          if-no-files-found: warn
      - name: Preserve public count-complete negative or positive verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3x031-p2-native-treatment-public-court
          path: public/
          if-no-files-found: warn
