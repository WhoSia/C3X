name: C3X 0.18 W2 plus V TT Writer Reader Interaction
on:
  push:
    paths:
      - 'tools/c3x_018_writer_eval_override_interaction_overlay.py'
      - 'harness/c3x_018_W2_V_joint_physical_source_native.py'
      - '.github/workflows/c3x-018-W2-V-nested-interaction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nested-TT-writer-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict source preflight
        run: |
          python -m py_compile tools/c3x_018_writer_eval_override_interaction_overlay.py
          python -m py_compile harness/c3x_018_W2_V_joint_physical_source_native.py
      - name: Original P4 native UCI tuple
        uses: actions/download-artifact@v4
        with:
          name: c3x-016-P4-12-Lichess-root-order-72-native
          path: baseline/
          repository: WhoSia/C3X
          run-id: '37948775813'
          github-token: ${{ github.token }}
      - name: Compile pinned SF16 physical TT writer and V reader intervention
        run: |
          set -euo pipefail
          mkdir -p evidence
          root=/tmp/C3X018_WV_NESTED
          git clone -q --single-branch --branch sf_16 https://github.com/official-stockfish/Stockfish.git "$root"
          test "$(git -C "$root" rev-parse HEAD)" = 68e1e9b3811e16cad014b590d7443b9063b3eb52
          python tools/c3x_016_P4_independent_12root_source_order_patch.py --source "$root" --out-manifest evidence/P4.json
          python tools/c3x_018_physical_epoch_lineage_patch.py --source "$root" --out-manifest evidence/TT_EPOCH.json
          python tools/c3x_018_tt_eval_consumption_overlay.py --source "$root" --out-manifest evidence/V_GATE.json
          python tools/c3x_018_writer_eval_override_interaction_overlay.py --source "$root" --out-manifest evidence/WV_GATE.json
          git -C "$root" diff -- src/search.cpp src/tt.cpp src/tt.h > evidence/SOURCE_DIFF.patch
          make -s -C "$root/src" -j2 build ARCH=x86-64
          sha256sum "$root/src/stockfish" > evidence/BINARY_SHA256.txt
      - name: Native W2 V WV exact-sham factorial case2 and case5
        run: |
          set -euo pipefail
          python -u harness/c3x_018_W2_V_joint_physical_source_native.py \
            --cohort c3x/cohorts/c3x-016-P4-12-independent-Lichess-legal-root-order-sourceonly-frozen.json \
            --prior baseline/C3X016_P4_12_LICHESS_MULTIMOTIF_ROOT_ORDER_72_NATIVE.json \
            --engine /tmp/C3X018_WV_NESTED/src/stockfish \
            --out evidence/W2_V_WV_NESTED_SOURCE_2_5.json | tee evidence/NATIVE_STDOUT.txt
          python - <<'PY'
          import json
          j=json.load(open('evidence/W2_V_WV_NESTED_SOURCE_2_5.json'))
          assert [c["id"] for c in j["cases"]]==[2,5]
          assert all(c["joint_decoy_no_contact_exact"] for c in j["cases"])
          print("C3X018_W2_V_WV_NESTED_SOURCE_PASS")
          PY
      - name: All files SHA256
        if: always()
        run: |
          mkdir -p evidence
          find evidence -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > evidence/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-018-W2-V-nested-physical-TT
          path: evidence/
          retention-days: 90
          if-no-files-found: error
