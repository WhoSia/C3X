name: C3X P40 R3 Complete Shared-UCI Chess Reply Context Audit
on:
  push:
    paths:
      - '.github/workflows/c3x-029-p40-r3-reply-context.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  context-replay-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve original independently checked P39 legal branch archive
        uses: actions/download-artifact@v4
        with:
          name: c3x-p39-r2-verified-all-replies-mobility-minimax
          repository: WhoSia/C3X
          run-id: '41993256831'
          path: source
          github-token: ${{ github.token }}
      - name: Test original chess branch context and deliberate corruptions
        env:
          C3X_P40_R3_SOURCE: source/P39_R2_ADVERSARIAL_OPTION_VALUE_16_WORLDS.json
        run: |
          set -euo pipefail
          python -m unittest discover -s tools -p 'test_c3x_029_p40_r3_reply_context_audit.py' -v
      - name: Produce full eight-event original-context ledger
        run: |
          set -euo pipefail
          mkdir -p output
          python tools/c3x_029_p40_r3_reply_context_audit.py \
            --source source/P39_R2_ADVERSARIAL_OPTION_VALUE_16_WORLDS.json \
            --out output/P40_R3_EIGHT_EVENT_FULL_CONTEXT_AUDIT.json
          python - <<'PY'
          import json
          d=json.load(open('output/P40_R3_EIGHT_EVENT_FULL_CONTEXT_AUDIT.json'))
          assert (d['events'],d['worlds'],d['reply_occurrences'],
                  d['identical_uci_pairs'],d['different_proxy_pairs'])==(8,16,644,313,233)
          print('P40_R3_SOURCE_REPLAY_PASS_CONTEXT_DIFFERENCE_NOT_CHESS_VALUE')
          PY
      - name: Archive hashes, never modify repository
        if: always()
        run: |
          mkdir -p output
          find output -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > output/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-p40-r3-shared-uci-context-dependence-original-ledger
          path: output/
          retention-days: 90
          if-no-files-found: error
