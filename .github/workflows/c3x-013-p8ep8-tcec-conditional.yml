name: C3X 0.13 P8-EP8 Frozen TCEC Conditional Engine Observation
on:
  push:
    paths:
      - '.github/workflows/c3x-013-p8ep8-tcec-conditional.yml'
      - 'harness/c3x_013_p8ep8_tcec_conditional_uci.py'\n      - 'harness/test_c3x_013_p8ep8.py'
      - 'c3x_explain/p8_ep8.py'
      - 'c3x_explain/test_p8_ep8.py'
      - 'c3x_explain/core.py'
      - 'c3x_explain/__main__.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tcec-two-engine-conditional-replies:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install chess library and Stockfish
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq stockfish git build-essential
          python -m pip install --disable-pip-version-check chess==1.11.2
      - name: Build historical Ethereal classical implementation
        run: |
          mkdir -p output
          git clone -q https://github.com/AndyGrant/Ethereal.git /tmp/c3x-ep8-ethereal
          git -C /tmp/c3x-ep8-ethereal checkout -q 0e47e9b67f345c75eb965d9fb3e2493b6a11d09a
          test "$(git -C /tmp/c3x-ep8-ethereal rev-parse HEAD)" = 0e47e9b67f345c75eb965d9fb3e2493b6a11d09a
          make -s -C /tmp/c3x-ep8-ethereal/src basic CC=gcc
          cp /tmp/c3x-ep8-ethereal/LICENSE output/Ethereal_GPLv3.txt
      - name: Verify legal exact-FEN confluence before scoring
        env:
          PYTHONPATH: .
        run: |
          python -m unittest harness.test_c3x_013_p8ep8 -v
          python -m unittest c3x_explain.test_p8_ep8 -v\n          python - <<'PY'
          from harness.c3x_013_p8ep8_tcec_conditional_uci import worlds
          w=worlds()
          assert len(w)==2
          print('EP8_LEGAL_CONFLUENCE_VERIFIED')
          PY
      - name: Run genuine frozen UCI two-engine depth panel
        run: |
          python harness/c3x_013_p8ep8_tcec_conditional_uci.py --stockfish /usr/games/stockfish --ethereal /tmp/c3x-ep8-ethereal/src/Ethereal --output output/ep8_tcec_conditional.json
          python - <<'PY'
          import json
          r=json.load(open('output/ep8_tcec_conditional.json'))
          assert r['source_events']==1
          assert r['status']=='DEVELOPMENTAL_REAL_ENGINE_COMPARISON_NOT_CAUSAL'\n          assert len(r['condition_names'])==3\n          assert 'go searchmoves' in r['forced_UCI_semantics']
          assert len(r['engines'])==2
          for x in r['engines'].values():
              assert sorted(x['depths'])==['12','16','8']
              for d in x['depths'].values():
                  assert len(d['trials'])==2
                  assert all(set(t['branches'])=={'a','b'} for t in d['trials'])\n                  assert all(set(t['branches'][k]) >= {'free_opponent_reply','forced_convergence_reply_via_go_searchmoves','cold_equal_FEN_after_capture_depth_minus_one'} for t in d['trials'] for k in ('a','b'))\n                  assert all(t['branches'][k]['forced_convergence_reply_via_go_searchmoves']['root_reply_constrained'] for t in d['trials'] for k in ('a','b'))
          print('EP8_NO_CAUSAL_PROMOTION')
          PY
      - name: Preserve provenance and source hashes
        if: always()
        run: |
          mkdir -p output
          cp harness/c3x_013_p8ep8_tcec_conditional_uci.py output/EP8_source.py
          printf '%s\n' 'Ethereal commit 0e47e9b67f345c75eb965d9fb3e2493b6a11d09a; Stockfish from runner apt. Source PGN: TCEC S30 Playoff Cat 2 through Lichess broadcasts CC BY-SA 4.0. No concept causality claimed.' > output/provenance.txt
          printf 'uci\\nquit\\n' | /usr/games/stockfish | head -12 > output/Stockfish_UCI_identity.txt\n          printf 'uci\\nquit\\n' | /tmp/c3x-ep8-ethereal/src/Ethereal | head -12 > output/Ethereal_UCI_identity.txt\n          sha256sum output/* > output/member_sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-013-p8ep8-tcec-conditional-two-engine
          path: output/
          if-no-files-found: error
          retention-days: 90
