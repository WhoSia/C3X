name: c3x-g10-p18-engine-tensor

on:
  push:
    branches: [main]
    paths:
      - 'c3x/ontology/g10-p18-constitution.json'
      - 'tools/g10_p18_engine_tensor.py'
      - '.github/workflows/g10-p18-engine-tensor.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  P16_PAIR_GATE_RUN: "37122446885"
  P16_HELDOUT_RUN: "37120231398"
  P16_VALIDATION_RUN: "37122544550"

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check python-chess==1.999
      - uses: actions/download-artifact@v4
        with:
          name: g10-p16-pair-freeze-sealed
          path: pair
          repository: WhoSia/C3X
          run-id: ${{ env.P16_PAIR_GATE_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: g10-p16-heldout-corpus-sealed
          path: corpus
          repository: WhoSia/C3X
          run-id: ${{ env.P16_HELDOUT_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: g10-p16-router-worlds-*
          path: worlds
          repository: WhoSia/C3X
          run-id: ${{ env.P16_VALIDATION_RUN }}
          github-token: ${{ github.token }}
      - name: Reconstruct engine-resolved tensor
        run: |
          python3 tools/g10_p18_engine_tensor.py             --pair-freeze pair/g10-p16-pair-freeze.json             --corpus corpus/g10-p16-heldout-corpus.json             --worlds worlds             --tensor-out g10-p18-engine-tensor.json             --out g10-p18-engine-analysis.json
          python3 - <<'PY'
          import json
          r=json.load(open("g10-p18-engine-analysis.json"))
          assert r["black_box_models_used"] is False
          assert r["fresh_confirmation_opened"] is False
          print("G10_P18_VERIFIED",r["verdict"])
          print("ROWS",r["unique_chain_rows"],"CELLS",r["engine_tensor_cells"])
          print("SUPPORT",r["tensor_summary"]["support_count_distribution"])
          print("INTERSECTION",r["tensor_summary"]["support_intersection_failures"])
          print("UNIVERSAL_FAIL",r["tensor_summary"]["universal_failures"])
          print("UNIVERSAL_SURVIVE",r["tensor_summary"]["universal_survivals"])
          print("SOURCE_ENGINE",r["tensor_summary"]["source_engine"])
          print("PAIRWISE",r["tensor_summary"]["pairwise"])
          print("RULES",r["transparent_rule_search"]["by_engine"])
          print("COMMON_SUFF",r["transparent_rule_search"]["common_sufficient_rules"])
          print("COMMON_NEC",r["transparent_rule_search"]["common_necessary_rules"])
          PY
          sha256sum g10-p18-engine-tensor.json g10-p18-engine-analysis.json > g10-p18-engine-tensor.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: g10-p18-engine-tensor-sealed
          path: |
            g10-p18-engine-tensor.json
            g10-p18-engine-analysis.json
            g10-p18-engine-tensor.sha256
          retention-days: 90
