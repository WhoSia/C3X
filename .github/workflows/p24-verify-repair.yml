name: p24-independent-verifier-repair
on:
  push:
    paths:
      - ".github/workflows/p24-verify-repair.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  SOURCE_RUN: 36138373702
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p24-atlas-precommit
          path: pre
          repository: WhoSia/C3X
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: p24-vertex-*
          path: results
          repository: WhoSia/C3X
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
      - name: Deterministically rematerialize adjudication from sealed results
        run: python3 harness/p24_atlas.py adjudicate --precommit pre/p24-core-precommit.json --results results --out p24-adjudication.json
      - name: Independent JavaScript semantic branch verification
        run: node tools/p24-verify.mjs pre/p24-core-precommit.json p24-adjudication.json p24-report.md
      - run: cat p24-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: p24-final
          path: |
            p24-adjudication.json
            p24-report.md
          retention-days: 30
