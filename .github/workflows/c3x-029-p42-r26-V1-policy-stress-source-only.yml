name: C3X P42-R26-V1 source-only frozen-policy stress-rank top3 (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c3x-029-p42-r26-V1-policy-stress-source-only.yml'
      - 'harness/c3x_029_p42_r26_v1_policy_stress_source_rank.py'
      - 'harness/test_c3x_029_p42_r26_v1_policy_stress_source_rank.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-policy-vulnerability-prejudge:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '.github/workflows/c3x-029-p42-r26-V1-policy-stress-source-only.yml'
      - name: Pinned chess client and source-only contracts
        run: |
          set -euo pipefail
          python -m pip install -q chess==1.11.2
          python -m py_compile harness/c3x_029_p42_r26_v1_policy_stress_source_rank.py
          PYTHONPATH=harness python -m unittest -v test_c3x_029_p42_r26_v1_policy_stress_source_rank
      - uses: actions/download-artifact@v4
        with:
          name: c3x-p37-r1-oct-eight-distinct-events-original-pgn-and-engine-blind-freeze
          repository: WhoSia/C3X
          run-id: '41968008046'
          path: source/
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: c3x-p37-r2-pre-referee-eight-event-three-rival-predictions
          repository: WhoSia/C3X
          run-id: '41969173637'
          path: forecasts/
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: c3x042-r24-B-prejudge-sf16-reply-conditioned-own-plan-147
          repository: WhoSia/C3X
          run-id: '42565383643'
          path: pre-judge-source-plan/
          github-token: ${{ github.token }}
      - name: Verify earlier immutable source and policy bytes
        run: |
          set -euo pipefail
          echo '77ebaa409e7c2099cc6cce3419c2f55ded295d925ab441dc2d13c16b67c2c361  source/P37_R1_8_EVENT_8_GAME_SOURCE_ONLY_MANIFEST.json' | sha256sum -c -
          echo 'da395f0eb16e7b294af2056dadd92b579770aa8f1ae288d1d358132685807051  forecasts/P37_R2_THREE_RIVAL_PRE_REFERENCE_PREDICTIONS.json' | sha256sum -c -
          echo '3c8f2a57cefe19fcb7a00925f4434f5008195bce5adeba1e67dc84f18f084f34  pre-judge-source-plan/C3X042_R24_B_PREJUDGE_147_REPLY_CONDITIONED_OWN_CHOICES.json' | sha256sum -c -
      - name: Pinned original Stockfish16 classic build (no Berserk or judge)
        run: |
          set -euo pipefail
          git clone -q https://github.com/official-stockfish/Stockfish.git /tmp/c3x042-r26-sf16
          git -C /tmp/c3x042-r26-sf16 checkout -q 68e1e9b3811e16cad014b590d7443b9063b3eb52
          test "$(git -C /tmp/c3x042-r26-sf16 rev-parse HEAD)" = '68e1e9b3811e16cad014b590d7443b9063b3eb52'
          make -s -C /tmp/c3x042-r26-sf16/src -j2 build ARCH=x86-64
      - name: Freeze all 147 source-policy stress scores and twelve ranked reply choices
        run: |
          set -euo pipefail
          mkdir -p public
          PYTHONPATH=harness python -u harness/c3x_029_p42_r26_v1_policy_stress_source_rank.py \
            --source source \
            --predictions forecasts \
            --frozen-plan pre-judge-source-plan/C3X042_R24_B_PREJUDGE_147_REPLY_CONDITIONED_OWN_CHOICES.json \
            --engine /tmp/c3x042-r26-sf16/src/stockfish \
            --out public/C3X042_R26_V1_SOURCE_POLICY_STRESS_TOP3.json
          sha256sum public/C3X042_R26_V1_SOURCE_POLICY_STRESS_TOP3.json
      - name: Public source rights and no-promotion caveat
        if: always()
        run: |
          set -euo pipefail
          if test -f public/C3X042_R26_V1_SOURCE_POLICY_STRESS_TOP3.json; then
            python tools/c3x_023_rights_preupload_gate.py \
              --tier P2_AGGREGATE_SUMMARY \
              --file public/C3X042_R26_V1_SOURCE_POLICY_STRESS_TOP3.json \
              --report /tmp/R26_SOURCE_RIGHTS_PRIVATE.json
          fi
          echo 'R26 exploratory, historical exposed postselected cases; source-family SF16 policy-conditioned 1-step proxy with 147 new calls, NOT blind independent validation, not full Cui or causal root explanation. Source original Lichess CC BY-SA 4.0.' > public/SOURCE_LICENSE_NOTICE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x042-r26-V1-source-only-policy-stress-all147-top3
          path: |
            public/C3X042_R26_V1_SOURCE_POLICY_STRESS_TOP3.json
            public/SOURCE_LICENSE_NOTICE.txt
          if-no-files-found: warn
