name: C3X 0.21 P1 Blind March16 Atomic Decision Graph Source Freeze
on:
  push:
    paths:
      - '.github/workflows/c3x-021-P1-atomic-chess-source-freeze.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-atomic-affordances:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Primitive chess legal-action and attack-edge tests without engine
        run: |
          python -m pip install -q chess==1.11.2
          python -m py_compile harness/c3x_021_P1_atomic_decision_transition_graph.py
          python -m unittest discover -s tools -p 'test_c3x_021_P1_atomic_decision_transition_graph.py' -v
      - name: Fetch exact frozen March16 source positions
        uses: actions/download-artifact@v4
        with:
          name: c3x-020-C2-march2026-enginefree-blind16-source
          path: march/
          repository: WhoSia/C3X
          run-id: '38038059013'
          github-token: ${{ github.token }}
      - name: Fetch previously frozen named-motif source geometry for contrast
        uses: actions/download-artifact@v4
        with:
          name: c3x-021-march16-sourceonly-chess-microstructure
          path: p0/
          repository: WhoSia/C3X
          run-id: '38038801299'
          github-token: ${{ github.token }}
      - name: Verify source identities and freeze all legal move event deltas
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(sha256sum march/C3X020_C2_MARCH_BLIND16_SOURCE.json | cut -d' ' -f1)" = d79e48633be2b683176f1a6d4650aeea1b7584f11c85c2349a5bddda113febee
          test "$(sha256sum p0/C3X021_MARCH16_SOURCEONLY_CHESS_MICROSTRUCTURES.json | cut -d' ' -f1)" = 99afa9aec2bb53d29ca45e4aafb9f57b411dae77b5ddfbc0372a79ee1c127d81
          python -u harness/c3x_021_P1_atomic_decision_transition_graph.py \
            --march march/C3X020_C2_MARCH_BLIND16_SOURCE.json \
            --p0 p0/C3X021_MARCH16_SOURCEONLY_CHESS_MICROSTRUCTURES.json \
            --out evidence/C3X021_P1_ATOMIC_CHESS_TRANSITIONS_MARCH16.json | tee evidence/SOURCE_STDOUT.txt
          python - <<'PY'
          import json
          d=json.load(open('evidence/C3X021_P1_ATOMIC_CHESS_TRANSITIONS_MARCH16.json'))
          assert len(d['positions'])==16
          assert all(len(r['profile']['moves'])==r['profile']['legal_root_move_count'] for r in d['positions'])
          print('C3X021_P1_ATOMIC_ALL_LEGAL_CHESS_MOVES_FROZEN')
          PY
      - name: Immutable hashes and controls even on technical failure
        if: always()
        run: |
          mkdir -p evidence
          find evidence -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > evidence/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-021-P1-all-legal-atomic-march16-source
          path: evidence/
          retention-days: 90
          if-no-files-found: error
