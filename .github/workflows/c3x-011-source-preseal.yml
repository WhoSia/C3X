name: C3X 0.11 Source Preseal Engineering
on:
  push:
    paths:
      - 'tools/c3x_011_*.py'
      - 'tools/test_c3x_011_*.py'
      - 'tools/g10_p19_source_census.py'
      - '.github/workflows/c3x-011-source-preseal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned chess parser
        run: python -m pip install --disable-pip-version-check python-chess==1.999
      - name: Compile C3X 0.11 source guards
        run: python -m py_compile tools/c3x_011_raw_preflight.py tools/c3x_011_fen_collision_audit.py tools/test_c3x_011_raw_preflight.py tools/test_c3x_011_fen_collision_audit.py tools/c3x_011_historical_world_loader.py tools/test_c3x_011_historical_world_loader.py tools/c3x_011_run_existing_six.py
      - name: Unit and negative-boundary regression tests
        run: |
          python tools/test_c3x_011_raw_preflight.py -v
          PYTHONPATH=tools python tools/test_c3x_011_fen_collision_audit.py -v
          PYTHONPATH=tools python tools/test_c3x_011_historical_world_loader.py -v
      - name: Synthetic legal PGN and P19 FEN-rule smoke
        env:
          PYTHONPATH: tools
        run: |
          python - <<'PY'
          import hashlib, tempfile
          from pathlib import Path
          from c3x_011_fen_collision_audit import read_source, audit
          from g10_p19_source_census import canonical_fen
          import chess
          assert canonical_fen(chess.Board()) == "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"
          pgn = '[Event "synthetic"]\n[Site "?"]\n[Date "2026.10.08"]\n[Round "1"]\n[White "A"]\n[Black "B"]\n[Result "*"]\n\n1. e4 e5 2. Nf3 Nc6 3. Bb5 a6 4. Ba4 Nf6 5. O-O Be7 6. Re1 b5 *\n'
          with tempfile.TemporaryDirectory() as d:
              path=Path(d)/"synthetic.pgn"
              path.write_text(pgn)
              hashes, stats, _ = read_source("synthetic", path, 1, 160)
              assert stats["games"] == 1 and len(hashes) == 12, (stats, len(hashes))
              result = audit({"synthetic":path},set(),1,160)
              assert result["source_preseal_granted"] is False
              assert result["outcomes_opened"] is False
              assert result["source"]["synthetic"]["unique_worlds_remaining"] == 12
              path.write_text(pgn.replace("1. e4 e5", "1. e5 e5"))
              try: read_source("bad",path,1,160)
              except ValueError as exc: assert "ILLEGAL_OR_UNPARSABLE_PGN" in str(exc)
              else: raise AssertionError("Bad SAN accepted")
          print("SYNTHETIC_ONLY_PASS_NO_SCIENTIFIC_PRESEAL")
          PY
      - name: Explicit no-science-claims receipt
        run: |
          mkdir -p out
          printf '%s\n' '{"stage":"C3X 0.11","verdict":"SYNTHETIC_TESTS_ONLY","source_preseal_granted":false,"scientific_outcomes_opened":false}' > out/c3x-011-ci-boundary.json
      - uses: actions/upload-artifact@v4
        with:
          name: c3x-011-ci-boundary
          path: out/c3x-011-ci-boundary.json
