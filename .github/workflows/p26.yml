name: p26-budget-indexed-causal-law-field
on:
  push:
    paths:
      - ".github/workflows/p26.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  INSTRUMENT_RUN: 36041727983
jobs:
  lawgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test LawGen v1 and compile v2 ontology
        run: |
          cargo test --manifest-path crates/c3x-lawgen/Cargo.toml
          cargo run --release --manifest-path crates/c3x-lawgen/Cargo.toml --bin c3x-lawgen-v2 -- c3x/ontology/p26-lawgen-spec.json lawgen
      - name: Fresh-process v2 authority check
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("lawgen")
          c=json.loads((p/"constitution.json").read_text())
          l=json.loads((p/"claim-lattice.json").read_text())
          f=json.loads((p/"product-field-contract.json").read_text())
          assert c["constitution"]["schema"]=="c3x-lawgen-constitution-v2"
          assert c["constitution"]["selective_outcomes_consulted"] is False
          assert l["constitution_sha256"]==c["constitution_sha256"]==f["constitution_sha256"]
          assert len((p/"execution-matrix.tsv").read_text().splitlines())==c["constitution"]["execution_matrix_rows"]+1
          print("P26_LAWGEN_ROUNDTRIP_PASS",c["constitution_sha256"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p26-lawgen
          path: lawgen/
          retention-days: 30
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        family: [KQQvKQ,KQRvKQ,KQQvKR,KQRvKR,KRBvKB,KRNvKB,KRBvKN,KRNvKN]
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check chess==1.11.2
      - run: |
          mkdir -p out
          python3 compiler/exact_world/p26_core_compile.py --material "${{ matrix.family }}" --target-per-vertex 48 --max-generated-per-vertex 1400 --out "out/p26-core-${{ matrix.family }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: p26-world-${{ matrix.family }}
          path: out/
          retention-days: 30
  merge:
    needs: world
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: p26-world-*
          path: parts
      - run: python3 compiler/exact_world/p26_merge.py --parts parts --out p26-core-pool.json
      - uses: actions/upload-artifact@v4
        with:
          name: p26-core-pool
          path: p26-core-pool.json
          retention-days: 30
  census:
    needs: [merge,lawgen]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        family: [KQQvKQ,KQRvKQ,KQQvKR,KQRvKR,KRBvKB,KRNvKB,KRBvKN,KRNvKN]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p26-core-pool
          path: stage
      - uses: actions/download-artifact@v4
        with:
          name: p21-instrument-packet
          path: instrument
          repository: WhoSia/C3X
          run-id: ${{ env.INSTRUMENT_RUN }}
          github-token: ${{ github.token }}
      - run: |
          chmod +x instrument/p20/packet/c3x-p20-*
          mkdir -p out
          python3 harness/p26_product_field.py census --pool stage/p26-core-pool.json --engine stockfish_19,stockfish_uci,instrument/p20/packet/c3x-p20-sf19 --engine berserk,env,instrument/p20/packet/c3x-p20-berserk --engine ethereal,env,instrument/p20/packet/c3x-p20-ethereal --family "${{ matrix.family }}" --out "out/p26-census-${{ matrix.family }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: p26-census-${{ matrix.family }}
          path: out/
          retention-days: 30
  precommit:
    needs: census
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: p26-census-*
          path: census
      - uses: actions/download-artifact@v4
        with:
          name: p26-core-pool
          path: stage
      - uses: actions/download-artifact@v4
        with:
          name: p26-lawgen
          path: lawgen
      - name: Build all four outcome-blind atlases
        run: |
          mkdir -p atlas
          cargo test --manifest-path crates/c3x-atlas/Cargo.toml
          for b in 40000 80000 160000 300000; do
            python3 harness/p26_product_field.py export --census-dir census --budget "$b" --out "atlas/p26-census-$b.tsv"
            cargo run --release --manifest-path crates/c3x-atlas/Cargo.toml -- "atlas/p26-census-$b.tsv" "atlas/p26-atlas-$b.tsv" "atlas/p26-atlas-$b-receipt.json"
          done
      - name: Freeze low-capacity correspondence and support-optimized selection
        run: python3 harness/p26_product_field.py precommit --census-dir census --pool stage/p26-core-pool.json --constitution lawgen/constitution.json --atlas-dir atlas --out atlas/p26-precommit.json
      - uses: actions/upload-artifact@v4
        with:
          name: p26-precommit
          path: atlas/
          retention-days: 30
  vertex:
    needs: precommit
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        family: [KQQvKQ,KQRvKQ,KQQvKR,KQRvKR,KRBvKB,KRNvKB,KRBvKN,KRNvKN]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p26-precommit
          path: pre
      - uses: actions/download-artifact@v4
        with:
          name: p21-instrument-packet
          path: instrument
          repository: WhoSia/C3X
          run-id: ${{ env.INSTRUMENT_RUN }}
          github-token: ${{ github.token }}
      - run: |
          chmod +x instrument/p20/packet/c3x-p20-*
          mkdir -p out
          python3 harness/p26_product_field.py vertex --precommit pre/p26-precommit.json --engine stockfish_19,stockfish_uci,instrument/p20/packet/c3x-p20-sf19 --engine berserk,env,instrument/p20/packet/c3x-p20-berserk --engine ethereal,env,instrument/p20/packet/c3x-p20-ethereal --family "${{ matrix.family }}" --out "out/p26-core-${{ matrix.family }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: p26-vertex-${{ matrix.family }}
          path: out/
          retention-days: 30
  adjudicate:
    needs: vertex
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p26-precommit
          path: pre
      - uses: actions/download-artifact@v4
        with:
          pattern: p26-vertex-*
          path: results
      - run: python3 harness/p26_product_field.py adjudicate --precommit pre/p26-precommit.json --results results --out p26-adjudication.json
      - run: node tools/p26-verify.mjs pre/p26-precommit.json p26-adjudication.json p26-report.md
      - run: cat p26-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: p26-final
          path: |
            p26-adjudication.json
            p26-report.md
          retention-days: 30

# exact-prefix engineering repair: LawGen v2 Serialize derives; no scientific field changed
