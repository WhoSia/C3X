name: C3X 0.13 P8-EP11 Exact Legal Search-Event Origin
on:
  push:
    paths:
      - '.github/workflows/c3x-013-p8ep11-legal-origin.yml'
      - 'harness/c3x_013_p8ep11_legal_event_origin.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  legal-node-path-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned legal chess rules
        run: python -m pip install --disable-pip-version-check chess==1.11.2
      - uses: actions/download-artifact@v4
        with:
          name: c3x-013-p8ep11-sf16-native-tt-key-identity
          path: actual-source
          repository: WhoSia/C3X
          run-id: '37798752854'
          github-token: ${{ github.token }}
      - name: Enumerate all legal 2-ply paths to precise TT event FEN
        run: |
          mkdir -p output
          python harness/c3x_013_p8ep11_legal_event_origin.py --input actual-source/EP11_real_native_tt_key_replay.json --json-out output/EP11_legal_event_origin.json --markdown-out output/EP11_legal_event_origin.md
          python - <<'PY'
          import json
          d=json.load(open('output/EP11_legal_event_origin.json'))
          assert d['two_ply_legal_paths_to_exact_event_fen'][0]['moves_uci']==['f3f4','d8c7']
          assert d['legal_path_count']==1
          assert d['tt_bound_name']=='BOUND_LOWER'
          assert d['tt_return_value']>=d['node_window_beta']
          assert d['causal_chess_strategy_claim'] is False
          print('EP11_LEGAL_SEARCH_EVENT_PROVENANCE_FIREWALL_PASS')
          PY
      - name: Preserve source evidence and member SHA manifest
        if: always()
        run: |
          mkdir -p output
          cp harness/c3x_013_p8ep11_legal_event_origin.py output/EP11_legal_origin_verifier.py
          cp actual-source/EP11_real_native_tt_key_replay.json output/EP11_frozen_source_panel.json
          find output -maxdepth 1 -type f ! -name 'EP11_legal_origin_manifest_sha256.txt' -print0 | sort -z | xargs -0 sha256sum > output/EP11_legal_origin_manifest_sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-013-p8ep11-exact-legal-origin
          path: output/
          if-no-files-found: error
          retention-days: 90
