name: p22-selective-relation-transport-parallel-closure
on:
  push:
    paths:
      - ".github/workflows/p22-selective-parallel.yml"
permissions:
  actions: read
  contents: read
jobs:
  vertex:
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include:
          - {lane: core, family: KQQvKQ}
          - {lane: core, family: KQRvKQ}
          - {lane: core, family: KQQvKR}
          - {lane: core, family: KQRvKR}
          - {lane: core, family: KRBvKB}
          - {lane: core, family: KRNvKB}
          - {lane: core, family: KRBvKN}
          - {lane: core, family: KRNvKN}
          - {lane: carrier, family: KQQPvKQP}
          - {lane: carrier, family: KQRPvKQP}
          - {lane: carrier, family: KQQPvKRP}
          - {lane: carrier, family: KQRPvKRP}
          - {lane: carrier, family: KRBPvKBP}
          - {lane: carrier, family: KRNPvKBP}
          - {lane: carrier, family: KRBPvKNP}
          - {lane: carrier, family: KRNPvKNP}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p22-${{ matrix.lane }}-balance-design
          path: design
          repository: WhoSia/C3X
          run-id: 36126640625
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: p21-instrument-packet
          path: instrument
          repository: WhoSia/C3X
          run-id: 36041727983
          github-token: ${{ github.token }}
      - name: Frozen selective vertex
        run: |
          chmod +x instrument/p20/packet/c3x-p20-* instrument/inanis/inanis-instrument
          python3 harness/p22_selective.py ${{ matrix.lane }}-vertex --precommit design/p22-${{ matrix.lane }}-precommit.json --engine stockfish_19,stockfish_uci,instrument/p20/packet/c3x-p20-sf19 --engine berserk,env,instrument/p20/packet/c3x-p20-berserk --engine ethereal,env,instrument/p20/packet/c3x-p20-ethereal --inanis instrument/inanis/inanis-instrument --family ${{ matrix.family }} --nodes 300000 --out p22-${{ matrix.lane }}-vertex-${{ matrix.family }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: p22-${{ matrix.lane }}-vertex-${{ matrix.family }}
          path: p22-${{ matrix.lane }}-vertex-${{ matrix.family }}.json
          retention-days: 30
  core-adjudicate:
    needs: vertex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p22-core-balance-design
          path: design
          repository: WhoSia/C3X
          run-id: 36126640625
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: p22-core-vertex-*
          path: results
      - run: python3 harness/p22_selective.py core-adjudicate --precommit design/p22-core-precommit.json --results results --out p22-core-adjudication.json
      - uses: actions/upload-artifact@v4
        with: {name: p22-core-adjudication, path: p22-core-adjudication.json, retention-days: 30}
  carrier-adjudicate:
    needs: vertex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p22-carrier-balance-design
          path: design
          repository: WhoSia/C3X
          run-id: 36126640625
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: p22-carrier-vertex-*
          path: results
      - run: python3 harness/p22_selective.py carrier-adjudicate --precommit design/p22-carrier-precommit.json --results results --out p22-carrier-adjudication.json
      - uses: actions/upload-artifact@v4
        with: {name: p22-carrier-adjudication, path: p22-carrier-adjudication.json, retention-days: 30}
  synthesize:
    needs: [core-adjudicate, carrier-adjudicate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: p22-core-adjudication, path: final}
      - uses: actions/download-artifact@v4
        with: {name: p22-carrier-adjudication, path: final}
      - run: |
          python3 harness/p22_selective.py synthesize --core final/p22-core-adjudication.json --carrier final/p22-carrier-adjudication.json --out p22-synthesis.json
          cat p22-synthesis.json
      - uses: actions/upload-artifact@v4
        with: {name: p22-selective-final, path: p22-synthesis.json, retention-days: 30}
