name: g95-p8-bootstrap

# Bootstrap rerun after exact finite-EPD pool repair.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/g95-p8.yml"

concurrency:
  group: g95-p8-bootstrap
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  P1_RUN: "36219611294"
  P2_RUN: "36223570067"
  P3_RUN: "36231281653"
  P4_RUN: "36233574663"
  P5_RUN: "36249500693"
  P6_RUN: "36381217698"
  P7_RUN: "36385972623"
  BOOK_COMMIT: "65815ccdbc7727cd4f6aee252ba8f67fb740e92f"

jobs:
  lawgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile constitution
        run: |
          set -euxo pipefail
          python3 -m py_compile tools/c3x_prototype_v1.py harness/g95_p8_corpus.py harness/g95_p8_court.py
          cargo run --release --manifest-path crates/c3x-lawgen/Cargo.toml --bin lawgen_v18 -- c3x/ontology/g95-p8-constitution.json out/lawgen
          sha256sum out/lawgen/* | sort > out/lawgen-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: g95-p8-lawgen-preseal
          path: out/
          retention-days: 30

  kernels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build primary and independent kernels
        run: |
          set -euxo pipefail
          cargo test --manifest-path crates/c3x-field/Cargo.toml
          cargo build --release --manifest-path crates/c3x-field/Cargo.toml --bin c3x-prototype-p8 --bin c3x-support-p4
          go build -o p8-prototype-verify tools/p8_prototype_verify.go
          mkdir -p out
          cp crates/c3x-field/target/release/c3x-prototype-p8 out/
          cp crates/c3x-field/target/release/c3x-support-p4 out/
          cp p8-prototype-verify out/
          chmod +x out/*
          sha256sum out/* | sort > out/kernel-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: g95-p8-kernels
          path: out/
          retention-days: 30

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: g95-p1-precommit-sealed
          path: hist/p1
          repository: WhoSia/C3X
          run-id: ${{ env.P1_RUN }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: g95-p2-precommit-sealed
          path: hist/p2
          repository: WhoSia/C3X
          run-id: ${{ env.P2_RUN }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: g95-p3-corpus-sealed
          path: hist/p3
          repository: WhoSia/C3X
          run-id: ${{ env.P3_RUN }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: g95-p4-corpus-sealed
          path: hist/p4
          repository: WhoSia/C3X
          run-id: ${{ env.P4_RUN }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: g95-p5-corpus-sealed
          path: hist/p5
          repository: WhoSia/C3X
          run-id: ${{ env.P5_RUN }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: g95-p6-corpus-sealed
          path: hist/p6
          repository: WhoSia/C3X
          run-id: ${{ env.P6_RUN }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: g95-p7-corpus-sealed
          path: hist/p7
          repository: WhoSia/C3X
          run-id: ${{ env.P7_RUN }}
          github-token: ${{ github.token }}

      - name: Freeze fresh P8 chess worlds
        run: |
          set -euxo pipefail
          python3 -m pip install --disable-pip-version-check python-chess==1.999
          git clone https://github.com/official-stockfish/books.git books
          git -C books checkout --detach "$BOOK_COMMIT"
          mkdir -p data

          extract_book () {
            local f="$1"
            if test -f "books/$f"; then
              cp "books/$f" "data/$f"
            elif test -f "books/$f.zip"; then
              unzip -p "books/$f.zip" > "data/$f"
            else
              echo "missing book $f" >&2
              exit 1
            fi
          }

          for f in             2moves_v1.epd             4mvs_+90_+99.epd             UHO_XXL_+0.80_+1.09.pgn             6mvs_+90_+99.epd             popularpos_lichess.epd             UHO_MEGA_2022_+110_+149.pgn             bjbraams_chessdb_198350_lines.pgn             UHO_XXL_2022_+100_+129.pgn             UHO_XXL_2022_+120_+149.pgn
          do
            extract_book "$f"
          done

          EX=()
          for d in hist/p1 hist/p2 hist/p3 hist/p4 hist/p5 hist/p6 hist/p7
          do
            p="$(find "$d" -name '*.json' -print -quit)"
            test -n "$p"
            EX+=(--exclude "$p")
          done

          python3 harness/g95_p8_corpus.py             --train "P8_TRAIN_2MVS|EPD|data/2moves_v1.epd|2moves_v1.epd|3"             --train "P8_TRAIN_4MVS|EPD|data/4mvs_+90_+99.epd|4mvs_+90_+99.epd|3"             --train "P8_TRAIN_UHO_PGN|PGN|data/UHO_XXL_+0.80_+1.09.pgn|UHO_XXL_+0.80_+1.09.pgn|8|18|3"             --train "P8_TRAIN_PIONEER|GENERATED_LEGAL|c3x-p8-train-pioneer|14|32|3"             --select "P8_SELECT_6MVS|EPD|data/6mvs_+90_+99.epd|6mvs_+90_+99.epd|3"             --select "P8_SELECT_POPULAR|EPD|data/popularpos_lichess.epd|popularpos_lichess.epd|3"             --select "P8_SELECT_MEGA|PGN|data/UHO_MEGA_2022_+110_+149.pgn|UHO_MEGA_2022_+110_+149.pgn|10|20|3"             --select "P8_SELECT_PIONEER|GENERATED_LEGAL|c3x-p8-select-pioneer|16|34|3"             --transport "P8_TRANSPORT_CHESSDB|PGN|data/bjbraams_chessdb_198350_lines.pgn|bjbraams_chessdb_198350_lines.pgn|10|22|3"             --transport "P8_TRANSPORT_UHO100|PGN|data/UHO_XXL_2022_+100_+129.pgn|UHO_XXL_2022_+100_+129.pgn|10|20|3"             --transport "P8_TRANSPORT_UHO120|PGN|data/UHO_XXL_2022_+120_+149.pgn|UHO_XXL_2022_+120_+149.pgn|10|20|3"             --transport "P8_TRANSPORT_PIONEER|GENERATED_LEGAL|c3x-p8-transport-pioneer|18|36|3"             "${EX[@]}"             --source-repo official-stockfish/books             --source-commit "$BOOK_COMMIT"             --out g95-p8-corpus.json

          sha256sum g95-p8-corpus.json > g95-p8-corpus.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: g95-p8-corpus-sealed
          path: g95-p8-corpus*
          retention-days: 30

  precommit:
    needs:
      - lawgen
      - kernels
      - corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: g95-p8-lawgen-preseal
          path: lawgen

      - uses: actions/download-artifact@v4
        with:
          name: g95-p8-corpus-sealed
          path: corpus

      - uses: actions/download-artifact@v4
        with:
          name: g95-p4-precommit-sealed
          path: p4
          repository: WhoSia/C3X
          run-id: ${{ env.P4_RUN }}
          github-token: ${{ github.token }}

      - name: Seal P8 before engine execution
        run: |
          set -euxo pipefail
          CONST="$(find lawgen -name constitution.json -print -quit)"
          P4="$(find p4 -name g95-p4-precommit.json -print -quit)"
          test -n "$CONST"
          test -n "$P4"
          python3 harness/g95_p8_court.py precommit             --constitution "$CONST"             --corpus corpus/g95-p8-corpus.json             --p4-precommit "$P4"             --p7-closure c3x/receipts/g95-p7-closure.json             --out g95-p8-precommit.json
          sha256sum g95-p8-precommit.json > g95-p8-precommit.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: g95-p8-precommit-sealed
          path: g95-p8-precommit*
          retention-days: 30
