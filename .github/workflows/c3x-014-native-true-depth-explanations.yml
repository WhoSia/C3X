name: C3X 0.14 In-Stage True Native Depth-Bounded Explanation Gate
on:
  push:
    paths:
      - '.github/workflows/c3x-014-native-true-depth-explanations.yml'
      - 'harness/c3x_014_true_native_completion_explanation_ledger.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-native-explanation-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load exact chess rules and source validators
        run: |
          python -m pip install --disable-pip-version-check chess==1.11.2
          python -m py_compile harness/c3x_014_true_native_completion_explanation_ledger.py
          mkdir -p fixed-source native-source output
      - uses: actions/download-artifact@v4
        with:
          name: c3x-014-internal-depth-indexed-search-court
          path: fixed-source
          repository: WhoSia/C3X
          run-id: '37806356299'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: c3x-014-instage-native-SF16-true-completed-depth
          path: native-source
          repository: WhoSia/C3X
          run-id: '37807422574'
          github-token: ${{ github.token }}
      - name: Enforce exact original instrumented source SHA256
        run: |
          printf '%s  %s\n' '868b70e5311e2d9cc51f01e8ef50fc78127b1544dd9198c335f7877af335a24b' 'fixed-source/P3_GENUINE_NATIVE_DEPTH_MEDIATION_DIAGNOSTIC.json' | sha256sum -c -
          printf '%s  %s\n' 'cf6f4e5703a3250e7694049978fa3fa541107217a079997674f324f11d254978' 'native-source/P3_SOURCE_NATIVE_COMPLETED_DEPTH_VS_PV.json' | sha256sum -c -
      - name: Generate sixteen real native-completion-certified computational explanations
        run: |
          python harness/c3x_014_true_native_completion_explanation_ledger.py --fixed-depth fixed-source/P3_GENUINE_NATIVE_DEPTH_MEDIATION_DIAGNOSTIC.json --native native-source/P3_SOURCE_NATIVE_COMPLETED_DEPTH_VS_PV.json --json-out output/P3_TRUE_NATIVE_COMPLETION_EXPLANATION_LEDGER.json --md-out output/P3_TRUE_NATIVE_BUDGET_EXPLANATIONS_KO.md
          python - <<'PY'
          import json
          r=json.load(open('output/P3_TRUE_NATIVE_COMPLETION_EXPLANATION_LEDGER.json'))
          assert r['research_unit']=='C3X 0.14' and r['P3_internal_only']
          assert r['games']==16 and r['falsifiers_passed']==5
          assert r['native_completions_not_equal_PV_reports']==46
          assert r['strategic_causal_claims_allowed']==0
          a=next(x for x in r['source_game_explanations'] if x['round']=='96.1')
          assert a['native_true_completedDepth_OFF_MAIN']==[12,11]
          assert a['max_PV_reported_depth_OFF_MAIN']==[13,11]
          assert a['strict_cp_inversion_depths']==[12]
          print('C3X014_SOURCE_NATIVE_DEPTH_EXPLANATION_AUTHORITY_PASS')
          PY
      - name: Save grounded documents with source code, no new Lab
        if: always()
        run: |
          cp harness/c3x_014_true_native_completion_explanation_ledger.py output/P3_TRUE_NATIVE_CLAIM_COMPILER.py
          cp fixed-source/P3_GENUINE_NATIVE_DEPTH_MEDIATION_DIAGNOSTIC.json output/REAL_FIXED_DEPTH_SOURCE.json
          cp native-source/P3_SOURCE_NATIVE_COMPLETED_DEPTH_VS_PV.json output/REAL_NATIVE_COMPLETION_SOURCE.json
          printf '%s\n' 'One formal C3X 0.14 research unit; internal P3 technical court only. No strategic chess concept or human learning effect certified.' > output/P3_CLAIM_LIMITS.txt
          find output -maxdepth 1 -type f ! -name 'P3_member_sha256.txt' -print0 | sort -z | xargs -0 sha256sum > output/P3_member_sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-014-true-native-completed-depth-explanations
          path: output/
          retention-days: 90
          if-no-files-found: error
