name: C3X 0.12 Real UCI Transport Smoke
on:
  push:
    paths:
      - '.github/workflows/c3x-012-real-uci-smoke.yml'
      - 'tools/c3x_012_uci_probe.cpp'
      - 'tools/c3x_012_uci_score_gate.cpp'
      - 'c3x/schema/c3x-012-uci-measurements.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-real-engine-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install distribution Stockfish and pinned chess rules
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq stockfish
          python3 -m pip install --disable-pip-version-check chess==1.11.2
      - name: Compile native C++ UCI probe
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror tools/c3x_012_uci_probe.cpp -o /tmp/c3x_012_uci_probe
          g++ -std=c++17 -O2 -Wall -Wextra -Werror tools/c3x_012_uci_score_gate.cpp -o /tmp/c3x_012_uci_score_gate
      - name: Frozen opening fixture and legal move-pair validation
        run: |
          mkdir -p output
          python3 - <<'PY'
          import chess, hashlib, json
          b=chess.Board()
          for san in ['e4','c5','Nf3','d6','d4','cxd4','Nxd4','Nf6','Nc3','a6']:
              b.push_san(san)
          moves=('c1e3','c1g5')
          assert all(chess.Move.from_uci(m) in b.legal_moves for m in moves)
          fen=b.fen(en_passant="fen")
          identity={'stage':'C3X 0.12','mode':'REAL_ENGINE_PROTOCOL_ONLY',
                    'fen':fen,'fen_sha256':hashlib.sha256(fen.encode()).hexdigest(),
                    'legal_moves':list(moves),'legality_verified':True,
                    'explanation_granted':False,'scientific_preseal':False}
          open('output/frozen_fixture.json','w').write(json.dumps(identity,indent=2)+'\n')
          open('output/fen.txt','w').write(fen+'\n')
          print(identity)
          PY
      - name: Execute actual installed engine twice with bounded search
        run: |
          command -v /usr/games/stockfish
          sha256sum /usr/games/stockfish > output/engine_binary_sha256.txt
          /usr/games/stockfish <<< $'uci\nquit' > output/engine_uci_identity.txt
          FEN="$(cat output/fen.txt)"
          /tmp/c3x_012_uci_probe /usr/games/stockfish "$FEN" c1e3 c1g5 > output/uci_depth8_repeat1.json
          /tmp/c3x_012_uci_probe /usr/games/stockfish "$FEN" c1e3 c1g5 > output/uci_depth8_repeat2.json
          python3 - <<'PY'
          import json
          for index in (1,2):
              record=json.load(open(f'output/uci_depth8_repeat{index}.json'))
              assert record['status']=='RAW_UCI_OBSERVATION_ONLY'
              assert not record['legality_verified'] and not record['explanation_granted']
              assert record['bestmove'].split()[0] in ('c1e3','c1g5')
              print('REAL_UCI_DATA_COLLECTED_NOT_EXPLANATION',index,len(record['info_lines']))
          PY
      - name: Classify real raw UCI packets without promoting explanation authority
        if: always()
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          for index in (1,2):
              src=Path(f'output/uci_depth8_repeat{index}.json')
              if not src.is_file():
                  Path(f'output/comparability_repeat{index}.json').write_text(
                      json.dumps({'verdict':'NO_RAW_PACKET','explanation_granted':False})+'\\n')
                  continue
              data=json.loads(src.read_text())
              lines=data.get('info_lines',[])
              text='\\n'.join(lines+['bestmove '+data.get('bestmove','(none)')])+'\\n'
              result=subprocess.run(['/tmp/c3x_012_uci_score_gate','c1e3','c1g5'],
                                    input=text,text=True,capture_output=True,timeout=5)
              record={'verdict':'SYNTACTICALLY_COMPARABLE_CP_ONLY' if result.returncode==0
                      else 'COMPARABILITY_HOLD',
                      'score_gate_exit_code':result.returncode,
                      'score_gate_stdout':result.stdout.strip(),
                      'score_gate_stderr':result.stderr.strip(),
                      'engine_identity_verified':False,
                      'explanation_granted':False,
                      'scientific_preseal':False}
              Path(f'output/comparability_repeat{index}.json').write_text(json.dumps(record,indent=2)+'\\n')
              print(index,record['verdict'])
          PY
      - name: Validate SQL evidence schema with negative controls
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db=sqlite3.connect(':memory:')
          db.executescript(Path('c3x/schema/c3x-012-uci-measurements.sql').read_text())
          h='0'*64
          db.execute('INSERT INTO source_world VALUES(?,?,?,?,?)',('fixture','synthetic',h,'SYNTHETIC_FIXTURE','fixture'))
          params=('r1','fixture','e2e4','d2d4',h,'synthetic',1,8,8,'SIDE_TO_MOVE',12,7,'COMPARABLE_CP')
          db.execute('INSERT INTO measurement(measurement_id,world_id,move_a,move_b,engine_sha256,uci_id,run_index,requested_depth,emitted_depth,score_perspective,a_cp,b_cp,status) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?)',params)
          assert db.execute('SELECT repeats FROM paired_repeats').fetchone()[0]==1
          try:
              db.execute("UPDATE measurement SET explanation_authority=1 WHERE measurement_id='r1'")
          except sqlite3.IntegrityError: pass
          else: raise AssertionError('EXPLANATION_AUTHORITY_PROMOTION_WAS_NOT_BLOCKED')
          try:
              db.execute("UPDATE measurement SET emitted_depth=7 WHERE measurement_id='r1'")
          except sqlite3.IntegrityError: pass
          else: raise AssertionError('DEPTH_MISMATCH_WAS_NOT_BLOCKED')
          print('SYNTHETIC_SQL_CONSTRAINTS_PASS')
          PY
      - name: Upload read-only real-engine execution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3x-012-real-uci-smoke
          path: output/
          if-no-files-found: error
