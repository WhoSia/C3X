name: c3x-g10-p9-adjudication-recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/g10-p9-recover.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  FAILED_RUN: "37007062196"

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check python-chess==1.999 pytest
      - name: Verify recovery authority
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open("c3x/results/g10-p9-preoutcome-census.json"))
          assert r["verdict"]=="PASS_PREOUTCOME_GRADED_SELECTOR_POSITIVITY"
          assert r["firewall_pass"] is True
          print("G10_P9_RECOVERY_AUTHORITY_PASS")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: g10-p9-chain-freeze-sealed
          path: state
          repository: WhoSia/C3X
          run-id: ${{ env.FAILED_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: g10-p9-factorial-*
          path: worlds
          repository: WhoSia/C3X
          run-id: ${{ env.FAILED_RUN }}
          github-token: ${{ github.token }}
      - name: Recover adjudication without rerunning worlds
        run: |
          mkdir -p out
          python3 harness/g95_p16_court.py adjudicate             --freeze state/g10-p9-chain-freeze.json             --worlds worlds             --out out/g10-p9-p16-adjudication.json             --markdown out/g10-p9-certificates.md
          PYTHONPATH=. python3 tools/g10_p6_extract.py             --fresh out/g10-p9-p16-adjudication.json             --chain_freeze state/g10-p9-chain-freeze.json             --worlds worlds             --out out/g10-p9-normalized-certificates.json
          PYTHONPATH=. python3 tools/g10_p9_adjudicate.py             --normalized out/g10-p9-normalized-certificates.json             --census c3x/results/g10-p9-preoutcome-census.json             --out out/g10-p9-experiment.json
          python3 - <<'PY'
          import json
          r=json.load(open("out/g10-p9-experiment.json"))
          assert r["preoutcome_firewall_pass"] is True
          assert r["mechanism_family_admission_opened"] is False
          assert r["transportable_pattern_instantiated"] is False
          print("G10_P9_RECOVERED",r["verdict"])
          print("G10_P9_ACQ",r["acquisition"])
          print("G10_P9_SOURCE",r["source_enrichment"])
          print("G10_P9_ENGINE",r["engine_certificate_counts"])
          PY
          sha256sum out/* | sort > out/final-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: g10-p9-experiment-recovered-sealed
          path: out/
          retention-days: 90
      - name: Bind recovered result
        run: |
          cp out/g10-p9-experiment.json c3x/results/g10-p9-experiment.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add c3x/results/g10-p9-experiment.json
          git diff --cached --quiet && exit 0
          VERDICT="$(python3 -c 'import json;print(json.load(open("out/g10-p9-experiment.json"))["verdict"])')"
          git commit -m "C3X G10-P9: bind recovered experiment $VERDICT"
          git push
