name: c3x-g10-p16-router-freeze

on:
  push:
    branches: [main]
    paths:
      - 'c3x/ontology/g10-p16-constitution.json'
      - 'tools/g10_p16_router_freeze.py'
      - '.github/workflows/g10-p16-router-freeze.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  P15_STAGE_A_RUN: "37118943324"

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: g10-p15-stage-a-sealed
          path: stagea
          repository: WhoSia/C3X
          run-id: ${{ env.P15_STAGE_A_RUN }}
          github-token: ${{ github.token }}
      - name: Freeze context router from P15 Stage-A only
        run: |
          python3 tools/g10_p16_router_freeze.py             --stage-a stagea/g10-p15-stage-a.json             --out g10-p16-router-freeze.json
          python3 - <<'PY'
          import json
          r=json.load(open("g10-p16-router-freeze.json"))
          assert r["status"]=="ROUTER_FROZEN_PRE_HELDOUT_SOURCE"
          assert r["inputs"]["p15_stage_a_only"] is True
          assert r["inputs"]["p15_stage_b_read"] is False
          assert r["inputs"]["heldout_source_bytes_read"] is False
          print("G10_P16_ROUTER_VERIFIED",len(r["routed_cells"]),r["grammar_cell_counts"])
          PY
          sha256sum g10-p16-router-freeze.json > g10-p16-router-freeze.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: g10-p16-router-freeze-sealed
          path: |
            g10-p16-router-freeze.json
            g10-p16-router-freeze.sha256
          retention-days: 90
