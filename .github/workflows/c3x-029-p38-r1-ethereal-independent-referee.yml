name: C3X P38 R1 Independent Ethereal 12.75 Frozen Forecast Court
on:
  push:
    paths:
      - '.github/workflows/c3x-029-p38-r1-ethereal-independent-referee.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-referee-no-writeback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install legal game rules and UCI client
        run: python -m pip install -q chess==1.11.2
      - name: Fail-closed original prediction and reference unit tests
        run: python -m unittest discover -s tools -p 'test_c3x_029_p38_r1_ethereal_independent_referee.py' -v
      - name: Recover original eight event sources from pre-outcome CI
        uses: actions/download-artifact@v4
        with:
          name: c3x-p37-r1-oct-eight-distinct-events-original-pgn-and-engine-blind-freeze
          repository: WhoSia/C3X
          run-id: '41968008046'
          path: source
          github-token: ${{ github.token }}
      - name: Recover original predictions sealed BEFORE old Stockfish referee
        uses: actions/download-artifact@v4
        with:
          name: c3x-p37-r2-pre-referee-eight-event-three-rival-predictions
          repository: WhoSia/C3X
          run-id: '41969173637'
          path: forecasts
          github-token: ${{ github.token }}
      - name: Verify BOTH original frozen data member SHA256
        run: |
          set -euo pipefail
          printf '%s  %s\n' 77ebaa409e7c2099cc6cce3419c2f55ded295d925ab441dc2d13c16b67c2c361 source/P37_R1_8_EVENT_8_GAME_SOURCE_ONLY_MANIFEST.json | sha256sum -c -
          printf '%s  %s\n' da395f0eb16e7b294af2056dadd92b579770aa8f1ae288d1d358132685807051 forecasts/P37_R2_THREE_RIVAL_PRE_REFERENCE_PREDICTIONS.json | sha256sum -c -
      - name: Build open-source Ethereal 12.75, exact independent 2020 release SHA
        run: |
          set -euo pipefail
          mkdir -p output
          git clone -q --single-branch --branch v12.75 https://github.com/AndyGrant/Ethereal.git /tmp/c3x-p38-ethereal
          test "$(git -C /tmp/c3x-p38-ethereal rev-parse HEAD)" = b55ed96881f163940569145fbcc4e222d7272338
          make -s -C /tmp/c3x-p38-ethereal/src -j2 nopopcnt
          test -x /tmp/c3x-p38-ethereal/src/Ethereal
          git -C /tmp/c3x-p38-ethereal rev-parse HEAD > output/P38_ETHEREAL_SOURCE_COMMIT.txt
          sha256sum /tmp/c3x-p38-ethereal/src/Ethereal > output/P38_ETHEREAL_BINARY_SHA256.txt
          printf 'uci\nisready\nquit\n' | /tmp/c3x-p38-ethereal/src/Ethereal > output/P38_ETHEREAL_UCI_BANNER.txt
          grep -q 'id name Ethereal' output/P38_ETHEREAL_UCI_BANNER.txt
          grep -q 'uciok' output/P38_ETHEREAL_UCI_BANNER.txt
      - name: Run sealed three-rival original predictions vs 96k/192k Ethereal replies
        run: |
          set -euo pipefail
          python -u harness/c3x_029_p38_r1_ethereal_independent_referee.py \
            --prediction-zip forecasts \
            --source-zip source \
            --ethereal /tmp/c3x-p38-ethereal/src/Ethereal \
            --out output/P38_R1_ETHEREAL96K192K_FROZEN_FORECAST_TRANSPORT.json \
            | tee output/P38_NATIVE_STDOUT.txt
          grep -q 'P38_CROSS_ENGINE_COURT_COMPLETED' output/P38_NATIVE_STDOUT.txt
      - name: Seal all native receipts without modifying repo
        if: always()
        run: |
          mkdir -p output
          find output -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > output/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-p38-r1-ethereal-12p75-independent-two-budget-original-frozen-forecast-court
          path: output/
          retention-days: 90
          if-no-files-found: error
