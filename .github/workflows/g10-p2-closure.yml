name: c3x-g10-p2-closure-finalization

on:
  workflow_dispatch:
  push:
    paths:
      - "c3x/receipts/g10-p2-closure.json"
      - "c3x/data/g10-p2-source-manifest.json"
      - "docs/G10_P2_COURT.md"
      - ".github/workflows/g10-p2-closure.yml"

permissions:
  contents: read

jobs:
  closure-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check python-chess==1.999 pytest
      - name: Regression and source-HOLD integrity
        run: |
          PYTHONPATH=. pytest -q tests/test_g10_p2.py tests/test_g10_p1.py tests/test_g10_p0.py tests/test_c3x_explain.py
          python3 - <<'PY'
          import json
          r=json.load(open("c3x/receipts/g10-p2-closure.json"))
          m=json.load(open("c3x/data/g10-p2-source-manifest.json"))
          assert r["verdict"]=="HOLD_FRESH_DISJOINT_SOURCE_SUPPORT_INSUFFICIENT"
          assert r["canonical_attempt"]["run"]==36825916744
          assert r["outcomes_opened"]["position_bank"] is False
          assert r["outcomes_opened"]["engine_question_identity"] is False
          assert r["outcomes_opened"]["maia_human_policy"] is False
          assert r["outcomes_opened"]["certificate_outcomes"] is False
          assert r["source_substitution_performed"] is False
          assert r["reopen_same_stage"] is True
          assert r["no_automatic_p3"] is True
          assert m["p2_execution"]["court_outcome_opened"] is False
          print("C3X_G10_P2_SOURCE_HOLD_INTEGRITY_PASS")
          PY
      - name: Seal closure capsule
        run: |
          mkdir -p out
          cp c3x/receipts/g10-p2-closure.json out/
          cp c3x/data/g10-p2-source-manifest.json out/
          cp docs/G10_P2_COURT.md out/
          sha256sum out/* > out/sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: g10-p2-source-hold-closure
          path: out/
          retention-days: 90
