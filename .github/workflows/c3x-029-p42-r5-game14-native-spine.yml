name: C3X P42-R5 Game14 native local source-to-parent spine (read-only)
on:
  push:
    branches: [main]
    paths:
      - 'tools/c3x_029_p42_r5_game14_capture_local_lineage_overlay.py'
      - 'tools/c3x_029_p42_r5_derived_native_build.py'
      - 'harness/c3x_029_p42_r5_game14_local_spine_court.py'
      - 'harness/test_c3x_029_p42_r5_game14_local_spine_court.py'
      - 'tools/test_c3x_029_p42_r6_exact_child_key_source.py'
      - '.github/workflows/c3x-029-p42-r5-game14-native-spine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game14-source-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install orthodox chess legality checker
        run: python -m pip install chess==1.11.2
      - name: 'Regression - no local-source path invented'
        run: |
          PYTHONPATH=harness python -m unittest -v \
            test_c3x_029_p42_r5_game14_local_spine_court
          PYTHONPATH=tools python -m unittest -v test_c3x_029_p42_r6_exact_child_key_source
      - uses: actions/download-artifact@v4
        with:
          name: c3x027-sept2026-preengine-source-only16
          path: source/
          repository: WhoSia/C3X
          run-id: '39348434657'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: c3x027-sept-stageA-before-native-TT-treatment
          path: forecast/
          repository: WhoSia/C3X
          run-id: '39351313113'
          github-token: ${{ github.token }}
      - name: Derive old source-native overlay stack, add passive R5 before build
        run: |
          set -euo pipefail
          mkdir -p evidence private public
          python tools/c3x_029_p42_r5_derived_native_build.py
      - name: Reproduce old StageA byte for byte under passive R5 observer disabled
        run: |
          set -euo pipefail
          PYTHONPATH=harness python harness/c3x_027_sept_source_staged_unintervened.py \
            --source source/C3X_027_SEPT2026_NEW_SOURCE16.json \
            --engine /tmp/C3X020_MULTI_STATE/src/stockfish \
            --out private/C3X027_SEPT_STAGEA_FULL_PRIVATE.json \
            --public private/C3X027_REBUILT_STAGEA_PUBLIC.json
          test "$(sha256sum private/C3X027_SEPT_STAGEA_FULL_PRIVATE.json | awk '{print $1}')" = b0eb51ab779609db346c75d65a6a65fd31efc9a648111d042cfec5199a4afde1
          test "$(sha256sum private/C3X027_REBUILT_STAGEA_PUBLIC.json | awk '{print $1}')" = 4572edd4c0761c3875aed421b08880ff142c21f691fe940c7c6d760dbb397be5
      - name: R5 source witness in actual historical Game14 three native arms
        run: |
          set -euo pipefail
          export C3X042_R5_LOCAL_TRACE="$PWD/private/C3X042_R5_GAME14_LOCAL_SOURCE_TRACE.txt"
          : > "$C3X042_R5_LOCAL_TRACE"
          PYTHONPATH=harness python -u harness/c3x_027_sept_game14_direct_capture_guard.py \
            --source source/C3X_027_SEPT2026_NEW_SOURCE16.json \
            --stagea private/C3X027_SEPT_STAGEA_FULL_PRIVATE.json \
            --forecast forecast/C3X027_SEPT_PRE_TT_FORECAST.json \
            --engine /tmp/C3X020_MULTI_STATE/src/stockfish \
            --private private/guard-events \
            --out public/C3X027_SEPT_GAME14_RESTORATION_CHECK.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("public/C3X027_SEPT_GAME14_RESTORATION_CHECK.json").read_text())
          assert r["baseline_bestmove"]=="b3a4", "R5_HOLD_ORIGINAL_MOVE_CHANGED"
          assert r["TT_FIRST_bestmove"]=="f3f4", "R5_HOLD_TT_FIRST_MOVE_CHANGED"
          assert r["counterfactual_bestmove"]=="b3a4", "R5_HOLD_RESTORED_MOVE_CHANGED"
          assert r["one_event_reenable_status"]=="ORIGINAL_ROOT_RESTORED", "R5_HOLD_NONRESTORED_COUNTERFACTUAL"
          assert r["counterfactual_branch_action_counts"].get("EXACT_ONE_EVENT_REENABLED")==2, "R5_HOLD_INSUFFICIENT_SOURCE_CONTACT"
          assert r["actual_branch_proof"] is True and r["native_guard_one_event_contact"] is True, "R5_HOLD_HISTORICAL_SOURCE_CONTACT_NOT_REPRODUCED"
          assert r["natural_full_mediation_certified"] is False, "R5_HOLD_OVERCLAIMED_NATURAL_MEDIATION"
          print("P42_R5_HISTORICAL_THREE_ARM_ROOT_AND_SOURCE_EVENT_REPRODUCED")
          PY
          python harness/c3x_029_p42_r5_game14_local_spine_court.py \
            --private-trace private/C3X042_R5_GAME14_LOCAL_SOURCE_TRACE.txt \
            --public-out public/C3X042_R5_GAME14_LOCAL_ADMISSION.json \
            --replays 2
      - name: Reapply source-licence and private-data upload gate
        run: |
          set -euo pipefail
          for f in public/*.json; do
            python tools/c3x_023_rights_preupload_gate.py \
              --tier P2_AGGREGATE_SUMMARY --file "$f" \
              --report "public/RIGHTS_$(basename "$f")"
          done
          echo 'Adapted 2026-09 Lichess broadcast CC BY-SA 4.0; source https://database.lichess.org/broadcast/lichess_db_broadcast_2026-09.pgn.zst. No original PGN, source key, private game history, raw trace or modified GPL binary distributed.' > public/SOURCE_LICENSE_NOTICE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x042-p42-r5-game14-public-aggregate-only
          path: public/
          if-no-files-found: warn
