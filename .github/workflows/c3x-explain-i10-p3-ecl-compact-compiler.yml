name: C3X Explain I10 P3 Evidence Compiled Lightweight Judgment
on:
  push:
    paths:
      - '.github/workflows/c3x-explain-i10-p3-ecl-compact-compiler.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-compiled-ecl-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: I9 and I10 plus ECL P3 exact-source/evidence and adversarial tests
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pytest python-chess==1.999
          python3 -m compileall -q c3x_explain tools/c3x_explain_i10_p3_native_ecl_pilot.py
          pytest -q tests/test_c3x_explain.py tests/test_c3x_explain_i10_judgment.py tests/test_c3x_explain_i10_p1_real_cases.py tests/test_c3x_explain_i10_p2_p16_original_certificate_boundary.py tests/test_c3x_explain_i10_p3_evidence_compiler.py
      - name: Pinned official original Stockfish 16 source
        run: |
          set -euo pipefail
          git clone -q --single-branch --branch sf_16 https://github.com/official-stockfish/Stockfish.git /tmp/i10-p3-sf16
          test "$(git -C /tmp/i10-p3-sf16 rev-parse HEAD)" = 68e1e9b3811e16cad014b590d7443b9063b3eb52
          make -s -C /tmp/i10-p3-sf16/src -j2 build ARCH=x86-64
      - name: Actually compile C3X ECL from two source-original pre-exposed chess games
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p derived
          python3 tools/c3x_explain_i10_p3_native_ecl_pilot.py \
            --engine /tmp/i10-p3-sf16/src/stockfish \
            --out derived/I10_P3_ECL_SF16_HISTORICAL_NATIVE_EXPOSED.json
          python3 - <<'PY'
          import json
          p=json.load(open("derived/I10_P3_ECL_SF16_HISTORICAL_NATIVE_EXPOSED.json"))
          assert len(p["native_cases"])==2
          assert p["trained_parameter_count"]==0
          for x in p["native_cases"]:
              z=x["compiler_packet"]
              assert z["verdict"]=="EMIT_BOUNDED_CONVENTIONAL"
              assert z["source_causal_claim"] is False
              assert z["confidence_probability"] is None
              assert z["actual_move_role"] in ("LEADER","CHALLENGER")
              assert all(y["authority"]!="CAUSAL" for y in z["claims"])
              assert z["model_interface"]["trainable_parameters"]==0
              assert x["measured_uci_analyse_wall_ns_single_run"]>0
              assert x["measured_claim_compiler_wall_ns_single_run"]>0
              print("I10_P3_NATIVE_SOURCE_ACCEPTED",x["case"],z["text_ko"][:360])
          PY
          printf '%s\n' 'C3X ECL zero-training evidence compiler and static tiny ranker. Original SF16 source, exposed historic chess positions only; independent human effect and model superiority NOT ESTABLISHED. No C3X Ethereal P16 admission or Stockfish causal certificate.' > derived/SCOPE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-i10-p3-source-native-ecl-development
          path: derived/
          retention-days: 14
