name: c3x-g10-p14-stage-b-atlas

on:
  push:
    branches: [main]
    paths:
      - 'tools/g10_p14_stage_b_atlas.py'
      - '.github/workflows/g10-p14-stage-b-atlas.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  STAGE_B_RUN: "37118007899"

jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: g10-p14-search-positivity-sealed
          path: stageb
          repository: WhoSia/C3X
          run-id: ${{ env.STAGE_B_RUN }}
          github-token: ${{ github.token }}
      - name: Demotion-only Stage-B support atlas
        run: |
          python3 tools/g10_p14_stage_b_atlas.py             --gate stageb/g10-p14-search-positivity.json             --out g10-p14-stage-b-atlas.json
          python3 - <<'PY'
          import json
          r=json.load(open("g10-p14-stage-b-atlas.json"))
          assert r["status"]=="POST_GATE_DEMOTION_ONLY"
          assert r["can_strengthen_stage_b"] is False
          print("G10_P14_STAGE_B_ATLAS_VERIFIED",r["stage_b_verdict"])
          print("SOURCE",r["source_rows"])
          print("LOW",r["lowest_chain_feasibility_cells"])
          print("HIGH",r["highest_chain_feasibility_cells"])
          PY
          sha256sum g10-p14-stage-b-atlas.json > g10-p14-stage-b-atlas.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: g10-p14-stage-b-atlas-sealed
          path: |
            g10-p14-stage-b-atlas.json
            g10-p14-stage-b-atlas.sha256
          retention-days: 90
