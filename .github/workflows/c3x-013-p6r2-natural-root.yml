name: C3X 0.13 P6-R2 Real Game Birth Preference Probe
on:
  push:
    paths:
      - '.github/workflows/c3x-013-p6r2-natural-root.yml'
      - 'harness/c3x_013_p6r2_natural_game_root_pair.py'
      - 'c3x/ontology/c3x-013-p6r2-natural-birth-preference-precommit.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-natural-event-root-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual engine and legal chess verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq stockfish
          python3 -m pip install --disable-pip-version-check chess==1.11.2
      - name: Run frozen natural opponent-reply contrast at three depths
        env:
          PYTHONPATH: .
        run: |
          mkdir -p output
          python3 harness/c3x_013_p6r2_natural_game_root_pair.py --engine /usr/games/stockfish --output output/p6r2_real_game_root_preference.json
          sha256sum /usr/games/stockfish > output/engine_sha256.txt
          /usr/games/stockfish <<< $'uci\nquit' > output/engine_id.txt
          python3 - <<'PY'
          import json
          x=json.load(open('output/p6r2_real_game_root_preference.json'))
          assert x['pair']==['f4c7','f4h6'] and x['strict_rival_support_worlds']==1
          assert x['source_cohort_total_groups']==16
          assert x['reason_certificates']==[] and not x['explanation_authority']
          print('P6R2_NATURAL_COHORT_AUTHORITY_HOLD')
          PY
      - name: Preserve exact precommit code and source proof
        if: always()
        run: |
          mkdir -p output
          cp harness/c3x_013_p6r2_natural_game_root_pair.py output/p6r2_engine_code.py
          cp c3x/ontology/c3x-013-p6r2-natural-birth-preference-precommit.md output/p6r2_precommit.md
          sha256sum output/* > output/integrity_sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-013-p6r2-real-game-birth-preference
          path: output/
          if-no-files-found: error
