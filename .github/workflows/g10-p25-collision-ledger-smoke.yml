name: c3x-g10-p25-collision-ledger-smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/g10-p25-collision-ledger-smoke.yml'
      - 'tools/g10_p25_collision_ledger.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify three-tier authority firewall
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          from g10_p25_collision_ledger import audit
          a={"source_id":"A","canonical_fen_hashes":["same","old","uniqueA"]}
          b={"source_id":"B","canonical_fen_hashes":["same","uniqueB"]}
          z=audit([a,b],{"old"})
          assert z["historical_fen_collision_count"]==1
          assert z["cross_source_fen_collision_count"]==1
          assert z["cross_source_fen_owners"]=={"same":["A","B"]}
          assert z["tier_T"]=="NOT_MEASURED"
          assert z["tier_W"]=="NOT_MEASURED"
          assert z["verdict"]=="AUDIT_ONLY_NO_SOURCE_PRESEAL"
          assert z["activation_outcomes_opened"] is False
          print("PASS_P25_FEN_COLLISION_LEDGER")
          PY
