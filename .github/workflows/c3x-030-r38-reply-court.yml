name: C3X 0.30 R38 independent all-reply receipt re-audit

on:
  pull_request:
    paths:
      - ".github/workflows/c3x-030-r38-reply-court.yml"
      - "harness/c3x_030_r38_reply_court.py"
      - "tests/test_c3x_030_r38_reply_court.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-native-json-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fixed legal chess parser
        run: python -m pip install -q chess==1.11.2
      - name: Download original R37 successful native research artifact (read only)
        uses: actions/download-artifact@v4
        with:
          name: c3x030-r37-third-winner-exhaustive-berserk-board-only
          repository: WhoSia/C3X
          run-id: "44866204367"
          path: r37/
          github-token: ${{ github.token }}
      - name: Recheck original untouched derived native JSON SHA
        run: |
          echo '0fa5eadedbdff69b692f1d5d713a4a7649f90f57bfb480eb5f738eccb4bd4fcd  r37/C3X_030_R37_R30_017_EXHAUSTIVE_BOARD_ONLY_BERSERK.json' | sha256sum -c -
      - name: Test full native leaf replay identity, legality, scope and mutations
        env:
          PYTHONPATH: harness
          C3X_R37_ZIP: r37/C3X_030_R37_R30_017_EXHAUSTIVE_BOARD_ONLY_BERSERK.json
        run: python -m unittest -v tests.test_c3x_030_r38_reply_court
      - name: Recompute all 540 native observations from original results
        env:
          PYTHONPATH: harness
        run: |
          mkdir -p public
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from c3x_030_r38_reply_court import verify
          path=Path('r37/C3X_030_R37_R30_017_EXHAUSTIVE_BOARD_ONLY_BERSERK.json')
          result=verify(json.loads(path.read_bytes()))
          result['source_original_R37_json_sha256']=hashlib.sha256(path.read_bytes()).hexdigest()
          out=Path('public/C3X_030_R38_R37_FULL_REPLY_VERIFICATION.json')
          out.write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          print('R38_RECOMPUTED', json.dumps(result,sort_keys=True))
          PY
          sha256sum public/C3X_030_R38_R37_FULL_REPLY_VERIFICATION.json
      - name: Upload derived court evidence, not new native search claims
        uses: actions/upload-artifact@v4
        with:
          name: c3x030-r38-r37-frozen-native-json-all-leaf-audit
          path: public/
          if-no-files-found: error
