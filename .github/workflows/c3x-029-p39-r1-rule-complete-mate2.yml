name: C3X P39 R1 Rule-Complete Mate-by-Second-Turn Certificate Court
on:
  push:
    paths:
      - '.github/workflows/c3x-029-p39-r1-rule-complete-mate2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legal-source-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned chess-law library only (no chess engine)
        run: python -m pip install -q chess==1.11.2
      - name: Verify exact certificate / counterexample synthetic cases
        run: |
          set -euo pipefail
          python -m unittest discover -s tools -p 'test_c3x_029_p39_r1_exact_mate2_legal_certificate.py' -v
      - name: Recover original eight-event source
        uses: actions/download-artifact@v4
        with:
          name: c3x-p37-r1-oct-eight-distinct-events-original-pgn-and-engine-blind-freeze
          repository: WhoSia/C3X
          run-id: '41968008046'
          path: source
          github-token: ${{ github.token }}
      - name: Recover P37 prediction archive sealed before reference
        uses: actions/download-artifact@v4
        with:
          name: c3x-p37-r2-pre-referee-eight-event-three-rival-predictions
          repository: WhoSia/C3X
          run-id: '41969173637'
          path: prediction
          github-token: ${{ github.token }}
      - name: Compute exhaustive chess-law verdicts only for all 16 original worlds
        run: |
          set -euo pipefail
          mkdir -p output
          python -u tools/c3x_029_p39_r1_exact_mate2_legal_certificate.py \
            --source-member source/P37_R1_8_EVENT_8_GAME_SOURCE_ONLY_MANIFEST.json \
            --prediction-member prediction/P37_R2_THREE_RIVAL_PRE_REFERENCE_PREDICTIONS.json \
            --out output/P39_R1_QM2_16_FROZEN_WORLDS.json \
            | tee output/P39_R1_STDOUT.log
          grep -q P39_R1_CHESS_LAW_COMPLETE_QM2_DIAGNOSTIC_NOT_HELDOUT output/P39_R1_STDOUT.log
      - name: Record immutable per-member hashes; never modify repository
        if: always()
        run: |
          mkdir -p output
          find output -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > output/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-p39-r1-exact-rule-checked-mate2-16-world-certificate-court
          path: output/
          retention-days: 90
          if-no-files-found: error
