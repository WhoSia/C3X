name: C3X 0.18 Five-Source W2 V WV Factorial
on:
  push:
    paths:
      - 'harness/c3x_018_WV_joint_five_source_worlds.py'
      - '.github/workflows/c3x-018-WV-five-worlds.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  five-world-joint-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source Python syntax
        run: python -m py_compile harness/c3x_018_WV_joint_five_source_worlds.py
      - name: Original 12-world P4 native reference
        uses: actions/download-artifact@v4
        with:
          name: c3x-016-P4-12-Lichess-root-order-72-native
          path: baseline/
          repository: WhoSia/C3X
          run-id: '37948775813'
          github-token: ${{ github.token }}
      - name: Compile frozen SF16 with whole write and TT V joint source operators
        run: |
          set -euo pipefail
          mkdir -p evidence
          root=/tmp/C3X018_WV_FIVE_WORLDS
          git clone -q --single-branch --branch sf_16 https://github.com/official-stockfish/Stockfish.git "$root"
          test "$(git -C "$root" rev-parse HEAD)" = 68e1e9b3811e16cad014b590d7443b9063b3eb52
          python tools/c3x_016_P4_independent_12root_source_order_patch.py --source "$root" --out-manifest evidence/P4.json
          python tools/c3x_018_physical_epoch_lineage_patch.py --source "$root" --out-manifest evidence/TT_EPOCH.json
          python tools/c3x_018_tt_eval_consumption_overlay.py --source "$root" --out-manifest evidence/V.json
          python tools/c3x_018_writer_eval_override_interaction_overlay.py --source "$root" --out-manifest evidence/WV.json
          git -C "$root" diff -- src/search.cpp src/tt.cpp src/tt.h > evidence/SOURCE_DIFF.patch
          make -s -C "$root/src" -j2 build ARCH=x86-64
          sha256sum "$root/src/stockfish" > evidence/BINARY_SHA256.txt
      - name: Five selected native original source response surfaces W V WV
        run: |
          set -euo pipefail
          python -u harness/c3x_018_WV_joint_five_source_worlds.py \
            --cohort c3x/cohorts/c3x-016-P4-12-independent-Lichess-legal-root-order-sourceonly-frozen.json \
            --prior baseline/C3X016_P4_12_LICHESS_MULTIMOTIF_ROOT_ORDER_72_NATIVE.json \
            --engine /tmp/C3X018_WV_FIVE_WORLDS/src/stockfish \
            --out evidence/FIVE_SOURCE_W2_V_WV_NATIVE.json | tee evidence/NATIVE_STDOUT.txt
          python - <<'PY'
          import json
          j=json.load(open('evidence/FIVE_SOURCE_W2_V_WV_NATIVE.json'))
          assert [c["id"] for c in j["cases"]]==[1,2,5,6,8]
          assert j["summary"]["n"]==5
          print("C3X018_WV_FIVE_SOURCE_NATIVE_COMPLETE_PASS")
          PY
      - name: SHA256 source and result files
        if: always()
        run: |
          mkdir -p evidence
          find evidence -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > evidence/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-018-WV-five-source-native-court
          path: evidence/
          retention-days: 90
          if-no-files-found: error
