name: C3X 0.18 Case1 Draw Predicate Witness
on:
  push:
    paths:
      - 'tools/c3x_018_case1_true_draw_branch_observer.py'
      - 'harness/c3x_018_case1_true_draw_branch_native.py'
      - '.github/workflows/c3x-018-case1-draw-predicates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  case1-true-draw:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source tests and game history rules
        run: |
          python -m pip install -q chess==1.11.2
          python -m py_compile tools/c3x_018_case1_true_draw_branch_observer.py
          python -m py_compile harness/c3x_018_case1_true_draw_branch_native.py
      - name: Engine-blind October game source
        uses: actions/download-artifact@v4
        with:
          name: c3x-018-independent-PGN-blind-source-16
          path: source/
          repository: WhoSia/C3X
          run-id: '37981820261'
          github-token: ${{ github.token }}
      - name: Historic full actual chess move prefix native results
        uses: actions/download-artifact@v4
        with:
          name: c3x-018-real-game-history-vs-FEN-source
          path: history/
          repository: WhoSia/C3X
          run-id: '37983641417'
          github-token: ${{ github.token }}
      - name: Stockfish16 frozen TT and draw source compile
        run: |
          set -euo pipefail
          mkdir -p evidence
          root=/tmp/C3X018_TRUE_DRAW
          git clone -q --single-branch --branch sf_16 https://github.com/official-stockfish/Stockfish.git "$root"
          test "$(git -C "$root" rev-parse HEAD)" = 68e1e9b3811e16cad014b590d7443b9063b3eb52
          python tools/c3x_016_P4_independent_12root_source_order_patch.py --source "$root" --out-manifest evidence/P4.json
          python tools/c3x_017_early_depth1_root_window_trace_patch.py --source "$root" --out-manifest evidence/ROOT.json
          python tools/c3x_018_trial_call_identity_patch.py --source "$root" --out-manifest evidence/TRIAL.json
          python tools/c3x_018_physical_epoch_lineage_patch.py --source "$root" --out-manifest evidence/EPOCH.json
          python tools/c3x_018_root_TT_genealogy_overlay.py --source "$root" --out-manifest evidence/ROOT_TT.json
          python tools/c3x_018_case1_true_draw_branch_observer.py --source "$root" --out-manifest evidence/DRAW_SOURCE.json
          git -C "$root" diff -- src/ > evidence/SOURCE_DIFF.patch
          make -s -C "$root/src" -j2 build ARCH=x86-64
          sha256sum "$root/src/stockfish" > evidence/BINARY_SHA256.txt
      - name: Native actual draw predicate and first root divergence in same case
        run: |
          set -euo pipefail
          python -u harness/c3x_018_case1_true_draw_branch_native.py \
            --cohort source/C3X018_INDEPENDENT_BLIND16_PGN_SOURCE.json \
            --prior-history history/ORIGINAL_GAME_HISTORY_VS_FEN_16_NATIVE.json \
            --engine /tmp/C3X018_TRUE_DRAW/src/stockfish \
            --out evidence/CASE1_TRUE_DRAW_HISTORY_SOURCE.json | tee evidence/NATIVE_STDOUT.txt
      - name: Source and event digest
        if: always()
        run: |
          mkdir -p evidence
          find evidence -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > evidence/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-018-case1-true-draw-history-native
          path: evidence/
          retention-days: 90
          if-no-files-found: error
