name: C3X 027 Native SEE Differential Reverse Engineering
on:
  push:
    branches: [main]
    paths:
      - 'tools/c3x_027_native_see_uci_oracle_patch.py'
      - 'tools/c3x_027_see_random_differential.py'
      - '.github/workflows/c3x-027-see-native-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install python-chess==1.999
      - name: Pinned original Stockfish16 native comparator
        run: |
          set -euo pipefail
          git clone -q https://github.com/official-stockfish/Stockfish.git /tmp/c3x027_sf
          git -C /tmp/c3x027_sf checkout -q 68e1e9b3811e16cad014b590d7443b9063b3eb52
          python tools/c3x_027_native_see_uci_oracle_patch.py --source /tmp/c3x027_sf --out-manifest C3X027_NATIVE_SEE_ORACLE_MANIFEST.json
          make -s -C /tmp/c3x027_sf/src -j2 build ARCH=x86-64
      - name: Independent SEE Boolean differential
        run: python tools/c3x_027_see_random_differential.py /tmp/c3x027_sf/src/stockfish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x027-see-differential
          path: |
            C3X_027_SEE_DIFFERENTIAL.json
            C3X027_NATIVE_SEE_ORACLE_MANIFEST.json
          if-no-files-found: warn
