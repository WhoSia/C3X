name: p15-selective-tt-factorial

on:
  workflow_dispatch:
  push:
    paths:
      - "c3x/protocol/p15-preseal.json"
      - "compiler/exact_world/p15_compile.py"
      - "harness/p15_factorial.py"

permissions:
  contents: read

jobs:
  stage_a:
    name: Stage A — fresh exact-world constitution
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic chess state library
        run: python3 -m pip install --disable-pip-version-check chess==1.11.2
      - name: Materialize P15-only exact worlds
        run: |
          mkdir -p out
          python3 compiler/exact_world/p15_compile.py \
            --out out/p15-stage-a.json \
            --target-count 40 \
            --max-generated 640
          sha256sum out/p15-stage-a.json | tee out/p15-stage-a-file-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p15-stage-a-fresh-worlds
          path: out/
          retention-days: 30

  sham_precommit:
    name: Stage B — selective instrument preflight and SHAM precommit
    needs: stage_a
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p15-stage-a-fresh-worlds
          path: stage-a

      - name: Clone exact upstream targets
        run: |
          git clone https://github.com/official-stockfish/Stockfish.git sf-frozen
          git -C sf-frozen checkout --detach 5062aee519a1ba262d472d8ab139851ced56573e
          test "$(git -C sf-frozen rev-parse HEAD)" = "5062aee519a1ba262d472d8ab139851ced56573e"
          git clone https://github.com/official-stockfish/Stockfish.git sf19
          git -C sf19 checkout --detach edb0d9db6731067ec50ce619ff372b463bc4dd5d
          test "$(git -C sf19 rev-parse HEAD)" = "edb0d9db6731067ec50ce619ff372b463bc4dd5d"

      - name: Build clean baselines
        run: |
          make -C sf-frozen/src -j2 build ARCH=x86-64
          cp sf-frozen/src/stockfish /tmp/sf-frozen-clean
          make -C sf19/src -j2 build ARCH=x86-64
          cp sf19/src/stockfish /tmp/sf19-clean

      - name: Materialize P15 selective-mask semantics
        run: |
          python3 tools/materialize_p15.py --stockfish sf-frozen --target frozen_20260810
          python3 tools/materialize_p15.py --stockfish sf19 --target stockfish_19

      - name: Build dual-target P15 binaries
        run: |
          make -C sf-frozen/src clean
          make -C sf-frozen/src -j2 build ARCH=x86-64
          make -C sf19/src clean
          make -C sf19/src -j2 build ARCH=x86-64
          mkdir -p out
          cp sf-frozen/src/stockfish out/c3x-p15-frozen
          cp sf19/src/stockfish out/c3x-p15-sf19
          sha256sum out/c3x-p15-frozen out/c3x-p15-sf19 | tee out/binary-sha256.txt

      - name: Recheck baseline NATIVE=SHAM noninterference
        run: |
          python3 harness/uci_smoke.py out/c3x-p15-frozen | tee out/frozen-uci-smoke.txt
          python3 harness/native_sham_identity.py --baseline /tmp/sf-frozen-clean --patched out/c3x-p15-frozen --nodes 30000 | tee out/frozen-native-sham.txt
          python3 harness/uci_smoke.py out/c3x-p15-sf19 | tee out/sf19-uci-smoke.txt
          python3 harness/native_sham_identity.py --baseline /tmp/sf19-clean --patched out/c3x-p15-sf19 --nodes 30000 | tee out/sf19-native-sham.txt

      - name: Verify MASK_ALL equals legacy MASKED semantics
        run: |
          python3 harness/p15_factorial.py preflight \
            --binary frozen_20260810=out/c3x-p15-frozen \
            --binary stockfish_19=out/c3x-p15-sf19 \
            --nodes 30000 | tee out/full-mask-equivalence.txt

      - name: SHAM-only dual-target engagement and prospective tranche commit
        run: |
          python3 harness/p15_factorial.py sham-commit \
            --stage-a stage-a/p15-stage-a.json \
            --binary frozen_20260810=out/c3x-p15-frozen \
            --binary stockfish_19=out/c3x-p15-sf19 \
            --nodes 300000 \
            --out out/p15-sham-precommit.json
          sha256sum out/p15-sham-precommit.json | tee out/p15-sham-precommit-file-sha256.txt

      - name: Seal pre-selective-mask artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p15-sham-precommit-sealed
          path: out/
          retention-days: 30

  factorial:
    name: Stage C — 2x2x2 selective TT-read factorial
    needs: sham_precommit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p15-sham-precommit-sealed
          path: sealed

      - name: Verify prospective factorial commit and binary identities
        run: |
          test -s sealed/p15-sham-precommit.json
          test -s sealed/c3x-p15-frozen
          test -s sealed/c3x-p15-sf19
          chmod +x sealed/c3x-p15-frozen sealed/c3x-p15-sf19
          python3 - <<'PY'
          import json
          p=json.load(open("sealed/p15-sham-precommit.json"))
          assert p["selective_mask_outcomes_consulted"] is False
          assert p["authorization"]=="P15-FACTORIAL-READY"
          assert set(p["arms"])=={"000","100","010","001","110","101","011","111"}
          print("P15_PRECOMMIT_VERIFIED",p["precommit_sha256"])
          PY

      - name: Open all seven selective masks on committed fresh cells
        run: |
          mkdir -p result
          python3 harness/p15_factorial.py factorial-run \
            --precommit sealed/p15-sham-precommit.json \
            --binary frozen_20260810=sealed/c3x-p15-frozen \
            --binary stockfish_19=sealed/c3x-p15-sf19 \
            --nodes 300000 \
            --out result/p15-factorial-result.json
          sha256sum result/p15-factorial-result.json | tee result/p15-factorial-result-file-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: p15-selective-factorial-result
          path: result/
          retention-days: 30
