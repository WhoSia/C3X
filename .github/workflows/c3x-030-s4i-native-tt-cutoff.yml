name: C3X 0.30 S4I Native TT Early Cutoff Development Diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c3x-030-s4i-native-tt-cutoff.yml'
      - 'harness/c3x_030_s4i_tt_early_cutoff_patch.py'
      - 'harness/test_c3x_030_s4i_tt_early_cutoff_patch.py'
      - 'harness/c3x_030_s4i_tt_early_cutoff_court.py'
      - 'harness/test_c3x_030_s4i_tt_early_cutoff_court.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-development-tt-cutoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin chess validator and run contract tests
        run: |
          set -euo pipefail
          python -m pip install -q chess==1.11.2
          PYTHONPATH=harness python -m unittest -v \
            test_c3x_030_s4i_tt_early_cutoff_patch \
            test_c3x_030_s4i_tt_early_cutoff_court
      - name: Recover exact S4H2 archived development R2 and original frozen protocol
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prior/r2 prior/protocol public
          gh run download 43349835109 -R WhoSia/C3X -n c3x030-s4h2-development-native-samebin-paired-dose -D prior/r2
          gh run download 43347740057 -R WhoSia/C3X -n c3x030-s4h2-preoutcome-frozen-design -D prior/protocol
          sha256sum prior/r2/S4H2_DEVELOPMENT_PAIRED_NATIVE_RESULT.json prior/protocol/S4H2_PREOUTCOME_PROTOCOL.json > public/PRIOR_RAW_SHA256.txt
      - name: Compile original and read-only TT early cutoff modified source
        run: |
          set -euo pipefail
          git clone -q https://github.com/official-stockfish/Stockfish.git /tmp/c3x-s4i-upstream
          git -C /tmp/c3x-s4i-upstream checkout -q 68e1e9b3811e16cad014b590d7443b9063b3eb52
          test "$(git -C /tmp/c3x-s4i-upstream rev-parse HEAD)" = 68e1e9b3811e16cad014b590d7443b9063b3eb52
          make -s -C /tmp/c3x-s4i-upstream/src -j2 build ARCH=x86-64
          cp /tmp/c3x-s4i-upstream/src/stockfish /tmp/c3x-s4i-original
          cp -a /tmp/c3x-s4i-upstream /tmp/c3x-s4i-modified
          python harness/c3x_030_s4i_tt_early_cutoff_patch.py \
            --source /tmp/c3x-s4i-upstream/src/search.cpp \
            --out /tmp/c3x-s4i-modified/src/search.cpp
          make -s -C /tmp/c3x-s4i-modified/src -j2 build ARCH=x86-64
          sha256sum /tmp/c3x-s4i-upstream/src/search.cpp /tmp/c3x-s4i-modified/src/search.cpp /tmp/c3x-s4i-original /tmp/c3x-s4i-modified/src/stockfish > public/SOURCE_BINARY_SHA256.txt
      - name: Execute original-sham-two-hit paired source TT cutoff diagnosis on development ONLY
        run: |
          set -euo pipefail
          PYTHONPATH=harness python -u harness/c3x_030_s4i_tt_early_cutoff_court.py \
            --protocol prior/protocol/S4H2_PREOUTCOME_PROTOCOL.json \
            --r2 prior/r2/S4H2_DEVELOPMENT_PAIRED_NATIVE_RESULT.json \
            --baseline /tmp/c3x-s4i-original \
            --modified /tmp/c3x-s4i-modified/src/stockfish \
            --out public/S4I_NATIVE_DEVELOPMENT_TT_CUTOFF.json
          sha256sum public/S4I_NATIVE_DEVELOPMENT_TT_CUTOFF.json > public/RESULT_SHA256.txt
      - name: Explicit conservative research scope
        if: always()
        run: |
          mkdir -p public
          echo 'R2 development keys and the old preregistered protocol were consumed without reselecting on results. Stockfish source instrumented only true TT short-circuit return values for a bounded target-ply1 sample. Fresh 48 searches planned, not full-tree causality. Control noninterference is a required gate. No new holdout search, no paper superiority. GitHub Actions bot never commits.' > public/SCOPE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x030-s4i-native-tt-early-cutoff-development-diagnostic
          path: public/*
          if-no-files-found: error
          retention-days: 90
