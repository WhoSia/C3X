name: p26-post-adjudication-exact-resume-seal
on:
  push:
    paths:
      - ".github/workflows/p26-seal.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CANONICAL_RUN: 36153015935
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p26-canonical-precommit
          path: pre
          repository: WhoSia/C3X
          run-id: ${{ env.CANONICAL_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: p26-slice-*
          path: slices
          repository: WhoSia/C3X
          run-id: ${{ env.CANONICAL_RUN }}
          github-token: ${{ github.token }}
      - name: Reconstruct identical deterministic adjudication
        run: |
          python3 harness/p26_parallel.py merge --results slices --out-dir merged
          python3 harness/p26_product_field.py adjudicate --precommit pre/atlas/p26-precommit.json --results merged --out p26-adjudication.json
      - name: Independent JavaScript semantic verification
        run: |
          node tools/p26-verify.mjs pre/atlas/p26-precommit.json p26-adjudication.json p26-report.md
          cat p26-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: p26-final-sealed
          path: |
            p26-adjudication.json
            p26-report.md
          retention-days: 30
