name: c3x-g10-p25-hash-inventory-smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/g10-p25-hash-inventory-smoke.yml'
      - 'tools/g10_p25_hash_inventory.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check python-chess==1.999
      - name: Verify legacy canonical-FEN and candidate-window semantics
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import hashlib, io, tempfile, pathlib
          import chess, chess.pgn
          from g10_p25_hash_inventory import audit
          from g10_p19_source_census import canonical_fen
          board=chess.Board()
          game=chess.pgn.Game()
          node=game
          for san in ("e4","e5","Nf3","Nc6","Bb5","a6","Ba4","Nf6","O-O","Be7","Re1","b5","Bb3"):
              mv=board.parse_san(san)
              node=node.add_variation(mv)
              board.push(mv)
          with tempfile.TemporaryDirectory() as d:
              p=pathlib.Path(d)/"sample.pgn"
              p.write_text(str(game)+"\n")
              row=audit(p)
              expected=hashlib.sha256(canonical_fen(board).encode()).hexdigest()
              assert row["ply_range"]==[12,160]
              assert expected in row["canonical_fen_hashes"]
              assert len(row["canonical_fen_hashes"])==2
              print("PASS_P25_LEGACY_HASH_INVENTORY_WINDOW")
          PY
