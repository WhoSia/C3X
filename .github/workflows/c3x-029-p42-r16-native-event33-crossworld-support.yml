name: C3X P42-R16 original event33 dynamic crossworld source-support audit (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c3x-029-p42-r16-native-event33-crossworld-support.yml'
      - 'harness/c3x_029_p42_r16_original_event33_crossworld_source_support.py'
      - 'harness/test_c3x_029_p42_r16_original_event33_crossworld_source_support.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-game14-event33-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Orthodoxy chess legal source dependency
        run: python -m pip install chess==1.11.2
      - name: Strict source surgery and court regression
        run: |
          python -m py_compile tools/c3x_029_p42_r8_guard_descendant_tt_save_intervention.py tools/c3x_029_p42_r8_derived_native_build.py harness/c3x_029_p42_r8_same_engine_tt_save_causal_court.py
          PYTHONPATH=tools python -m unittest -v test_c3x_029_p42_r8_target_tt_write_intervention
          PYTHONPATH=harness python -m unittest -v test_c3x_029_p42_r8_same_engine_tt_save_causal_court
          python -m py_compile tools/c3x_029_p42_r9_original_value_draw_node_parity_intervention.py tools/c3x_029_p42_r9_derived_original_draw_build.py harness/c3x_029_p42_r9_native_value_draw_court.py
          PYTHONPATH=tools python -m unittest -v test_c3x_029_p42_r9_original_value_draw_node_parity_intervention
          PYTHONPATH=harness python -m unittest -v test_c3x_029_p42_r9_native_value_draw_court
          python -m py_compile harness/c3x_029_p42_r9_original_AB_neutralized_source_probe.py harness/test_c3x_029_p42_r9_original_AB_neutralized_source_probe.py
          PYTHONPATH=harness python -m unittest -v test_c3x_029_p42_r9_original_AB_neutralized_source_probe
          python -m py_compile tools/c3x_029_p42_r10_source_site_specific_draw_parity_overlay.py tools/c3x_029_p42_r10_original_site_draw_build.py harness/c3x_029_p42_r10_native_original_AB_draw_site_court.py
          PYTHONPATH=tools python -m unittest -v test_c3x_029_p42_r10_source_site_specific_draw_parity_overlay
          PYTHONPATH=harness python -m unittest -v test_c3x_029_p42_r10_native_original_AB_draw_site_court
          python -m py_compile tools/c3x_029_p42_r11_original_cycle_window_event_overlay.py tools/c3x_029_p42_r11_derived_native_cycle_window_build.py harness/c3x_029_p42_r11_native_cycle_alpha_window_court.py
          PYTHONPATH=tools python -m unittest -v test_c3x_029_p42_r11_original_cycle_window_event_overlay
          PYTHONPATH=harness python -m unittest -v test_c3x_029_p42_r11_native_cycle_alpha_window_court
          python -m py_compile tools/c3x_029_p42_r12_single_cycle_event_intervention.py tools/c3x_029_p42_r12_derived_original_single_cycle_build.py harness/c3x_029_p42_r12_native_single_cycle_event_court.py
          PYTHONPATH=tools python -m unittest -v test_c3x_029_p42_r12_single_cycle_event_intervention
          PYTHONPATH=harness python -m unittest -v test_c3x_029_p42_r12_native_single_cycle_event_court
          python -m py_compile harness/c3x_029_p42_r13_native_single_cycle_to_root_boundary_court.py
          PYTHONPATH=tools:harness python -m unittest -v test_c3x_029_p42_r13_native_single_cycle_to_root_boundary_court
          python -m py_compile harness/c3x_029_p42_r14_original_guard_vs_event33_same_engine_court.py
          PYTHONPATH=tools:harness python -m unittest -v test_c3x_029_p42_r14_original_guard_vs_event33_same_engine_court
          python -m py_compile harness/c3x_029_p42_r15_original_guard_plus_event33_interaction_court.py
          PYTHONPATH=tools:harness python -m unittest -v test_c3x_029_p42_r15_original_guard_plus_event33_interaction_court
          python -m py_compile harness/c3x_029_p42_r16_original_event33_crossworld_source_support.py
          PYTHONPATH=tools:harness python -m unittest -v test_c3x_029_p42_r16_original_event33_crossworld_source_support
      - uses: actions/download-artifact@v4
        with:
          name: c3x027-sept2026-preengine-source-only16
          path: source/
          repository: WhoSia/C3X
          run-id: '39348434657'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: c3x027-sept-stageA-before-native-TT-treatment
          path: forecast/
          repository: WhoSia/C3X
          run-id: '39351313113'
          github-token: ${{ github.token }}
      - name: Build original source and passive original value_draw node-parity intervention
        run: |
          set -euo pipefail
          mkdir -p evidence private public
          python tools/c3x_029_p42_r12_derived_original_single_cycle_build.py
      - name: Reproduce immutable native untreated 16-case StageA
        run: |
          set -euo pipefail
          PYTHONPATH=harness python harness/c3x_027_sept_source_staged_unintervened.py \
            --source source/C3X_027_SEPT2026_NEW_SOURCE16.json \
            --engine /tmp/C3X020_MULTI_STATE/src/stockfish \
            --out private/C3X027_SEPT_STAGEA_FULL_PRIVATE.json \
            --public private/C3X027_REBUILT_STAGEA_PUBLIC.json
          test "$(sha256sum private/C3X027_SEPT_STAGEA_FULL_PRIVATE.json | awk '{print $1}')" = b0eb51ab779609db346c75d65a6a65fd31efc9a648111d042cfec5199a4afde1
          test "$(sha256sum private/C3X027_REBUILT_STAGEA_PUBLIC.json | awk '{print $1}')" = 4572edd4c0761c3875aed421b08880ff142c21f691fe940c7c6d760dbb397be5
      - name: Frozen source target four-arm ABC plus descendant-TT-write D
        run: |
          set -euo pipefail
          PYTHONPATH=tools:harness python -u harness/c3x_029_p42_r16_original_event33_crossworld_source_support.py \
            --source source/C3X_027_SEPT2026_NEW_SOURCE16.json \
            --stagea private/C3X027_SEPT_STAGEA_FULL_PRIVATE.json \
            --forecast forecast/C3X027_SEPT_PRE_TT_FORECAST.json \
            --engine /tmp/C3X020_MULTI_STATE/src/stockfish \
            --private private/R16-event33-crossworld \
            --public-out public/C3X042_R16_ORIGINAL_EVENT33_CROSSWORLD_SOURCE_SUPPORT.json
      - name: Attribution and data rights safety check
        if: always()
        run: |
          set -euo pipefail
          mkdir -p public
          shopt -s nullglob
          for f in public/*.json; do
            python tools/c3x_023_rights_preupload_gate.py \
              --tier P2_AGGREGATE_SUMMARY --file "$f" \
              --report "public/RIGHTS_$(basename "$f")"
          done
          echo 'Adapted 2026-09 Lichess broadcast CC BY-SA 4.0; source https://database.lichess.org/broadcast/lichess_db_broadcast_2026-09.pgn.zst. No original PGN, private TT events, source hash keys or modified GPL binary distributed.' > public/SOURCE_LICENSE_NOTICE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x042-p42-r16-native-event33-support-aggregate-only
          path: |
            public/C3X042_R16_ORIGINAL_EVENT33_CROSSWORLD_SOURCE_SUPPORT.json
            public/SOURCE_LICENSE_NOTICE.txt
          if-no-files-found: warn
