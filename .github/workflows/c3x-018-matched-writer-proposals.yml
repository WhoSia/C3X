name: C3X 0.18 Matched TT Writer Proposal W P
on:
  push:
    paths:
      - 'tools/c3x_018_writer_contact_fingerprint_overlay.py'
      - 'harness/c3x_018_matched_writer_proposal_W_P_native.py'
      - '.github/workflows/c3x-018-matched-writer-proposals.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-source-writer-matching:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax preflight
        run: |
          python -m py_compile tools/c3x_018_writer_contact_fingerprint_overlay.py
          python -m py_compile harness/c3x_018_matched_writer_proposal_W_P_native.py
          python -m py_compile harness/c3x_018_native_TT_lineage_factorial_6_8.py
      - name: Freeze historical native baseline
        uses: actions/download-artifact@v4
        with:
          name: c3x-016-P4-12-Lichess-root-order-72-native
          path: baseline/
          repository: WhoSia/C3X
          run-id: '37948775813'
          github-token: ${{ github.token }}
      - name: Compile original W plus fingerprint and payload-only P plus fingerprint
        run: |
          set -euo pipefail
          mkdir -p evidence
          for kind in W P; do
            root="/tmp/C3X018_MATCH_$kind"
            git clone -q --single-branch --branch sf_16 https://github.com/official-stockfish/Stockfish.git "$root"
            test "$(git -C "$root" rev-parse HEAD)" = 68e1e9b3811e16cad014b590d7443b9063b3eb52
            python tools/c3x_016_P4_independent_12root_source_order_patch.py --source "$root" --out-manifest "evidence/P4_$kind.json"
            python tools/c3x_018_physical_epoch_lineage_patch.py --source "$root" --out-manifest "evidence/EPOCH_$kind.json"
            if [[ "$kind" == P ]]; then
              python tools/c3x_018_payload_only_surgical_source_patch.py --source "$root" --out-manifest evidence/PAYLOAD_ONLY.json
            fi
            python tools/c3x_018_writer_contact_fingerprint_overlay.py --source "$root" --out-manifest "evidence/FP_$kind.json"
            git -C "$root" diff -- src/search.cpp src/tt.cpp src/tt.h > "evidence/SOURCE_$kind.patch"
            make -s -C "$root/src" -j2 build ARCH=x86-64
            cp "$root/src/stockfish" "/tmp/C3X018_MATCH_ENGINE_$kind"
          done
          sha256sum /tmp/C3X018_MATCH_ENGINE_W /tmp/C3X018_MATCH_ENGINE_P > evidence/BINARY_SHA256.txt
      - name: Cold-native exact writer proposal alignment on focal worlds
        run: |
          set -euo pipefail
          python -u harness/c3x_018_matched_writer_proposal_W_P_native.py \
            --cohort c3x/cohorts/c3x-016-P4-12-independent-Lichess-legal-root-order-sourceonly-frozen.json \
            --prior baseline/C3X016_P4_12_LICHESS_MULTIMOTIF_ROOT_ORDER_72_NATIVE.json \
            --whole-engine /tmp/C3X018_MATCH_ENGINE_W \
            --payload-engine /tmp/C3X018_MATCH_ENGINE_P \
            --out evidence/MATCHED_WRITER_PROPOSALS_W_P.json | tee evidence/NATIVE_STDOUT.txt
          python - <<'PY'
          import json
          j=json.load(open('evidence/MATCHED_WRITER_PROPOSALS_W_P.json'))
          assert [c['id'] for c in j['cases']]==[6,8]
          assert len(j['cases'][0]['comparisons'])==4 and len(j['cases'][1]['comparisons'])==2
          assert all(k['alignment']['prefix_matched']>=0 for c in j['cases'] for k in c['comparisons'])
          print('C3X018_MATCHED_WRITER_FINGERPRINT_NATIVE_PASS')
          PY
      - name: SHA256
        if: always()
        run: |
          mkdir -p evidence
          find evidence -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 -r sha256sum > evidence/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-018-matched-writer-proposals-W-P
          path: evidence/
          retention-days: 90
          if-no-files-found: error
