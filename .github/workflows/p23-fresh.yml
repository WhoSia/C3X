name: p23-fresh-prospective-quotient-closure
on:
  push:
    paths:
      - ".github/workflows/p23-fresh.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  INSTRUMENT_RUN: 36041727983
jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        family: [KQQvKQ,KQRvKQ,KQQvKR,KQRvKR,KRBvKB,KRNvKB,KRBvKN,KRNvKN]
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check chess==1.11.2
      - run: |
          mkdir -p out
          python3 compiler/exact_world/p23_core_compile.py --material "${{ matrix.family }}" --target-per-vertex 48 --max-generated-per-vertex 1400 --out "out/p23-core-${{ matrix.family }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: p23-world-${{ matrix.family }}
          path: out/
          retention-days: 30
  merge:
    needs: world
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: p23-world-*
          path: parts
      - run: python3 compiler/exact_world/p23_merge.py --parts parts --out p23-core-pool.json
      - uses: actions/upload-artifact@v4
        with:
          name: p23-core-pool
          path: p23-core-pool.json
          retention-days: 30
  census:
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        family: [KQQvKQ,KQRvKQ,KQQvKR,KQRvKR,KRBvKB,KRNvKB,KRBvKN,KRNvKN]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p23-core-pool
          path: stage
      - uses: actions/download-artifact@v4
        with:
          name: p21-instrument-packet
          path: instrument
          repository: WhoSia/C3X
          run-id: ${{ env.INSTRUMENT_RUN }}
          github-token: ${{ github.token }}
      - run: |
          chmod +x instrument/p20/packet/c3x-p20-* instrument/inanis/inanis-instrument
          mkdir -p out
          python3 harness/p23_fresh.py census --pool stage/p23-core-pool.json --engine stockfish_19,stockfish_uci,instrument/p20/packet/c3x-p20-sf19 --engine berserk,env,instrument/p20/packet/c3x-p20-berserk --engine ethereal,env,instrument/p20/packet/c3x-p20-ethereal --inanis instrument/inanis/inanis-instrument --family "${{ matrix.family }}" --nodes 80000 --out "out/p23-census-${{ matrix.family }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: p23-census-${{ matrix.family }}
          path: out/
          retention-days: 30
  preseal:
    needs: census
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: p23-census-*
          path: census
      - run: python3 harness/p23_fresh.py export --census-dir census --out p23-census.tsv
      - name: Frozen Rust balance selector
        run: |
          rustc -O matcher/p22_balance_matcher.rs -o p23_matcher
          ./p23_matcher p23-census.tsv p23-selected.txt p23-rust.json
      - name: Independent C++ certificate
        run: |
          g++ -O2 -std=c++17 analysis/p22_balance_cert.cpp -o p23_cert
          ./p23_cert p23-census.tsv p23-selected.txt p23-cpp.json
      - name: Independent R audit
        run: Rscript analysis/p22_balance_audit.R p23-census.tsv p23-selected.txt p23-r.json
      - name: Independent JavaScript cross-language seal
        run: node scripts/p22_verify_seal.js c3x/protocol/p22-preseal.json p23-rust.json p23-cpp.json p23-r.json > p23-cross.json
      - name: Freeze search-state quotient before selective outcomes
        run: python3 harness/p23_fresh.py seal --census-dir census --selected p23-selected.txt --rust-report p23-rust.json --cpp-cert p23-cpp.json --r-audit p23-r.json --cross-seal p23-cross.json --out p23-core-precommit.json
      - uses: actions/upload-artifact@v4
        with:
          name: p23-quotient-precommit
          path: |
            p23-census.tsv
            p23-selected.txt
            p23-rust.json
            p23-cpp.json
            p23-r.json
            p23-cross.json
            p23-core-precommit.json
          retention-days: 30
  vertex:
    needs: preseal
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        family: [KQQvKQ,KQRvKQ,KQQvKR,KQRvKR,KRBvKB,KRNvKB,KRBvKN,KRNvKN]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p23-quotient-precommit
          path: pre
      - uses: actions/download-artifact@v4
        with:
          name: p21-instrument-packet
          path: instrument
          repository: WhoSia/C3X
          run-id: ${{ env.INSTRUMENT_RUN }}
          github-token: ${{ github.token }}
      - run: |
          chmod +x instrument/p20/packet/c3x-p20-* instrument/inanis/inanis-instrument
          mkdir -p out
          python3 harness/p23_quotient.py vertex --precommit pre/p23-core-precommit.json --engine stockfish_19,stockfish_uci,instrument/p20/packet/c3x-p20-sf19 --engine berserk,env,instrument/p20/packet/c3x-p20-berserk --engine ethereal,env,instrument/p20/packet/c3x-p20-ethereal --inanis instrument/inanis/inanis-instrument --family "${{ matrix.family }}" --nodes 300000 --out "out/p23-core-${{ matrix.family }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: p23-vertex-${{ matrix.family }}
          path: out/
          retention-days: 30
  adjudicate:
    needs: vertex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p23-quotient-precommit
          path: pre
      - uses: actions/download-artifact@v4
        with:
          pattern: p23-vertex-*
          path: results
      - run: |
          python3 harness/p23_quotient.py adjudicate --precommit pre/p23-core-precommit.json --results results --out p23-adjudication.json
          cat p23-adjudication.json
      - uses: actions/upload-artifact@v4
        with:
          name: p23-final
          path: p23-adjudication.json
          retention-days: 30
