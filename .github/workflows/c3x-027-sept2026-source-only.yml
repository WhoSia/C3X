name: C3X 027 September source-only freeze before TT interventions
on:
  push:
    branches: [main]
    paths:
      - 'harness/c3x_027_sept2026_game_only_source_freeze.py'
      - '.github/workflows/c3x-027-sept2026-source-only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install chess==1.11.2 zstandard==0.25.0
      - name: Fetch original frozen May game hashes and positions
        uses: actions/download-artifact@v4
        with:
          name: c3x-023-P1-licensed-May-broadcast-CC0-nonmate32-engineblind-freeze
          path: prior-may/
          repository: WhoSia/C3X
          run-id: '38059784922'
          github-token: ${{ github.token }}
      - name: Fetch original frozen July64 game hashes and positions
        uses: actions/download-artifact@v4
        with:
          name: c3x-025-M6-S-july2026-new64-source-only
          path: prior-july/
          repository: WhoSia/C3X
          run-id: '38198224795'
          github-token: ${{ github.token }}
      - name: Download officially published September2026 broadcast source
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 600 \
            --output /tmp/lichess_db_broadcast_2026-09.pgn.zst \
            https://database.lichess.org/broadcast/lichess_db_broadcast_2026-09.pgn.zst
          sha256sum /tmp/lichess_db_broadcast_2026-09.pgn.zst
      - name: Select SHA-sealed source positions without any engine
        run: |
          set -euo pipefail
          PYTHONPATH=harness python harness/c3x_027_sept2026_game_only_source_freeze.py \
            --zst /tmp/lichess_db_broadcast_2026-09.pgn.zst \
            --may prior-may/C3X023_P1_MAY_BROADCAST_CC0_NONMATE32_SOURCE_ONLY.json \
            --july prior-july/C3X025_M6_S_JULY2026_64_SOURCE_ONLY.json \
            --out C3X_027_SEPT2026_NEW_SOURCE16.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x027-sept2026-preengine-source-only16
          path: C3X_027_SEPT2026_NEW_SOURCE16.json
          if-no-files-found: warn
          retention-days: 90
