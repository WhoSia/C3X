name: C3X 0.15 P0 TWIC Original Source-Only PIN and NONPIN Freeze
on:
  push:
    paths:
      - '.github/workflows/c3x-015-twic1665-source-freeze.yml'
      - 'harness/c3x_015_TWIC1665_scoreblind_original_source_freeze.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  p0-official-original-source-law-census:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Establish deterministic chess-law runtime without engine outcomes
        run: |
          python -m pip install --disable-pip-version-check chess==1.11.2
          python -m py_compile harness/c3x_015_TWIC1665_scoreblind_original_source_freeze.py
          mkdir -p input prior output
      - name: Acquire fresh provider TWIC 1665 original ZIP and verify format
        run: |
          curl -fLsS --retry 4 --retry-delay 4 --connect-timeout 25 --max-time 240 \
            'https://theweekinchess.com/zips/twic1665g.zip' -o input/TWIC1665_ORIGINAL.zip
          test "$(head -c 2 input/TWIC1665_ORIGINAL.zip)" = 'PK'
          sha256sum input/TWIC1665_ORIGINAL.zip | tee output/TWIC1665_ARCHIVE_RAW_SHA256.txt
          wc -c input/TWIC1665_ORIGINAL.zip | tee output/TWIC1665_ARCHIVE_ORIGINAL_BYTES.txt
      - name: Acquire immutable TCEC S28 and S29 historical source-only negative-overlap references
        run: |
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/TCEC-Chess/tcecgames/3dd69a40b3cf6ccc74144df7411ef4e8e2140286/master-archive/TCEC_Season_28_-_Superfinal.pgn' -o prior/TCEC_S28.pgn
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/TCEC-Chess/tcecgames/3dd69a40b3cf6ccc74144df7411ef4e8e2140286/master-archive/TCEC_Season_29_-_Superfinal.pgn' -o prior/TCEC_S29.pgn
          test "$(git hash-object prior/TCEC_S28.pgn)" = '9c702d0e8f646f65f28f1555652937d58d397ad4'
          test "$(git hash-object prior/TCEC_S29.pgn)" = '68141d7a9afad301c237106c3b2a3324cb35b130'
          sha256sum prior/TCEC_S28.pgn prior/TCEC_S29.pgn > output/PRIOR_TCEC_SOURCE_SHA256.txt
      - name: Run full TWIC PGN history legality and pre-score pin / nonpin selection
        run: |
          python -u harness/c3x_015_TWIC1665_scoreblind_original_source_freeze.py \
             --zip input/TWIC1665_ORIGINAL.zip \
             --prior-pgn prior/TCEC_S28.pgn \
             --prior-pgn prior/TCEC_S29.pgn \
             --outdir output
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('output/C3X015_TWIC1665_SOURCE_CUSTODY_RECEIPT.json').read_text())
          assert d['engine_output_accessed'] is False and d['causal_transport_pass'] is False
          assert d['chosen_pin_games']==64 and d['chosen_nonpin_games']==64
          assert d['prior_lichess_013_overlap_status']=='PENDING_REFERENCE_OBJECT_ACQUISITION'
          print('C3X015_TWIC1665_P0_SOURCE_ONLY_FROZEN_CONDITIONAL_PASS')
          print('C3X015_TRUE_PROVIDER_DISJOINT_FINAL_GATE=HOLD_UNTIL_LEGACY_LICHESS_DEDUP')
          PY
      - name: Seal shareable source-only receipts and keep raw restricted source out of Git history
        if: always()
        run: |
          printf '%s\n' 'Original TWIC ZIP and full raw source are NOT included in this artifact because TWIC reserves redistribution rights. Source-only JSON is research custody, not engine-evidence or public release authorization.' > output/RAW_COPYRIGHT_AND_AUTHORITY_BOUNDARY.txt
          cp harness/c3x_015_TWIC1665_scoreblind_original_source_freeze.py output/SCORE_BLIND_SOURCE_FREEZER.py
          find output -maxdepth 1 -type f ! -name MEMBER_SHA256.txt -print0 | sort -z | xargs -0 sha256sum > output/MEMBER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-015-twic1665-original-source-only-legal-pins-and-nonpins
          path: output/
          retention-days: 30
          if-no-files-found: error
