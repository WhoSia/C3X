name: C3X 0.30 S4M Validated Endgame Proof-carrying Intervals
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c3x-030-s4m-endgame-proofs.yml'
      - 'harness/c3x_030_s4m_proof_carrying_intervals.py'
      - 'harness/test_c3x_030_s4m_proof_carrying_intervals.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interval-proof-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin independent legal chess evaluator
        run: python -m pip install -q chess==1.11.2
      - name: Run verified endgame certificates and anti-forgery tests
        run: |
          set -euo pipefail
          PYTHONPATH=harness python -m unittest -v test_c3x_030_s4m_proof_carrying_intervals
      - name: Archive real legal checkmate witness and partial-branch certificate
        run: |
          set -euo pipefail
          mkdir -p artifacts
          PYTHONPATH=harness python - <<'PY'
          import chess, json, hashlib
          from pathlib import Path
          from c3x_030_s4m_proof_carrying_intervals import backup,terminal_child
          board=chess.Board()
          for move in ('f2f3','e7e5','g2g4'):board.push_uci(move)
          certificate=terminal_child(board,'d8h4')
          report=backup(board,{'d8h4':certificate})
          assert board.is_valid()
          assert (report['interval']['lower'],report['interval']['upper'])==(1,1)
          assert report['complete_legal_branch_coverage'] is False
          assert report['stockfish_mediation_proven'] is False
          target=Path('artifacts/S4M_REAL_LEGAL_TERMINAL_WITNESS.json')
          target.write_text(json.dumps(report,indent=2,sort_keys=True)+'\\n')
          print('S4M_REAL_LEGAL_TERMINAL_WITNESS',len(report['unknown_legal_moves']),hashlib.sha256(target.read_bytes()).hexdigest())
          PY
      - name: Explicit paper provenance and non-evidence claims
        run: |
          set -euo pipefail
          mkdir -p artifacts
          echo 'This checks genuinely legal terminal chess states including the forced Fool mate certificate and sound partial-coverage bounds. The idea extends Herbeck & Barth (1996) bound-specific rule tags with a strict observed-source versus formal-outcome proof type barrier. No endgame tablebases, original 1996 code, entire state-space validation, Stockfish causal mediation, independent heldout game trials or empirical superiority tested. CI read-only; no bot commits.' > artifacts/SCOPE.txt
          sha256sum harness/c3x_030_s4m_proof_carrying_intervals.py harness/test_c3x_030_s4m_proof_carrying_intervals.py > artifacts/CONTRACT_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: c3x030-s4m-verified-terminal-interval-proof-contract
          path: artifacts/*
          retention-days: 90
