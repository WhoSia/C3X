name: C3X 0.14 P1 Frozen TCEC S29 Source-Disjoint Cohort
on:
  push:
    paths:
      - '.github/workflows/c3x-014-p1-tcec-source-intake.yml'
      - 'c3x/ontology/c3x-014-p1-tcec-s29-source-disjoint-eligibility-precommit.md'
      - 'harness/c3x_014_p1_tcec_s29_source_intake.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-source-pgn-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install legal chess parser and download official S29 exact commit source
        run: |
          python -m pip install --disable-pip-version-check chess==1.11.2
          mkdir -p input output-public output-sealed
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/TCEC-Chess/tcecgames/3dd69a40b3cf6ccc74144df7411ef4e8e2140286/master-archive/TCEC_Season_29_-_Superfinal.pgn' -o input/TCEC_Season_29_Superfinal.pgn
          test "$(git hash-object input/TCEC_Season_29_Superfinal.pgn)" = "68141d7a9afad301c237106c3b2a3324cb35b130"
          sha256sum input/TCEC_Season_29_Superfinal.pgn > output-public/TCEC_S29_immutable_source_sha256.txt
      - name: Apply fixed game-opening grouping and seal heldout source cohort
        run: |
          python harness/c3x_014_p1_tcec_s29_source_intake.py --pgn input/TCEC_Season_29_Superfinal.pgn --out-public output-public/P1_source_eligible_development.json --out-sealed output-sealed/P1_SEALED_DO_NOT_READ.json
          python - <<'PY'
          import json
          p=json.load(open('output-public/P1_source_eligible_development.json'))
          s=json.load(open('output-sealed/P1_SEALED_DO_NOT_READ.json'))
          assert p['eligibility_pass']
          assert len(p['development_games'])==4
          assert p['holdout_game_count']==4
          assert len(p['procedurally_sealed_holdout_group_hashes'])==4
          assert len(s['holdout_games'])==4
          assert len(set(p['procedurally_sealed_holdout_group_hashes']).intersection({x['opening_group_hash'] for x in p['development_games']}))==0
          assert all(g['ply']==18 for g in p['development_games'])
          assert p['engine_scores_observed'] is False
          print('P1_DISJOINT_DEV_HOLDOUT_FROZEN_SOURCE_GATE_PASS')
          PY
      - name: Preserve independent public development evidence and read-only source contract
        if: always()
        run: |
          cp harness/c3x_014_p1_tcec_s29_source_intake.py output-public/P1_intake_code.py
          cp c3x/ontology/c3x-014-p1-tcec-s29-source-disjoint-eligibility-precommit.md output-public/P1_SOURCE_PRECOMMIT.md
          printf '%s\n' 'This cohort gate has no engine scores; source-file/group independence only. No new conceptual causality proven.' > output-public/SCIENTIFIC_AUTHORITY.txt
          find output-public -maxdepth 1 -type f ! -name 'P1_public_sha256_manifest.txt' -print0 | sort -z | xargs -0 sha256sum > output-public/P1_public_sha256_manifest.txt
          if test -f output-sealed/P1_SEALED_DO_NOT_READ.json; then
            sha256sum output-sealed/P1_SEALED_DO_NOT_READ.json > output-sealed/P1_sealed_sha256_manifest.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-014-p1-public-development-s29-source-frozen
          path: output-public/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3x-014-p1-procedurally-sealed-holdout-s29
          path: output-sealed/
          if-no-files-found: error
          retention-days: 90
