name: p22-selective-relation-transport-repair
# Native P22 executor repair; frozen design run remains 36126640625.
on:
  push:
    paths:
      - ".github/workflows/p22-selective-repair.yml"
permissions:
  actions: read
  contents: read
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p22-core-balance-design
          path: design/core
          repository: WhoSia/C3X
          run-id: 36126640625
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: p22-carrier-balance-design
          path: design/carrier
          repository: WhoSia/C3X
          run-id: 36126640625
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: p21-instrument-packet
          path: instrument
          repository: WhoSia/C3X
          run-id: 36041727983
          github-token: ${{ github.token }}
      - name: Execute frozen core and carrier selective families
        run: |
          chmod +x instrument/p20/packet/c3x-p20-* instrument/inanis/inanis-instrument
          mkdir -p results
          ENGINES=(--engine stockfish_19,stockfish_uci,instrument/p20/packet/c3x-p20-sf19 --engine berserk,env,instrument/p20/packet/c3x-p20-berserk --engine ethereal,env,instrument/p20/packet/c3x-p20-ethereal)
          for F in KQQvKQ KQRvKQ KQQvKR KQRvKR KRBvKB KRNvKB KRBvKN KRNvKN; do
            python3 harness/p22_selective.py core-vertex --precommit design/core/p22-core-precommit.json "${ENGINES[@]}" --inanis instrument/inanis/inanis-instrument --family "$F" --nodes 300000 --out "results/p22-core-vertex-$F.json"
          done
          for F in KQQPvKQP KQRPvKQP KQQPvKRP KQRPvKRP KRBPvKBP KRNPvKBP KRBPvKNP KRNPvKNP; do
            python3 harness/p22_selective.py carrier-vertex --precommit design/carrier/p22-carrier-precommit.json "${ENGINES[@]}" --inanis instrument/inanis/inanis-instrument --family "$F" --nodes 300000 --out "results/p22-carrier-vertex-$F.json"
          done
      - name: Adjudicate frozen lanes and synthesize
        run: |
          python3 harness/p22_selective.py core-adjudicate --precommit design/core/p22-core-precommit.json --results results --out p22-core-adjudication.json
          python3 harness/p22_selective.py carrier-adjudicate --precommit design/carrier/p22-carrier-precommit.json --results results --out p22-carrier-adjudication.json
          python3 harness/p22_selective.py synthesize --core p22-core-adjudication.json --carrier p22-carrier-adjudication.json --out p22-synthesis.json
          cat p22-synthesis.json
      - uses: actions/upload-artifact@v4
        with:
          name: p22-selective-final
          path: |
            results/*.json
            p22-core-adjudication.json
            p22-carrier-adjudication.json
            p22-synthesis.json
          retention-days: 30
