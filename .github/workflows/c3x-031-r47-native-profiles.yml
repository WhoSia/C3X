name: C3X R47 actual native evaluation profiles
on:
  push:
    branches: [main]
    paths:
      - 'product/test_c3x_native_profiles.py'
      - '.github/workflows/c3x-031-r47-native-profiles.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'chess==1.11.2'
      - uses: actions/download-artifact@v4
        with:
          repository: WhoSia/C3X
          run-id: '44872473600'
          name: c3x031-p2-pinned-SF16-native-source-build-no-treatments
          github-token: ${{ github.token }}
          path: /tmp/r47-profile-build
      - name: Execute both real native evaluation profiles
        run: |
          chmod +x /tmp/r47-profile-build/c3x031-p2-SF16-pre-R33-reference
          PYTHONPATH=product python -u product/test_c3x_native_profiles.py /tmp/r47-profile-build/c3x031-p2-SF16-pre-R33-reference /tmp/r47-profile-build/nn-5af11540bbfe.nnue /tmp/r47-profiles
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: c3x-r47-native-profile-receipts
          path: /tmp/r47-profiles/
          retention-days: 30
          if-no-files-found: error
