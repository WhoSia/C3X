[package]
name = "c3x-lineage"
version = "0.1.0"
edition = "2021"
description = "Deterministic intervention-stable event-lineage compiler for C3X P33"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
